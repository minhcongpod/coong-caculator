<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Coong Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coong">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: phone column (max 440px), built from the Figma file "Coong Calculator · nhóm". Screens: Trang chủ (danh sách nhóm) → Tạo/Chỉnh sửa nhóm → Nhóm (khoản chi + thu chi) → Tổng kết. Bottom sheets for role and long-press. */
:root{
  color-scheme:dark;
  --ink:#000; --paper:#fff; --card:#1c1c1c; --chip:#2c2c2c; --deep:#141414; --sheet:#1c1c1c;
  --mute:rgba(255,255,255,.55); --faint:rgba(255,255,255,.3); --line:rgba(255,255,255,.1);
  --yellow:#fc0; --cyan:#00c0e8; --red:#ff383c; --pink:#ff2d92; --green:#34c759;
  --red-bg:rgba(255,56,60,.18);
  --font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}input,textarea{outline:0}
input{font:inherit;color:inherit}
p,h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
svg{display:block;flex:none}
.app{max-width:440px;margin:0 auto;padding-top:24px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.circ{display:flex;align-items:center;justify-content:center;border-radius:100px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* header */
.logo{display:flex;align-items:baseline;gap:8px;min-height:48px}
.logo b{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.logo span{font-size:16px;font-weight:500;color:var(--yellow)}
.back{width:52px;height:52px;background:var(--card);color:var(--paper)}
.back svg{width:20px;height:20px}
.ghead{display:flex;align-items:center;gap:12px;margin:-8px 0 4px}
.ghead h1{font-size:24px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ghead .hsp{width:52px;height:52px;flex:none}
.ftitle{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.count{font-size:18px;font-weight:700;margin-top:4px}

/* home group list */
.glist{display:flex;flex-direction:column;gap:12px}
.gcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:41px;padding:16px 16px 16px 16px;transition:transform .25s var(--ease)}
.gcard:active{transform:scale(.98)}
.gcard .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.gico{width:50px;height:50px;background:var(--deep);color:#3a3a3a}
.gico svg{width:26px;height:26px}
.gcard .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard .t b{font-size:16px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .t small{font-size:13px;line-height:18px;color:var(--mute);font-weight:500}
.pen{width:40px;height:40px;margin:-8px 0;color:var(--paper);background:none}
.pen svg{width:24px;height:24px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:60vh;text-align:center}
.empty .gico{width:80px;height:80px;background:var(--card);color:#8e8e8e}
.empty .gico svg{width:38px;height:38px}
.empty b{font-size:24px}

/* form */
.uline{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;font-size:24px;font-weight:500;padding:12px 0 16px;caret-color:var(--yellow)}
.uline::placeholder{color:var(--faint)}
.uline:focus{border-bottom-color:var(--paper)}
.lbl{font-size:14px;font-weight:700;color:var(--mute)}
.mcard .lbl:last-child{margin-bottom:12px}
.av{flex:none;width:50px;height:50px;border-radius:50%;background:var(--deep);color:#3a3a3a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av svg{width:26px;height:26px}
.av img{width:100%;height:100%;object-fit:cover}
.av.emo{background:var(--paper);font-size:28px;line-height:1}
.av.big{width:80px;height:80px;background:var(--card);color:#8e8e8e}
.av.big svg{width:38px;height:38px}
.av.big.emo{background:var(--paper);font-size:44px}
.avpick{position:relative;align-self:center;margin-top:-4px}
.avpen{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.avpen svg{width:18px;height:18px}
.uline.gname{text-align:center;font-size:20px;line-height:26px;font-weight:700;height:50px;padding:12px 0;box-sizing:border-box;border-bottom:2px solid transparent}
.uline.gname::placeholder{color:#3e3e3e}
.uline.gname:focus{border-bottom-color:transparent}
.mcard{background:var(--card);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mcard .lbl,.fcard .lbl{font-size:14px;line-height:18px;font-weight:500}
.mrow{display:flex;align-items:center;gap:16px}
.mline{flex:1;min-width:0;height:44px;box-sizing:border-box;background:none;border:0;border-bottom:2px solid rgba(255,255,255,.1);border-radius:0;outline:0;font-size:19px;font-weight:700;padding:0;caret-color:var(--yellow)}
.mline::placeholder{color:var(--faint);font-weight:600}
.yadd{width:44px;height:44px;background:var(--yellow);color:var(--ink)}
.yadd svg{width:28px;height:28px}
.mcard .chip{background:var(--chip);height:40px;font-size:16px}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.emogrid .ico{aspect-ratio:1;border-radius:50%;background:var(--chip);color:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .2s}
.emogrid .ico svg{width:55%;height:55%}
.emogrid .ico.on{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.swrow{display:flex;justify-content:space-between;padding:8px 4px 4px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--sheet),0 0 0 0 var(--paper);transition:box-shadow .2s}
.sw.on{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--paper)}
.av.ic{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c)}
.av.big.ic svg{width:44px;height:44px}
.addrow{display:flex;gap:8px}
.field{flex:1;min-width:0;height:44px;box-sizing:border-box;border-radius:100px;background:var(--card);border:0;padding:0 20px;font-size:16px;font-weight:500;outline:0;caret-color:var(--yellow)}
.field::placeholder{color:var(--faint)}

.addbtn{width:44px;height:44px;background:var(--paper);color:var(--ink)}
.addbtn svg{width:28px;height:28px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:100px;background:var(--card);font-size:15px;font-weight:700;white-space:nowrap;flex:none;transition:background .15s,color .15s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.sel{background:var(--paper);color:var(--ink)}
.chip.dark{background:var(--chip)}
.fstack{display:flex;flex-direction:column;gap:12px}
.fcard{background:var(--card);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fhead{display:flex;align-items:center;gap:12px;width:100%;font-size:16px;line-height:20px;font-weight:700;text-align:left}
.fhead span{flex:1}
.ftot small{display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--mute)}
.ftot b{display:block;font-size:32px;line-height:41px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ftot + div{margin-top:-4px}
.frow .sbtn{width:24px;height:24px;margin-right:-4px}.frow .sbtn svg{width:16px;height:16px}
.frow .sbtn.add{background:rgba(255,204,0,.25);color:var(--yellow)}.frow .sbtn.del{background:rgba(255,56,60,.25);color:var(--red)}
.frow .bpen{flex:none;width:20px;height:20px;color:var(--yellow);margin-right:-4px}
.frow .bname{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;font-size:16px;line-height:20px;font-weight:700;color:var(--paper);caret-color:var(--yellow);text-align:left}
.frow .bname::placeholder{color:rgba(255,255,255,.2)}
.frow .gq{font-weight:500;color:var(--mute)}
.frow b{flex:1;min-width:0;font-size:16px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow input{width:50%;background:none;border:0;outline:0;padding:0;text-align:right;font:inherit;font-size:16px;line-height:20px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;caret-color:var(--paper)}
.frow input::placeholder{color:var(--yellow)}
.fund{background:var(--card);border-radius:32px;padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.fund .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.fund .top div:first-child{flex:1;min-width:0}
.fund .top small{display:block;font-size:14px;line-height:18px;font-weight:700}
.fund .top b{display:block;font-size:24px;line-height:31px;color:var(--yellow);font-variant-numeric:tabular-nums}
.fund .top b.neg{color:var(--red)}
.fund .side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;line-height:16px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.fbar{height:6px;border-radius:6px;background:var(--card);overflow:hidden}.fund .fbar{background:rgba(255,255,255,.1)}
.fbar i{display:block;height:100%;border-radius:6px;background:var(--yellow)}
.fund .ttl{display:flex;gap:8px;font-size:16px;line-height:20px;font-weight:700}.fund .ttl span{flex:1}.fund .ttl b{color:var(--yellow)}.fund .ttl b.neg{color:var(--red)}
.fund .ln{display:flex;gap:8px;font-size:14px;line-height:20px}.fund .ln span{flex:1;color:var(--mute)}.fund .ln b{font-variant-numeric:tabular-nums}
.fund .lns{display:flex;flex-direction:column;gap:4px}
.fnote{font-size:12px;line-height:16px;color:var(--mute)}.fnote b{color:var(--paper)}
.ghead .sub{display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--paper)}
.ghead .ttl2{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.ghead .ttl2 .sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ghead .ttl2 h1{line-height:31px}
.chip .x{width:18px;height:18px;color:var(--mute);margin-right:-4px}
.chip.more svg{width:12px;height:12px}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scroll::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x pan-y}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
*{scrollbar-width:none}

/* expense card */
.exp{background:var(--card);border-radius:32px;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease)}
.exp.press{transform:scale(.98)}
.exp .eh{display:flex;align-items:center;gap:10px;height:36px}
.cal{position:relative;flex:none;width:36px;height:36px;border-radius:10px;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.cal b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cal span{font-size:8px;font-weight:700;color:var(--yellow);margin-top:3px;letter-spacing:.02em}
.cal,.cal input,.cal input::-webkit-calendar-picker-indicator{cursor:pointer}
.cal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none}
.exp .eh .ename{flex:1;min-width:0;height:36px;display:block;line-height:36px;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:0}
.exp .eh .ename.ph{color:var(--faint)}
.exp .fold{flex:none;width:36px;height:36px;margin-right:-8px;display:flex;align-items:center;justify-content:center;background:none;color:var(--paper)}
.exp .fold svg{width:18px;height:18px;transition:transform .2s}
.exp .fold[aria-expanded="false"] svg{transform:rotate(180deg)}
.exp .ftot2{flex:none;font-size:19px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.exp .eh input.nm{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;height:36px;box-sizing:border-box;font-size:19px;font-weight:700;padding:0;caret-color:var(--yellow);user-select:text;-webkit-user-select:text}
.exp .eh input::placeholder{color:var(--faint);font-weight:500}
.ebtn{width:40px;height:40px;margin:-8px -4px -8px 0;color:var(--paper);background:none}
.ebtn svg{width:24px;height:24px}
.ebtn.ok{color:var(--green)}
.exp hr{border:0;border-top:1px solid var(--line);margin:0 0}
.exp .sub{font-size:14px;line-height:18px;font-weight:500;color:var(--mute);margin:0 0 -8px}
.exp .sub+.scroll+.flow{margin-top:-4px}
.flow+.flow{margin-top:-8px}
.flow{display:flex;align-items:center;gap:12px;background:var(--deep);border-radius:24px;padding:10px 20px;min-height:56px;box-sizing:border-box}
.flow .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:none;max-width:45%}
.flow .who b{font-size:15px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .role{display:inline-flex;align-items:center;gap:0;font-size:14px;line-height:18px;height:18px;font-weight:400;color:var(--yellow);user-select:none}
.flow .role svg{width:10px;height:10px;position:relative;top:1.5px}
.flow.donate .role{color:var(--cyan)}.flow.fixed .role{color:var(--pink)}
.flow input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-size:22px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;padding:0;caret-color:var(--paper);user-select:text;-webkit-user-select:text}
.flow input::placeholder{color:rgba(255,204,0,.35)}
.flow.donate input{color:var(--cyan)}.flow.donate input::placeholder{color:rgba(0,192,232,.35)}
.flow.fixed input{color:var(--pink)}.flow.fixed input::placeholder{color:rgba(255,45,146,.4)}
.flow .bang{font-size:16px;font-weight:700;color:var(--mute);margin-left:-6px}
.calc{display:flex;flex-direction:column;gap:8px;padding:0 8px;font-size:14px;line-height:18px}
.calc:empty{display:none}
.calc .r{display:flex;justify-content:space-between;gap:12px}
.calc .r span{color:var(--mute);font-weight:500}
.calc .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.calc .tot{line-height:20px}
.calc .tot span{color:var(--paper);font-weight:700}
.calc .tot b{color:var(--yellow);font-size:17px}
.calc .warn{color:var(--yellow);font-size:13px;font-weight:500}
.addexp{height:56px;border-radius:40px;box-shadow:inset 0 0 0 2px #4a4a4a;display:flex;align-items:center;justify-content:center}
.addexp{gap:12px;font-size:17px;font-weight:700}
.addexp svg{width:26px;height:26px}

/* summary */
.hero{background:var(--card);border-radius:32px;padding:16px 24px;display:flex;flex-direction:column;gap:2px}
.hero small{font-size:14px;font-weight:500;color:var(--mute)}
.hero .big{font-size:32px;line-height:41px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .big i{font-style:normal;font-size:24px;margin-left:4px}
.hero .meta{font-size:14px;line-height:18px;font-weight:700;color:var(--paper)}
.sh{display:flex;align-items:center;gap:12px;padding:6px 4px 0}
.sh b{font-size:20px;line-height:26px;white-space:nowrap}
.sh small{font-size:13px;font-weight:500;color:var(--mute);text-align:right}
.txs{display:flex;flex-direction:column;gap:12px}
.txcard{background:var(--card);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px}
.txcard h2,.ledger.st h2{font-size:14px;line-height:18px;font-weight:700;color:rgba(255,255,255,.5)}
.txcard .txs{gap:8px}
.txcard .tx{background:rgba(0,0,0,.3);min-height:52px}
.txcard .tx.mine{box-shadow:none}
.txcard .tx.done{opacity:.5;background:none}
.stack{display:flex;flex-direction:column;gap:12px}
.tx{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:32px;padding:12px 16px;box-sizing:border-box;transition:transform .25s var(--ease),opacity .25s}
.tx:active{transform:scale(.97)}
.tx.mine{box-shadow:inset 0 0 0 2px var(--yellow)}
.tx .chk{width:24px;height:24px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);color:transparent}
.tx .chk svg{width:16px;height:16px}
.tx .w{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tx .pair{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;min-width:0}
.tx .pair span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .pair{line-height:20px}.tx .pair svg{width:16px;height:16px;color:var(--mute)}
.tx small{font-size:13px;color:var(--mute);font-weight:500}
.tx .amt{font-size:18px;line-height:23px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx.done .amt{color:var(--green)}
.tx.done .chk{background:var(--green);box-shadow:none;color:var(--ink)}
.ledger{background:var(--card);border-radius:32px;padding:6px 16px}
.ledger.st{padding:16px 16px 2px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lrow .nm b{font-size:16px;line-height:20px;display:flex;align-items:center;gap:6px}
.lrow .nm small{font-size:12px;line-height:16px;font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:#555;color:var(--paper)}
.lrow .net{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px;line-height:20px}
.lrow .net small{font-size:12px;line-height:15px;font-weight:500}
.lrow .net.zero{color:var(--mute)}
.lrow .nm small{white-space:normal}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--mute)}
.stmt{border-top:1px solid var(--line)}
.stmt:first-of-type{border-top:0}
.stmt summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer;font-size:16px;line-height:20px}
.stmt summary::-webkit-details-marker{display:none}
.stmt summary b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stmt summary span{color:var(--yellow);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt summary svg{flex:none;width:16px;height:16px;color:var(--paper);transition:transform .2s}
.stmt[open] summary svg{transform:rotate(90deg)}
.stmt .sbody{display:flex;flex-direction:column;gap:8px;margin-top:-6px;padding:0 0 14px}
.you{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;font-weight:500;color:var(--paper);line-height:1.4}
.you.neg b:first-child{color:var(--red)}.you.pos b:first-child{color:var(--green)}
.hint{font-size:13px;color:var(--mute);font-weight:500;margin-top:-8px}
.stmt h4{font-size:16px;display:flex;justify-content:space-between;gap:12px}
.stmt h4 span{color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.sline{display:flex;gap:10px;font-size:14px;line-height:20px;color:var(--mute);font-weight:400}
.sline b{color:var(--paper)}
.sline i{flex:none;width:6px;height:6px;border-radius:6px;background:var(--yellow);margin-top:7px}
.sline.g i{background:var(--green)}.sline.r i{background:var(--pink)}.sline.rest i{background:var(--red)}
.tgrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:32px;padding:12px 16px;min-height:52px;box-sizing:border-box;font-size:16px;line-height:20px;font-weight:700;text-align:left}
.tgrow span{flex:1}.tgrow small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.tgl{flex:none;position:relative;width:48px;height:28px;border-radius:28px;background:#555;transition:background .25s}
.tgl b{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:22px;background:var(--paper);transition:transform .3s var(--ease)}
.tgl.on{background:var(--green)}.tgl.on b{transform:translateX(20px)}
.sync{margin-left:auto;align-self:center;flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:100px;background:var(--card);font-size:13px;font-weight:700;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:8px;background:var(--mute)}
.sync.ok i{background:var(--green)}.sync.err i{background:var(--red)}.sync.saving i{background:var(--yellow)}
.linkbox{width:100%;box-sizing:border-box;height:48px;border-radius:100px;border:0;background:#000;color:var(--yellow);font:700 14px var(--font);padding:0 18px;outline:0}
.note{background:var(--card);border-radius:28px;padding:28px 20px;text-align:center;color:var(--mute);font-weight:500;font-size:15px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--ink) 35%)}
.bar .in{max-width:440px;margin:0 auto;display:flex;gap:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:40px;background:var(--paper);color:var(--ink);font-size:17px;font-weight:700;text-align:center;transition:transform .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
.btn.danger{background:var(--red-bg);color:var(--red)}

/* sheet */
.dim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);animation:dimIn .18s ease}
@keyframes dimIn{from{opacity:0}}
.exp.lift{position:relative;z-index:31}
.lacts{position:relative;z-index:31;display:flex;gap:16px;animation:dimIn .18s ease}
.chip .cnt{font-weight:500;font-size:.85em;color:#8a8a8a;margin-left:2px}
.lacts .danger{background:#3d0f10}
.dlg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:24px;animation:dimIn .18s ease}
.dbox{width:100%;max-width:342px;box-sizing:border-box;background:var(--card);border-radius:32px;padding:28px 24px 24px;text-align:center;display:flex;flex-direction:column;gap:12px}
.dbox h3{font-size:20px;line-height:28px;font-weight:700;overflow-wrap:anywhere}
.dbox p{font-size:14px;line-height:20px;color:var(--mute);font-weight:500}
.dbox .acts{display:flex;gap:8px;margin-top:8px}
.dbox .btn{height:52px}
.btn.quiet{background:#333;color:var(--paper)}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .sb{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .25s}
.sheet .sp{position:relative;width:100%;max-width:488px;max-height:90vh;overflow:auto;background:var(--sheet);border-radius:32px 32px 0 0;padding:36px max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:up .35s var(--ease)}
.sheet .sp::before{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;margin-left:-22px;border-radius:6px;background:#555}
.sheet h3{font-size:24px;font-weight:700;margin-bottom:4px}
.sheet p{font-size:15px;color:var(--mute);font-weight:500}
.sheet .acts{display:flex;gap:10px;margin-top:8px}
.ropts{display:flex;flex-direction:column;gap:8px}
.ropts + .amtbox{margin-top:8px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.rhead h3{margin:0;text-align:left}
.rok{width:40px;height:40px;background:var(--yellow);color:var(--ink)}
.rok svg{width:24px;height:24px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 16px 12px 24px;border-radius:32px;background:rgba(0,0,0,.3);box-sizing:border-box;text-align:left}
.opt span{flex:1;display:flex;flex-direction:column}
.opt b{font-size:16px;line-height:20px}.opt small{font-size:13px;line-height:18px;font-weight:400;opacity:.5}
.opt .rd{flex:none;width:22px;height:22px;border-radius:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.opt.on{background:var(--paper);color:var(--ink)}
.opt.on .rd{box-shadow:inset 0 0 0 7px var(--ink)}
.amtbox{display:flex;align-items:center;gap:8px;height:56px;border-radius:32px;box-shadow:inset 0 0 0 1px var(--paper);padding:0 24px;box-sizing:border-box}
.amtbox label{font-size:16px;font-weight:700;color:var(--paper);white-space:nowrap}
.amtbox .note{flex:1;text-align:left;min-width:0;background:none;border:0;outline:0;font-size:16px;font-weight:700;color:var(--paper);padding:0;caret-color:var(--yellow)}
.amtbox .note::placeholder{color:rgba(255,255,255,.3)}
.flow .who .fnote2{font-size:12px;color:var(--mute);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amtbox input:not(.note){flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;caret-color:var(--paper)}
.amtbox.donate input{color:var(--cyan)}.amtbox.fixed input{color:var(--pink)}
.amtbox .bang{font-weight:700;color:var(--mute)}

.shot{width:100%;border-radius:20px;display:block}
.sheet .sp > .btn{flex:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;padding:12px 20px;border-radius:100px;transition:opacity .25s,transform .35s var(--ease);white-space:nowrap;max-width:calc(100% - 48px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .4s}
@keyframes shake{20%{translate:-8px 0}40%{translate:7px 0}60%{translate:-5px 0}80%{translate:3px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
/* ================= storage & model =================
   group = { id, name, members:[{id,name}], exps:[expense], round, done:{} }
   expense = { id, name, parts:[memberId], flows:[{ id:memberId, role:'pay'|'donate'|'fixed', amt }] }
   - "Chi tiền" (pay): người này trả số tiền đó cho khoản chi và vẫn chia đều như mọi người.
   - "Donate": ủng hộ một khoản, không phải chia đều.
   - "Đóng cố định": đến muộn / về sớm / thực tập, chỉ đóng đúng số đó.
   Tổng chi = tổng tiền "Chi tiền". Phần còn lại sau khi trừ donate và cố định chia đều cho những người tham gia còn lại. */
const KEY = 'coong_calc_v4';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let uid = 1;
const mem = n => ({ id: uid++, name: n });
function sample(){
  const g1 = { id: uid++, name: 'Ăn trưa', members: ['An','Bình','Chi','Dũng','Hùng'].map(mem), exps: [], round: true, done: {} };
  const [an, binh, chi, dung, hung] = g1.members.map(m => m.id);
  g1.exps.push({ id: uid++, at: Date.now() - 5400000, name: 'Bún chả', parts: [an, binh, chi, dung, hung], flows: [{ id: an, role: 'pay', amt: 3000000 }, { id: binh, role: 'donate', amt: 1000000 }, { id: chi, role: 'fixed', amt: 100000 }] });
  g1.exps.push({ id: uid++, at: Date.now() - 1800000, name: 'Bánh cuốn', parts: [an, binh], flows: [{ id: an, role: 'pay', amt: 300000 }] });
  const mkg = (name, names) => ({ id: uid++, name, members: names.map(mem), exps: [], round: true, done: {} });
  return [g1,
    mkg('Cầu lông tối thứ Tư', ['An','Hùng','Bảo','Linh','Minh','Tú']),
    mkg('Sinh nhật Mai', ['Mai','An','Bình','Chi','Dũng','Linh','Hà','Quân']),
    mkg('Cà phê sáng', ['An','Bình','Chi'])];
}
/* bring over cuộc vui from the previous version once */
function fromV3(old = store.get('coong_calc_v3')){
  if (!old || !Array.isArray(old.events)) return null;
  return old.events.filter(e => !e.sample && e.members?.length).map(e => {
    const exps = (e.stages || []).filter(s => Number(s.total) > 0).map(s => {
      const pays = (s.payers || []).filter(x => e.members.some(m => m.id === x.id));
      return { id: s.id, name: s.name || '', parts: (s.parts || []).slice(),
        flows: pays.map(x => ({ id: x.id, role: 'pay', amt: pays.length === 1 ? Number(s.total) : Number(x.amt) || 0 })) };
    });
    e.members.forEach(m => {               // old per-outing donate / fixed → first expense they joined
      const amt = m.role === 'donate' ? m.donate : m.role === 'custom' ? m.amount : 0;
      const ex = amt && exps.find(x => x.parts.includes(m.id));
      if (ex && !ex.flows.some(f => f.id === m.id)) ex.flows.push({ id: m.id, role: m.role === 'donate' ? 'donate' : 'fixed', amt });
    });
    return { id: e.id, name: e.name || 'Cuộc vui', members: e.members.map(m => ({ id: m.id, name: m.name })), exps, round: e.round !== false, done: {} };
  });
}
/* ================= cloud sync =================
   iPhone keeps a home-screen app's storage separate from Safari's, so localStorage alone looks like a "reset".
   Each person gets a private sổ (book) code in the URL (/s/CODE); data lives in Firestore under that code
   (REST, no SDK) plus a local copy for offline use. Newest change (updatedAt) wins. */
const FS_URL = 'https://firestore.googleapis.com/v1/projects/quanlyquy-f5fce/databases/(default)/documents/books/';
const FS_KEY = 'AIzaSyCyQv6aBKLrzUyzBw5hc36fe9kbifKiPrI';
const BOOK = 'coong_book', CODE_RE = /[A-Za-z0-9]{20,40}/;
const onWeb = /^https?:$/.test(location.protocol) && !/claude|anthropic|usercontent/.test(location.hostname);

const hadLocal = !!store.get(KEY) || !!store.get('coong_calc_v3');
let root = store.get(KEY);
if (!root || !Array.isArray(root.groups)) {
  const prev = fromV3(), v3 = store.get('coong_calc_v3') || {};
  root = { groups: onWeb ? (prev && prev.length ? prev : sample().slice(0, 1)) : [...sample(), ...(prev || [])], me: v3.me || '', updatedAt: v3.updatedAt || 0 };
}
root.updatedAt = root.updatedAt || (hadLocal ? 1 : 0);   // 0 = only the built-in example; cloud data always wins over it
const fixUid = () => { uid = Math.max(uid, ...root.groups.flatMap(g => [g.id, ...g.members.map(m => m.id), ...g.exps.map(e => e.id)])) + 1; };
fixUid();
store.set(KEY, root);

const newCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; return [...crypto.getRandomValues(new Uint8Array(22))].map(x => a[x % a.length]).join(''); };
const urlCode = (location.pathname.match(/^\/s\/([A-Za-z0-9]{20,40})\/?$/) || [])[1];
let book = urlCode || store.get(BOOK) || newCode();
let syncState = onWeb ? 'saving' : 'off', pushT = null;
function setBook(code){ book = code; store.set(BOOK, code); if (onWeb && location.pathname !== '/s/' + code) window.history.replaceState(null, '', '/s/' + code); }
if (onWeb) setBook(book);
const bookLink = () => `${location.origin}/s/${book}`;
const syncLabel = () => `<i></i>${{ ok: 'Đã lưu online', saving: 'Đang lưu…', err: 'Chưa lưu online' }[syncState] || ''}`;
function setSync(st){ syncState = st; const b = document.getElementById('syncBtn'); if (b) { b.className = 'sync ' + st; b.innerHTML = syncLabel(); } }
const save = () => { root.updatedAt = Date.now(); store.set(KEY, root); schedulePush(); };
function schedulePush(){ if (!onWeb) return; clearTimeout(pushT); setSync('saving'); pushT = setTimeout(push, 700); }
async function push(){
  if (!onWeb) return;
  try {
    if (!root.updatedAt) root.updatedAt = 1;
    const body = { fields: { data: { stringValue: JSON.stringify({ v: 4, root }) }, updatedAt: { integerValue: String(root.updatedAt) } } };
    const r = await fetch(`${FS_URL}${book}?key=${FS_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true });
    if (!r.ok) throw new Error(r.status);
    store.set(KEY, root); setSync('ok');
  } catch(e) { setSync('err'); }
}
async function pull(){
  try {
    const r = await fetch(`${FS_URL}${book}?key=${FS_KEY}`, { cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    return { at: Number(j.fields?.updatedAt?.integerValue || 0), data: JSON.parse(j.fields?.data?.stringValue || 'null') };
  } catch(e) { setSync('err'); return undefined; }
}
function applyRemote(remote){
  const d = remote.data; if (!d || !d.root) return false;
  let next = d.root;
  if (!Array.isArray(next.groups) && Array.isArray(next.events)) next = { groups: fromV3(next) || [], me: next.me || '' };   // book saved by the older app
  if (!Array.isArray(next.groups)) return false;
  if (hadLocal) store.set(KEY + '_backup', root);
  root = next; root.me = root.me || ''; root.updatedAt = remote.at;
  fixUid(); store.set(KEY, root);
  return true;
}
async function syncNow(){
  if (!onWeb) return;
  setSync('saving');
  const remote = await pull();
  if (remote === undefined) return;
  if (remote && remote.at > root.updatedAt) {
    if (applyRemote(remote)) {
      $('#sheet').hidden = true;
      if (G) G = root.groups.find(g => g.id === G.id) || null;
      if (!G && view !== 'home') view = 'home';
      if (view !== 'form') { const y = scrollY; render(); window.scrollTo({ top: y }); }
    }
    setSync('ok');
  } else if (!remote || remote.at < root.updatedAt) push();
  else setSync('ok');
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); else if (pushT) { clearTimeout(pushT); push(); } });
try { navigator.storage?.persist?.(); } catch(_) {}

/* ui state */
let view = 'home', G = null, draft = null, editing = null, expanded = false, R = null;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n || 0).toLocaleString('vi-VN');
const pad = n => String(n).padStart(2, '0');
const parseMoney = v => Number(String(v).replace(/\D/g,'')) || 0;
const svg = (id, cls='') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const low = s => String(s).trim().toLowerCase();
const isMe = n => root.me && low(n) === low(root.me);
const FUND = -1;
const nm = id => id === FUND ? 'Quỹ chung' : G.members.find(m => m.id === id)?.name || '?';
const txKey = t => `${t.from}>${t.to}:${t.amount}`;
const ROLE = { pay: ['Chi tiền', ''], donate: ['Tài trợ', ''], fixed: ['Đóng cố định', 'Đến muộn hoặc về sớm, suất ưu tiên.'] };
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); };

/* ================= settlement ================= */
function settleExp(g, e){
  const has = id => g.members.some(m => m.id === id);
  const flows = e.flows.filter(f => has(f.id) || (f.id === FUND && g.fund?.on && f.role === 'pay'));
  const pays = flows.filter(f => f.role === 'pay'), fixed = flows.filter(f => f.role !== 'pay');
  const total = pays.reduce((a, f) => a + (Number(f.amt) || 0), 0);
  const F = fixed.reduce((a, f) => a + (Number(f.amt) || 0), 0);
  const fixedIds = new Set(fixed.map(f => f.id));
  const parts = e.parts.filter(has);
  let sharers = parts.filter(id => !fixedIds.has(id)), warn = '';
  const rest = total - F;
  if (rest < -0.5) warn = 'Tài trợ và đóng cố định đang lớn hơn tổng chi.';
  else if (!sharers.length && rest > 0.5) { sharers = parts.length ? parts : pays.map(f => f.id); warn = 'Không còn ai chia đều, phần còn lại chia cho tất cả người tham gia.'; }
  const per = sharers.length ? Math.max(rest, 0) / sharers.length : 0;
  return { total, pays, fixed, F, rest, sharers, per, warn };
}
function settle(g){
  const cost = {}, paid = {}, detail = {}, warns = [];
  g.members.forEach(m => { cost[m.id] = 0; paid[m.id] = 0; });
  let grand = 0, spent = 0;
  g.exps.forEach(e => {
    const d = settleExp(g, e); detail[e.id] = d;
    if (d.total <= 0) return;
    grand += d.total;
    if (d.warn) warns.push(`${e.name || 'Khoản chi'}: ${d.warn}`);
    d.pays.forEach(f => { if (f.id === FUND) spent += Number(f.amt) || 0; else paid[f.id] += Number(f.amt) || 0; });
    d.fixed.forEach(f => cost[f.id] += Number(f.amt) || 0);
    d.sharers.forEach(id => cost[id] += d.per);
  });
  const own = { ...paid }, contrib = {}; let put = 0;
  const base = g.fund?.on ? spons(g.fund).reduce((a, x) => a + (Number(x.amt) || 0), 0) : 0, share = {};
  g.members.forEach(m => { contrib[m.id] = g.fund?.on ? Number(g.fund.contrib?.[m.id]) || 0 : 0; put += contrib[m.id]; });
  put += base; g.members.forEach(m => share[m.id] = contrib[m.id] + (g.members.length ? base / g.members.length : 0));
  if (spent) g.members.forEach(m => paid[m.id] += put ? share[m.id] * spent / put : spent / g.members.length);
  if (spent > put) warns.push(`Quỹ chung đã tiêu vượt số góp ${fmt(spent - put)}, phần vượt chia theo phần góp.`);
  const fund = { on: !!g.fund?.on, put, base, sponsors: g.fund?.on ? spons(g.fund).filter(x => Number(x.amt)) : [], contrib: put - base, spent, left: put - spent };
  const unit = g.round ? 1000 : 1;
  const nets = g.members.map(m => ({ id: m.id, name: m.name, own: own[m.id], contrib: contrib[m.id], share: share[m.id], paid: paid[m.id], cost: cost[m.id], net: Math.round((paid[m.id] - cost[m.id]) / unit) * unit }));
  const resid = nets.reduce((a, n) => a + n.net, 0);
  if (resid && nets.length) { const big = nets.reduce((a, b) => Math.abs(b.net) > Math.abs(a.net) ? b : a); big.net -= resid; }
  const debt = nets.filter(n => n.net < 0).map(n => ({ id: n.id, a: -n.net })).sort((a, b) => b.a - a.a);
  const cred = nets.filter(n => n.net > 0).map(n => ({ id: n.id, a: n.net })).sort((a, b) => b.a - a.a);
  const txs = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const p = Math.min(debt[i].a, cred[j].a);
    if (p > 0) txs.push({ from: debt[i].id, to: cred[j].id, amount: p });
    debt[i].a -= p; cred[j].a -= p;
    if (debt[i].a === 0) i++; if (cred[j].a === 0) j++;
  }
  return { grand, nets, txs, detail, warns, fund };
}
window.coongSettle = settle;

/* ================= views ================= */
/* Pháo hoa giống Coong Cafe: bắn từ hai bên vào giữa màn hình rồi nổ */
function fireworks(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const COLORS = ['#ffcc00', '#ffffff', '#ff9500', '#34c759', '#ff375f', '#64d2ff'];
  const w = innerWidth, h = innerHeight, dpr = Math.min(2, devicePixelRatio || 1), cv = document.createElement('canvas');
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.cssText = `position:fixed;left:0;top:0;width:${w}px;height:${h}px;pointer-events:none;z-index:60`;
  cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  let ps = [], raf = 0, stopped = false; const shots = [], rnd = (a, b) => a + Math.random() * (b - a);
  const launch = side => { const x0 = side < 0 ? -4 : w + 4, y0 = rnd(h * .62, h * .8);
    const tx = w / 2 + rnd(-w * .22, w * .22) + (side < 0 ? -w * .12 : w * .12), ty = rnd(h * .16, h * .38);
    shots.push({ x: x0, y: y0, tx, ty, t: 0, dur: rnd(520, 760), x0, y0 }); };
  const burst = (x, y) => { const col = [COLORS[Math.random() * COLORS.length | 0], COLORS[Math.random() * COLORS.length | 0]];
    for (let i = 0; i < 46; i++) { const a = Math.random() * Math.PI * 2, v = rnd(1.2, 4.6);
      ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rnd(900, 1500), c: col[i % 2], r: rnd(1.4, 2.8) }); } };
  [0, 380, 760, 1180].forEach(d => setTimeout(() => { if (!stopped) { launch(-1); launch(1); } }, d));
  let last = performance.now(); const end = last + 4200;
  const stop = () => { stopped = true; cancelAnimationFrame(raf); cv.remove(); };
  const frame = now => {
    const dt = Math.min(40, now - last); last = now; g.clearRect(0, 0, w, h);
    for (let i = shots.length - 1; i >= 0; i--) { const s = shots[i]; s.t += dt;

  if (!R.grand) return `<section class="view">${head}<p class="note">Chưa có khoản chi nào. Quay lại, thêm khoản chi và chọn người chi tiền.</p></section>`;
  const F = R.fund, fundBox = F.on && (F.put || F.spent) ? fundCard(R) : '';
  const warns = R.warns.map(w => `<p class="note" style="color:var(--yellow);padding:14px 18px;text-align:left">${esc(w)}</p>`).join('');
  const order = [...R.txs].sort((a, b) => (!!G.done[txKey(a)] - !!G.done[txKey(b)]) || b.amount - a.amount);
  const txs = R.txs.length ? `<div class="txcard"><h2>Ai chuyển cho ai?</h2><div class="txs">${order.map(t => {
    const done = !!G.done[txKey(t)];
    return `<button class="tx ${done ? 'done' : ''}" data-tx="${esc(txKey(t))}" aria-pressed="${done}"><span class="circ chk">${svg('i-check')}</span>
      <span class="w"><span class="pair"><span>${esc(nm(t.from))}</span>${svg('i-arrow')}<span>${esc(nm(t.to))}</span></span></span>
      <span class="amt">${fmt(t.amount)}</span></button>`;
  }).join('')}</div></div>` : `<p class="note">Hòa cả làng, không ai phải chuyển cho ai.</p>`;
  const extra = {};
  G.exps.forEach(e => (R.detail[e.id]?.fixed || []).forEach(f => { const x = extra[f.id] ||= { donate: 0, fixed: 0 }; x[f.role === 'donate' ? 'donate' : 'fixed'] += f.amt; }));
  const rank = n => n.net > 0 ? [0, -n.net] : n.net < 0 ? [1, n.net] : [2, 0];
  const nets = [...R.nets].sort((a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1]; });
  const people = `<div class="ledger">${nets.map(n => {
    const x = extra[n.id] || { donate: 0, fixed: 0 }, share = Math.round(n.cost - x.donate - x.fixed), bits = [];
    if (share > 0) bits.push(`Phải chịu: ${fmt(share)}`);
    if (n.own) bits.push(`Đã chi: ${fmt(n.own)}`);
    if (n.contrib) bits.push(`Đã góp: ${fmt(n.contrib)}`);
    if (x.donate) bits.push(`Tài trợ: ${fmt(x.donate)}`);
    if (x.fixed) bits.push(`Đóng cố định: ${fmt(x.fixed)}`);
    const net = n.net > 0 ? `<span class="net pos"><small>Nhận lại</small>+${fmt(n.net)}</span>` : n.net < 0 ? `<span class="net neg"><small>Thiếu</small>−${fmt(-n.net)}</span>` : `<span class="net zero">0</span>`;
    return `<button class="lrow" data-me="${esc(n.name)}"><span class="nm"><b>${esc(n.name)}${isMe(n.name) ? '<span class="badge">Tôi</span>' : ''}</b><small>${bits.join(' · ') || 'Không tham gia'}</small></span>${net}</button>`;
  }).join('')}</div>`;
  const stList = byDate(G.exps).filter(e => R.detail[e.id].total > 0);
  const stmts = `<div class="ledger st"><h2>${stList.length} khoản chi tất cả!</h2>${stList.map(e => {
    const d = R.detail[e.id];
    return `<details class="stmt"><summary><b>${esc(e.name || 'Khoản chi')}</b><span>${fmt(d.total)}</span>${svg('i-chev')}</summary><div class="sbody">
      <div class="sline"><i></i><span>${[...d.pays].filter(f => Number(f.amt) > 0).sort((x, y) => (y.id === FUND) - (x.id === FUND)).map(f => `<b>${esc(nm(f.id))}</b> chi ${f.note && f.id !== FUND ? `${esc(f.note)} ` : ''}<b>${fmt(f.amt)}</b>`).join(', ')}</span></div>
      ${d.fixed.map(f => `<div class="sline ${f.role === 'donate' ? 'g' : 'r'}"><i></i><span><b>${esc(nm(f.id))}</b> ${f.role === 'donate' ? 'tài trợ' : 'đóng cố định'} <b>${fmt(f.amt)}</b></span></div>`).join('')}
      ${d.sharers.length ? `<div class="sline rest"><i></i><span>${d.fixed.length ? `Còn <b>${fmt(d.rest)}</b> chia đều` : 'Chia đều'} cho ${d.sharers.map(id => esc(nm(id))).join(', ')}: Mỗi người <b>${fmt(d.per)}</b></span></div>` : ''}</div></details>`;
  }).join('')}</div>`;
  return `<section class="view">${head}<div class="stack">${fundBox}${warns}${people}${stmts}${txs}
    <button class="tgrow" id="roundBtn" aria-pressed="${!!G.round}"><span>Làm tròn đến 1.000</span><i class="tgl ${G.round ? 'on' : ''}"><b></b></i></button></div>
  </section>`;
}
function zaloText(){
  let t = `📣 ${G.name.toUpperCase()}\n━━━━━━━━━━━━━━\n💰 Tổng: ${fmt(R.grand)}\n\n`;
  byDate(G.exps).forEach((e, k) => { const d = R.detail[e.id]; if (!d.total) return;
    t += `${k+1}. ${e.name || 'Khoản chi'}: ${fmt(d.total)} (${d.pays.map(f => nm(f.id)).join(' + ')} trả)${d.sharers.length ? ` · ${fmt(d.per)}/người` : ''}\n`;
    d.fixed.forEach(f => t += `   ${f.role === 'donate' ? '🎁' : '🎓'} ${nm(f.id)} ${f.role === 'donate' ? 'tài trợ' : 'đóng cố định'} ${fmt(f.amt)}\n`); });
  if (R.fund.on && (R.fund.put || R.fund.spent)) t += `\n🏦 Quỹ chung: góp ${fmt(R.fund.put)} · tiêu ${fmt(R.fund.spent)} · ${R.fund.left < 0 ? 'vượt' : 'dư'} ${fmt(Math.abs(R.fund.left))}\n`;
  t += `\n💸 CHUYỂN KHOẢN:\n` + (R.txs.length ? R.txs.map((x, i) => `${i+1}. ${nm(x.from)} ➜ ${nm(x.to)}: ${fmt(x.amount)}${G.done[txKey(x)] ? ' ✅' : ''}`).join('\n') : 'Hòa cả làng, không ai nợ ai!');
  return t + `\n\nAnh em ting ting sớm cho các chủ xị nhé! ❤️`;
}

document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.exp'); if (!card || e.target.closest('input,button')) return;
  pressEl = card; startXY = [e.clientX, e.clientY]; card.classList.add('press');
  pressT = setTimeout(() => { card.classList.remove('press'); suppressClick = true; setTimeout(() => suppressClick = false, 600); pressSheet(+card.dataset.exp); pressT = null; }, 500);
});
const cancelPress = () => { clearTimeout(pressT); pressT = null; pressEl?.classList.remove('press'); pressEl = null; };
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
document.addEventListener('pointermove', e => { if (pressT && startXY && Math.hypot(e.clientX - startXY[0], e.clientY - startXY[1]) > 10) cancelPress(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.exp')) e.preventDefault(); });

render();
syncNow();
})();
</script>

</body></html>
