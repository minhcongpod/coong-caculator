<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Coong Nợ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coong Nợ">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="icon" href="/icon.svg?v=4" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: phone column (max 440px), built from the Figma file "Coong Calculator · nhóm". Screens: Trang chủ (danh sách nhóm) → Tạo/Chỉnh sửa nhóm → Nhóm (khoản chi + thu chi) → Tổng kết. Bottom sheets for role and long-press. */
:root{
  color-scheme:dark;
  --ink:#000; --paper:#fff; --card:#1c1c1c; --chip:#2c2c2c; --deep:#141414; --sheet:#1c1c1c;
  --mute:rgba(255,255,255,.55); --faint:rgba(255,255,255,.3); --line:rgba(255,255,255,.1);
  --yellow:#fc0; --cyan:#00c0e8; --red:#ff383c; --pink:#ff2d92; --green:#34c759;
  --red-bg:rgba(255,56,60,.18);
  --font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}input,textarea{outline:0}
input{font:inherit;color:inherit}
p,h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
svg{display:block;flex:none}
.app{max-width:342px;margin:0 auto;padding-top:24px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.circ{display:flex;align-items:center;justify-content:center;border-radius:100px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* header */
.logo{display:flex;justify-content:center;align-items:center;min-height:32px;padding-bottom:8px;margin-top:8px}
.logo .wm{width:152px;height:30.4px}
.back{width:52px;height:52px;background:var(--card);color:var(--paper)}
.back svg{width:20px;height:20px}
.ghead{display:flex;align-items:center;gap:12px;margin:-8px 0 4px}
.ghead h1{font-size:24px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ghead .hsp{width:52px;height:52px;flex:none}
.ghead .shotbtn{width:52px;height:52px;background:rgba(255,204,0,.2);color:var(--yellow)}.ghead .shotbtn svg{width:24px;height:24px}
.ftitle{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.count{font-size:18px;font-weight:700;margin-top:4px}

/* home group list */
.glist{display:flex;flex-direction:column;gap:12px}
.gcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:32px;padding:16px 24px 16px 16px;transition:transform .25s var(--ease)}
.gcard:active{transform:scale(.98)}
.gcard .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.gico{width:58px;height:58px;background:var(--deep);color:#3a3a3a}
.gico svg{width:26px;height:26px}
.gcard .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard .t b{font-size:16px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .t small{font-size:13px;line-height:18px;color:var(--mute);font-weight:500}
.pen{width:40px;height:40px;margin:-8px 0;color:var(--paper);background:none}
.pen svg{width:24px;height:24px}
.home0{min-height:calc(var(--vh,100dvh) - 24px - 122px - env(safe-area-inset-bottom,0px));gap:24px}
html:has(.home0),html:has(.home0) body{overflow:hidden}
html:has(.home0) .bar{background:none}   /* trang xin chào không cuộn: bỏ lớp đen mờ sau nút để không che chữ */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:32px}   /* minh hoạ sát logo, khoảng trống dồn vào giữa minh hoạ và lời chào */
.ill{display:flex;flex-direction:column;align-items:center;padding-top:12px;line-height:1.25;pointer-events:none;user-select:none}
.ill > div{width:100%;box-sizing:border-box;flex:none;background:var(--card);border-radius:30px;padding:15px;box-shadow:0 0 38px rgba(0,0,0,.55)}
.ill .c1{margin-top:8px}.ill .c2{margin-top:7px}.ill .c3{margin-top:4px;margin-bottom:6px}
.ill .c1{rotate:3deg;border-radius:27px;padding:15px 19px;display:flex;flex-direction:column;gap:11px;box-shadow:none}
.ill .c2{rotate:-3deg}.ill .c3{rotate:2deg;display:flex;flex-direction:column;gap:11px}
.ill .r{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.ill .c1 > .r:first-child{font-size:14px}.ill .c1 > .r:first-child em{font-size:21px;font-style:normal;color:var(--green)}
.ill .fb{height:6px;border-radius:6px;background:var(--line)}.ill .fb i{display:block;height:100%;width:62%;border-radius:6px;background:var(--green)}
.ill .ls{display:flex;flex-direction:column;gap:8px}
.ill .ls .r{font-size:13px;font-weight:400}.ill .ls .r small{font-size:13px;color:var(--mute)}.ill .ls .r em{font-style:normal;font-size:15px;font-weight:700;color:var(--green)}.ill .ls .r em.n{color:var(--red)}
.ill .h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}.ill .h > span:not(.cal){flex:1}.ill .h em,.ill .c3 em{font-style:normal;color:var(--yellow)}
.ill .cal{flex:none;width:34px;height:34px;border-radius:9.5px;background:rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:15px;font-weight:700}
.ill .cal small{font-size:7.5px;line-height:9px;color:var(--yellow)}
.ill .inp{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.3);border-radius:23px;padding:9.5px 19px;font-weight:700}
.ill .inp b{display:flex;flex-direction:column;font-size:13px;line-height:17px}.ill .inp small{font-size:11px;line-height:15px;color:var(--yellow)}
.ill .inp em{font-size:17px}.ill .c3 > .r{padding:0 7.5px;font-size:13px}.ill .c3 > .r em{font-size:15px}
.hello{display:flex;flex-direction:column;gap:24px;text-align:center}
.hello h1{font-size:min(23px,5.6vw);line-height:30px;white-space:nowrap;font-weight:700;color:var(--yellow)}
.hello h2{font-size:min(23px,5.6vw);line-height:30px;white-space:nowrap;font-weight:600;margin-top:-20px}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.steps span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:min(16px,4.1vw);line-height:20px;font-weight:700;color:rgba(255,255,255,.5);white-space:nowrap}
.steps span b{font-size:24px;line-height:30px;color:var(--yellow)}
.steps svg{width:6px;height:52px;color:rgba(255,255,255,.2)}
@media (max-height:760px){.home0{gap:12px}.welcome{gap:16px}.ill{padding-top:0}.hello{gap:16px}.hello h2{margin-top:-14px}.steps svg{height:44px}}

/* form */
.uline{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;font-size:24px;font-weight:500;padding:12px 0 16px;caret-color:var(--yellow)}
.uline::placeholder{color:var(--faint)}
.uline:focus{border-bottom-color:var(--paper)}
.lbl{font-size:14px;font-weight:700;color:var(--mute)}
.mcard .lbl:last-child{margin-bottom:4px}
.av{flex:none;width:50px;height:50px;border-radius:50%;background:var(--deep);color:#3a3a3a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av svg{width:26px;height:26px}
.av img{width:100%;height:100%;object-fit:cover}
.av.emo{background:var(--paper);font-size:28px;line-height:1}
.gcard .av{width:58px;height:58px}.gcard .av svg{width:30px;height:30px}.gcard .av.emo{font-size:32px}
.av.big{width:80px;height:80px;background:var(--card);color:#8e8e8e}
.av.big svg{width:38px;height:38px}
.av.big.emo{background:var(--paper);font-size:44px}
.avpick{position:relative;align-self:center;margin-top:-4px}
.avpen{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.avpen svg{width:18px;height:18px}
.uline.gname{text-align:center;font-size:20px;line-height:26px;font-weight:700;height:50px;padding:12px 0;box-sizing:border-box;border-bottom:2px solid transparent}
.uline.gname::placeholder{color:#3e3e3e}
.uline.gname:focus{border-bottom-color:transparent}
.mcard{background:var(--card);border-radius:32px;padding:12px;display:flex;flex-direction:column;gap:12px}
.mcard > .lbl,.mcard > .chips{margin:0 4px}
.mcard > .lbl{color:rgba(255,255,255,.5)}
.mcard .lbl,.fcard .lbl{font-size:14px;line-height:18px;font-weight:500}
.mrow{display:flex;align-items:center;gap:8px}
.mline{flex:1;min-width:0;height:52px;box-sizing:border-box;background:rgba(0,0,0,.3);border:0;border-radius:24px;outline:0;font-size:16px;line-height:20px;font-weight:700;padding:0 10px 0 16px;caret-color:var(--yellow)}
.mline::placeholder{color:#484848;font-weight:500}
.yadd{width:52px;height:52px;background:var(--yellow);color:var(--ink)}
.yadd svg{width:28px;height:28px}
.mcard .chip{background:rgba(255,255,255,.1);height:40px;font-size:16px;gap:8px;padding:0 12px 0 16px}
.mcard .chip .x{width:20px;height:20px;color:#484848;margin:0}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.emogrid .ico{aspect-ratio:1;border-radius:50%;background:var(--chip);color:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .2s}
.emogrid .ico svg{width:55%;height:55%}
.emogrid .ico.on{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.swrow{display:flex;justify-content:space-between;padding:8px 4px 4px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--sheet),0 0 0 0 var(--paper);transition:box-shadow .2s}
.sw.on{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--paper)}
.av.ic{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c)}
.av.big.ic svg{width:44px;height:44px}
/* menu trái */
.drw{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - 195px));width:min(390px,100%);z-index:30;overflow:hidden}   /* mọi thứ nằm trong khung 390 */
.drw .db{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s var(--ease)}
.drw .dp{position:absolute;top:0;bottom:0;left:0;width:300px;background:var(--ink);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 24px 0;box-sizing:border-box;transform:translateX(-100%);transition:transform .25s var(--ease)}
body.drwon .drw .db{opacity:1}body.drwon .drw .dp{transform:none}
#app,.bar{transition:transform .25s var(--ease)}
body.drwon #app,body.drwon .bar{transform:translateX(300px)}
/* phần trang bị đẩy sang chỉ lộ trong khung 390, không tràn ra ngoài */
body.drwon #app{clip-path:inset(-60px calc(100% - 66px) -4000px -30px)}
body.drwon .bar{clip-path:inset(0 calc(50% + 105px) 0 max(0px,calc(50% - 495px)))}
body.drwon{user-select:none;-webkit-user-select:none}
html:has(body.drwon),body.drwon{overflow:hidden}
.dlogo{height:45px;display:flex;align-items:center}.dlogo .wm{width:152px;height:30.4px}
.dlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;margin-top:24px;padding-bottom:16px}
.ditem{display:flex;align-items:center;gap:12px;min-height:32px;font-size:16px;line-height:23px;font-weight:600;color:var(--paper)}
.ditem span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.av.sm{width:32px;height:32px}.av.sm svg{width:16px;height:16px}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.dme{width:50px;height:50px}.av.me{width:50px;height:50px}.av.me:not(.ic){background:var(--card);color:var(--paper)}.av.me svg{width:24px;height:24px}
.btn.dnew{flex:none;width:162px}
#acAvBtn .av:not(.ic){color:var(--paper)}
.aname{display:flex;flex-direction:column;align-items:center;gap:0}
.ahandle{font-size:16px;line-height:22px;font-weight:600;color:#4a4a4a;margin-top:-6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#atHint:empty{display:none}
.athint{display:flex;align-items:center;gap:12px;width:100%;padding:8px 4px;font-size:15px;color:var(--paper)}
.athint span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:20px;text-align:left}
.athint small{font-size:13px;color:var(--mute);font-weight:500}
.athint > svg{width:22px;height:22px;color:var(--yellow)}
.athint.none{font-size:14px;color:var(--mute);font-weight:500;padding:4px}
.addrow{display:flex;gap:8px}
.field{flex:1;min-width:0;height:44px;box-sizing:border-box;border-radius:100px;background:var(--card);border:0;padding:0 20px;font-size:16px;font-weight:500;outline:0;caret-color:var(--yellow)}
.field::placeholder{color:var(--faint)}

.addbtn{width:44px;height:44px;background:var(--paper);color:var(--ink)}
.addbtn svg{width:28px;height:28px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:100px;background:var(--card);font-size:15px;font-weight:700;white-space:nowrap;flex:none;transition:background .15s,color .15s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.exp .chip{height:28px}
.chip.sel{background:var(--paper);color:var(--ink)}
.chip.dark{background:var(--chip)}
.fstack{display:flex;flex-direction:column;gap:12px}
.fcard{background:var(--card);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fhead{display:flex;align-items:center;gap:12px;width:100%;font-size:16px;line-height:20px;font-weight:700;text-align:left}
.fhead span{flex:1}
.ftot small{display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--mute)}
.ftot b{display:block;font-size:32px;line-height:41px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.frow{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.ftot + div{margin-top:-4px}
.frow .sbtn{width:24px;height:24px;margin-right:-4px}.frow .sbtn svg{width:16px;height:16px}
.frow .sbtn.add{background:var(--chip);color:var(--paper)}.frow .sbtn.del{background:rgba(255,56,60,.25);color:var(--red)}
.frow .bpen{flex:none;width:20px;height:20px;color:var(--yellow);margin-right:-4px}
.frow .bname{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;font-size:16px;line-height:20px;font-weight:700;color:var(--paper);caret-color:var(--yellow);text-align:left}
.frow .bname::placeholder{color:rgba(255,255,255,.2);text-overflow:ellipsis}
.frow .bname{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.frow .bname + input{margin-left:-4px}
.frow .gq{font-weight:400;color:var(--mute)}
.frow input:not(.bname){width:7.5em;min-width:0;flex:0 0 auto;max-width:60%}
.frow b{flex:1;min-width:0;font-size:16px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow input{width:50%;background:none;border:0;outline:0;padding:0;text-align:right;font:inherit;font-size:16px;line-height:20px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;caret-color:var(--paper)}
.frow input::placeholder{color:var(--yellow)}
.fund{background:var(--card);border-radius:32px;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.fund .top{display:flex;align-items:center;gap:0;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.fund .top small{flex:1;min-width:0;font-size:16px;line-height:20px;font-weight:700;color:#fff}
.fund .top b{font-size:24px;line-height:31px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.fund .fcar{width:20px;height:20px;flex:none;margin-left:4px;color:var(--green);transform:rotate(180deg)}
.fund.open .fcar{transform:none}
.fund .fls{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.fund .fl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:18px;font-weight:400;color:rgba(255,255,255,.5)}
.fund .fl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fund .fl span b{font-weight:500;color:#fff}
.fund .fl > b{font-size:16px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fund .fl > b.pos{color:var(--green)}.fund .fl > b.neg{color:var(--red)}
.fund .top b{color:var(--green)}.fund .top b.neg,.fund.neg .fcar{color:var(--red)}
.fund .top small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fund .side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;line-height:16px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.fbar{height:6px;border-radius:6px;background:var(--card);overflow:hidden}.fund .fbar{background:rgba(255,255,255,.1)}
.fbar i{display:block;height:100%;border-radius:6px;background:var(--yellow)}
.fund .ttl{display:flex;gap:8px;font-size:16px;line-height:20px;font-weight:700}.fund .ttl span{flex:1}.fund .ttl b{color:var(--yellow)}.fund .ttl b.neg{color:var(--red)}
.fund .ln{display:flex;gap:8px;font-size:14px;line-height:20px}.fund .ln span{flex:1;color:var(--mute)}.fund .ln b{font-variant-numeric:tabular-nums}
.fund .lns{display:flex;flex-direction:column;gap:4px}
.fnote{font-size:12px;line-height:16px;color:var(--mute)}.fnote b{color:var(--paper)}
.ghead .sub{display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--paper)}
.ghead .ttl2{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.ghead .ttl2 .sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ghead .ttl2 h1{line-height:31px}
.chip .x{width:18px;height:18px;color:var(--mute);margin-right:-4px}
.chip.more svg{width:12px;height:12px}
.scroll{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:-3px -16px;padding:3px 16px}
.scroll::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x pan-y}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
*{scrollbar-width:none}

/* expense card */
.exp{background:var(--card);border-radius:32px;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease)}
.exp.press,.scard.press{transform:scale(.98)}
.sumv .stack > :is(.fund,.ledger,.txcard){transition:transform .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.exp .eh{display:flex;align-items:center;gap:10px;height:36px}
.cal{position:relative;flex:none;width:36px;height:36px;border-radius:10px;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.cal b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cal span{font-size:8px;font-weight:700;color:var(--yellow);margin-top:3px;letter-spacing:.02em}
.cal,.cal input,.cal input::-webkit-calendar-picker-indicator{cursor:pointer}
.cal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none}
.exp .eh .ename{flex:1;min-width:0;height:36px;display:block;line-height:36px;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:0}
.exp .eh .ename.ph{color:var(--faint)}
.exp .fold{flex:none;width:36px;height:36px;margin-right:-8px;display:flex;align-items:center;justify-content:center;background:none;color:var(--paper)}
.exp .fold svg{width:18px;height:18px;transition:transform .2s}
.exp .fold[aria-expanded="false"] svg{transform:rotate(180deg)}
.exp .ftot2{flex:none;font-size:19px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.exp .eh input.nm{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;height:36px;box-sizing:border-box;font-size:19px;font-weight:700;padding:0;caret-color:var(--yellow);user-select:text;-webkit-user-select:text}
.exp .eh input::placeholder{color:var(--faint);font-weight:500}
.ebtn{width:40px;height:40px;margin:-8px -4px -8px 0;color:var(--paper);background:none}
.ebtn svg{width:24px;height:24px}
.ebtn.ok{color:var(--green)}
.exp hr{border:0;border-top:1px solid var(--line);margin:0 0}
.exp .sub{font-size:14px;line-height:18px;font-weight:500;color:var(--mute);margin:0 0 -8px}
.exp .sub+.scroll+.flow{margin-top:-4px}
.exp .calc:empty{display:none}
.flow.topf .role,.flow.topf .fnote2{color:var(--green)}.flow.topf input{color:var(--green)}.flow.topf input::placeholder{color:var(--green);opacity:1}
.flow+.flow{margin-top:-8px}
.flow{display:flex;align-items:center;gap:12px;background:var(--deep);border-radius:24px;padding:10px 16px;min-height:56px;box-sizing:border-box}
.flow .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:none;max-width:45%}
.flow .who b{font-size:15px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .role{display:inline-flex;align-items:center;gap:0;font-size:14px;line-height:18px;height:18px;font-weight:400;color:var(--yellow);user-select:none}
.flow .role svg{width:12px;height:12px;flex:none;margin-left:2px}
.flow.donate .role{color:var(--cyan)}.flow.fixed .role{color:var(--pink)}
.flow input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-size:22px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;padding:0;caret-color:var(--paper);user-select:text;-webkit-user-select:text}
.flow input::placeholder{color:var(--yellow)}
.flow.donate input{color:var(--cyan)}.flow.donate input::placeholder{color:var(--cyan)}
.flow.fixed input{color:var(--pink)}.flow.fixed input::placeholder{color:var(--pink)}
.flow .bang{font-size:16px;font-weight:700;color:var(--mute);margin-left:-6px}
.calc{display:flex;flex-direction:column;gap:8px;padding:0 16px;font-size:14px;line-height:18px}
.calc:empty{display:none}
.calc .r{display:flex;justify-content:space-between;gap:12px}
.calc .r span{color:var(--mute);font-weight:500}
.calc .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.calc .tot{line-height:20px}
.calc .tot span{color:var(--paper);font-weight:700}
.calc .tot b{color:var(--yellow);font-size:17px}
.calc .warn{color:var(--yellow);font-size:13px;font-weight:500}
.calc .share{margin:0;color:var(--mute);font-size:14px;line-height:20px;font-weight:400}
.addexp{height:56px;border-radius:40px;box-shadow:inset 0 0 0 2px #4a4a4a;display:flex;align-items:center;justify-content:center}
.addexp{gap:12px;font-size:17px;font-weight:700}
.addexp svg{width:26px;height:26px}
.addrow{display:flex;gap:12px}.addrow .addexp{flex:1;min-width:0}

/* summary */
.hero{background:var(--card);border-radius:32px;padding:16px 24px;display:flex;flex-direction:column;gap:2px}
.hero small{font-size:14px;font-weight:500;color:var(--mute)}
.hero .big{font-size:32px;line-height:41px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .big i{font-style:normal;font-size:24px;margin-left:4px}
.hero .meta{font-size:14px;line-height:18px;font-weight:700;color:var(--paper)}
.sh{display:flex;align-items:center;gap:12px;padding:6px 4px 0}
.sh b{font-size:20px;line-height:26px;white-space:nowrap}
.sh small{font-size:13px;font-weight:500;color:var(--mute);text-align:right}
.txs{display:flex;flex-direction:column;gap:12px}
.txcard{background:var(--card);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:0}
.txcard h2,.ledger.st h2{font-size:14px;line-height:18px;font-weight:700;color:rgba(255,255,255,.5)}
.txcard .txs{gap:0}
.txcard .tx{background:none;border-radius:0;padding:14px 0;min-height:0;border-bottom:1px solid rgba(255,255,255,.1)}
.txcard .tx:last-child{border-bottom:0;padding-bottom:0}
.txcard .tx.mine{box-shadow:none}
.txcard .tx.done{opacity:.5;background:none}
.txcard .tx .chk{width:20px;height:20px;box-shadow:inset 0 0 0 1.67px rgba(255,255,255,.3)}
.txcard .tx .chk svg{width:13.33px;height:13.33px}
.txcard .tx.done .chk{box-shadow:none}
.txcard .tx .amt{font-size:16px;line-height:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.tx{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:32px;padding:12px 16px;box-sizing:border-box;transition:transform .25s var(--ease),opacity .25s}
.tx:active{transform:scale(.97)}
.tx.mine{box-shadow:inset 0 0 0 2px var(--yellow)}
.tx .chk{width:24px;height:24px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);color:transparent}
.tx .chk svg{width:16px;height:16px}
.tx .w{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tx .pair{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;min-width:0}
.tx .pair span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .pair{line-height:20px}.tx .pair svg{width:16px;height:16px;color:var(--mute)}
.tx small{font-size:13px;color:var(--mute);font-weight:500}
.tx .amt{font-size:18px;line-height:23px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx.done .amt{color:var(--green)}
.tx.done .chk{background:var(--green);box-shadow:none;color:var(--ink)}
.tblw{background:var(--card);border-radius:32px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.tblw::-webkit-scrollbar{display:none}
.tbl{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{box-sizing:border-box;width:72px;min-width:72px;max-width:72px;padding:12px 4px;text-align:center;white-space:nowrap;font-size:14px;line-height:20px;font-weight:700;border-bottom:1px solid var(--line)}
.tbl th{font-size:14px;color:rgba(255,255,255,.5);padding-top:16px}.tbl th span{display:block;overflow:hidden;text-overflow:ellipsis}
.tbl tr > :first-child{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;width:108px;min-width:108px;max-width:108px;padding-left:20px;box-shadow:1px 0 0 rgba(255,255,255,.08)}
.tbl td:first-child{font-size:15px;white-space:normal;vertical-align:middle}.tbl .rl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:60px;word-break:break-word;line-height:20px}
.tbl small.ta{font-size:14px;line-height:18px;font-weight:700;color:var(--yellow)}
.tbl small{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--mute)}
.tbl .c-w{color:var(--paper)}.tbl .c-pk{color:var(--pink)}.tbl .c-y{color:var(--yellow)}.tbl .c-g{color:var(--green)}.tbl .c-r{color:var(--red)}.tbl .c-m{color:rgba(255,255,255,.25)}
.tbl thead tr > :first-child{border-top-left-radius:32px}.tbl tr.fin > :first-child{border-bottom-left-radius:32px;background:#2e2e2e}
.tbl tr.sum td{border-top:1px solid rgba(255,255,255,.25)}
.tbl tr.fin td{border-bottom:0;padding-top:14px;padding-bottom:16px;background:#2e2e2e}.tbl tr.fin > :last-child{border-bottom-right-radius:32px}
.ledger{background:var(--card);border-radius:32px;padding:6px 16px}
.ledger.st{padding:16px 16px 2px}
.prow{border-top:1px solid var(--line)}.prow:first-child{border-top:0}
.prow summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer}
.prow summary::-webkit-details-marker{display:none}
.prow summary b{flex:1;min-width:0;font-size:17px;text-align:left}
.prow .pchev{width:12px;height:12px;flex:none;transform:rotate(180deg);transition:transform .2s}
.prow[open] .pchev{transform:none}
.prow .net{font-size:16px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums}
.prow .net.pos{color:var(--green)}.prow .net.neg{color:var(--red)}.prow .net.zero{color:var(--mute)}
.prow .plines{display:flex;flex-direction:column;gap:4px;margin-top:-6px;padding:0 0 14px 20px;font-size:14px;line-height:20px;font-weight:400;color:var(--mute);text-align:left;font-variant-numeric:tabular-nums}
.flow.fundw .who b{color:var(--mute)}
.flow.idle input{color:rgba(255,204,0,.35)}
.flow.fundw input::placeholder{color:var(--yellow)}
.cmp{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center}
.cmp .cb{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.cmp .cmpc{position:relative;box-sizing:border-box;width:calc(100% - 32px);max-width:342px;margin-bottom:12px;box-shadow:0 -8px 40px rgba(0,0,0,.6);transform:translateY(calc(-1 * var(--kb,0px)));transition:transform .28s cubic-bezier(.22,1,.36,1);animation:cmpin .32s cubic-bezier(.22,1,.36,1)}
@keyframes cmpin{from{opacity:0;translate:0 24px}}
.cmp .eh .rok{flex:none}
.cmp .ampc{flex-direction:row;align-items:center;gap:12px;padding:12px}
.cmp .ampc .flow{flex:1;min-width:0;margin:0}
.cmp .ampc .rok{flex:none}
@media (prefers-reduced-motion:reduce){.cmp .cmpc{transition:none;animation:none}}
.bar:has(#bar:empty){display:none}
@media (pointer:coarse){body.kb .bar{display:none}}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lrow .nm b{font-size:16px;line-height:20px;display:flex;align-items:center;gap:6px}
.lrow .nm small{font-size:12px;line-height:16px;font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:#555;color:var(--paper)}
.lrow .net{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px;line-height:20px}
.lrow .net small{font-size:12px;line-height:15px;font-weight:500}
.lrow .net.zero{color:var(--mute)}
.lrow .nm small{white-space:normal}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--mute)}
.stmt{border-top:1px solid var(--line)}
.stmt:first-of-type{border-top:0}
.stmt summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer;font-size:16px;line-height:20px}
.stmt summary::-webkit-details-marker{display:none}
.stmt summary b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stmt summary span{color:var(--yellow);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt .pchev{width:12px;height:12px;flex:none;color:var(--paper);transform:rotate(180deg);transition:transform .2s}
.stmt[open] .pchev{transform:none}
.stmt .sbody{display:flex;flex-direction:column;gap:4px;margin-top:-6px;padding:0 0 14px 20px}
.you{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;font-weight:500;color:var(--paper);line-height:1.4}
.you.neg b:first-child{color:var(--red)}.you.pos b:first-child{color:var(--green)}
.hint{font-size:13px;color:var(--mute);font-weight:500;margin-top:-8px}
.stmt h4{font-size:16px;display:flex;justify-content:space-between;gap:12px}
.stmt h4 span{color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.sline{display:flex;gap:10px;font-size:14px;line-height:20px;color:var(--mute);font-weight:400}
.sline b{color:inherit;font-weight:400}
.sline i{display:none;flex:none;width:6px;height:6px;border-radius:6px;background:var(--yellow);margin-top:7px}
.sline.g i{background:var(--green)}.sline.r i{background:var(--pink)}.sline.rest i{background:var(--red)}
.tgrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:32px;padding:12px 16px;min-height:52px;box-sizing:border-box;font-size:16px;line-height:20px;font-weight:700;text-align:left}
.tgrow span{flex:1}.tgrow small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.tgl{flex:none;position:relative;width:48px;height:28px;border-radius:28px;background:#555;transition:background .25s}
.tgl b{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:22px;background:var(--paper);transition:transform .3s var(--ease)}
.fhead:disabled{cursor:default;color:inherit}.fhead:disabled .tgl{opacity:.4}
.tgl.on{background:var(--green)}.tgl.on b{transform:translateX(20px)}
.sync{margin-left:auto;align-self:center;flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:100px;background:var(--card);font-size:13px;font-weight:700;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:8px;background:var(--mute)}
.sync.ok i{background:var(--green)}.sync.err i{background:var(--red)}.sync.saving i{background:var(--yellow)}
.linkbox{width:100%;box-sizing:border-box;height:48px;border-radius:100px;border:0;background:#000;color:var(--yellow);font:700 14px var(--font);padding:0 18px;outline:0}
.note{background:var(--card);border-radius:28px;padding:28px 20px;text-align:center;color:var(--mute);font-weight:500;font-size:15px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:40px max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,0),var(--ink) 32px);pointer-events:none}
.bar .in{pointer-events:auto}
.bar .btn.danger{background:#3d0f10}
.bar .in{max-width:342px;margin:0 auto;display:flex;gap:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:40px;background:var(--paper);color:var(--ink);font-size:17px;font-weight:700;text-align:center;transition:transform .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
.btn.danger{background:var(--red-bg);color:var(--red)}

/* sheet */
.dim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);animation:dimIn .18s ease}
@keyframes dimIn{from{opacity:0}}
.exp.lift,.scard.lift{position:relative;z-index:31}
.lacts{position:relative;z-index:31;display:flex;gap:16px;animation:dimIn .18s ease}
.chip .cnt{font-weight:500;font-size:.85em;color:#8a8a8a;margin-left:2px}
.lacts .danger{background:#3d0f10}
.dlg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:24px;animation:dimIn .18s ease}
.dbox{width:100%;max-width:342px;box-sizing:border-box;background:var(--card);border-radius:32px;padding:28px 24px 24px;text-align:center;display:flex;flex-direction:column;gap:12px}
.dbox h3{font-size:20px;line-height:28px;font-weight:700;overflow-wrap:anywhere}
.dbox p{font-size:14px;line-height:20px;color:var(--mute);font-weight:500}
.dbox .acts{display:flex;gap:8px;margin-top:8px}
.dbox .btn{height:52px}
.btn.yel{background:var(--yellow);color:var(--ink)}
.btn.quiet{background:#333;color:var(--paper)}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .sb{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .25s}
.sheet .sp{position:relative;width:100%;max-width:390px;max-height:calc(var(--vh,100vh) * .9);overflow:auto;background:var(--sheet);border-radius:32px 32px 0 0;padding:36px max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:up .35s var(--ease)}
.sheet .sp::before{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;margin-left:-22px;border-radius:6px;background:#555}
.sheet h3{font-size:24px;font-weight:700;margin-bottom:4px}
.sheet p{font-size:15px;color:var(--mute);font-weight:500}
.sheet .acts{display:flex;gap:10px;margin-top:8px}
.ropts{display:flex;flex-direction:column;gap:8px}
.ropts + .amtbox{margin-top:8px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.rhead h3{margin:0;text-align:left}
.rok{width:44px;height:44px;background:var(--yellow);color:var(--ink)}
.rok svg{width:24px;height:24px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 16px 12px 24px;border-radius:32px;background:rgba(0,0,0,.3);box-sizing:border-box;text-align:left}
.opt span{flex:1;display:flex;flex-direction:column}
.opt b{font-size:16px;line-height:20px}.opt small{font-size:13px;line-height:18px;font-weight:400;opacity:.5}
.opt .rd{flex:none;width:22px;height:22px;border-radius:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.opt.on{background:var(--paper);color:var(--ink)}
.opt.on .rd{box-shadow:inset 0 0 0 7px var(--ink)}
.amtbox{display:flex;align-items:center;gap:8px;height:56px;border-radius:32px;box-shadow:inset 0 0 0 1px var(--paper);padding:0 24px;box-sizing:border-box}
.amtbox label{font-size:16px;font-weight:700;color:var(--paper);white-space:nowrap}
.amtbox .note{flex:1;text-align:left;min-width:0;background:none;border:0;outline:0;font-size:16px;font-weight:700;color:var(--paper);padding:0;caret-color:var(--yellow)}
.amtbox .note::placeholder{color:rgba(255,255,255,.3)}
.flow .who .fnote2{font-size:12px;color:var(--mute);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amtbox input:not(.note){flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;caret-color:var(--paper)}
.amtbox.donate input{color:var(--cyan)}.amtbox.fixed input{color:var(--pink)}
.amtbox .bang{font-weight:700;color:var(--mute)}

.shot{width:100%;border-radius:20px;display:block}
.sheet .sp > .btn{flex:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;padding:12px 20px;border-radius:100px;transition:opacity .25s,transform .35s var(--ease);white-space:nowrap;max-width:calc(100% - 48px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

let syncState = onWeb ? 'saving' : 'off', pushT = null;
function setBook(code){ book = code; store.set(BOOK, code); const pth = root.acct?.handle ? '/' + root.acct.handle : '/s/' + code; if (onWeb && location.pathname !== pth) window.history.replaceState(null, '', pth); }
if (onWeb && !SLUG) setBook(book);
const bookLink = () => root.acct?.handle ? `${location.origin}/${root.acct.handle}` : SLUG ? `${location.origin}/${SLUG.split('/').map(encodeURIComponent).join('/')}` : `${location.origin}/s/${book}`;
/* tên nhóm → đuôi link bill: "Cầu Lông Tháng 9" → caulongthang9 (trùng tên thì thêm -2, -3…) */
const gSlugs = gs => { const seen = {}; return gs.map(g => { const s = String(g.name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 40) || 'nhom'; seen[s] = (seen[s] || 0) + 1; return seen[s] > 1 ? s + '-' + seen[s] : s; }); };
const billLink = g => g.bill ? `${location.origin}/bills/${g.bill}` : `${bookLink()}/bill/${gSlugs(root.groups)[root.groups.indexOf(g)]}`;
/* ================= tài khoản @tên, nhóm chung, link bill =================
   Vẫn chỉ dùng collection books/{mã}. Ngoài sổ của từng người còn 3 loại bản ghi:
   - usr<băm @tên>: hồ sơ { uid, handle, name, avatar, book, groups: [mã nhóm chung được mời vào] }. Link /<tên> mở sổ `book`.
   - grp…: nhóm chung { g }. Nhóm có thành viên @ (người dùng khác) nằm ở đây để cả hai app cùng xem/sửa; bản sửa sau cùng thắng (g.uat).
   - bil<số>: link bill /bills/<số> → { book, gid, sid }.
   Chặn trùng tên: tạo hồ sơ với điều kiện "chưa có" (currentDocument.exists=false); firestore.rules chặn ghi đè hồ sơ của uid khác. */
const usrCode = h => 'usr' + slugHash(h);
const bilCode = n => 'bil' + String(n).padStart(17, '0');
const toHandle = n => String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 30);
const HANDLE_BAD = new Set(['s', 'bill', 'bills', 'newuser', 'index']);
const okHandle = h => h.length >= 2 && /[a-z]/.test(h) && !HANDLE_BAD.has(h);
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const fsFetch = async (url, opt) => { try { return await fetch(url, opt); } catch(e) { await new Promise(r => setTimeout(r, 600)); return fetch(url, opt); } };   // mạng chập chờn: thử lại một lần
async function fsGet(code){
  const r = await fsFetch(`${FS_URL}${code}?key=${FS_KEY}`, { cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status);

}
/* pre: 'new' = chỉ ghi khi chưa có; chuỗi thời gian = chỉ ghi khi bản trên máy chủ chưa đổi. Trả 'ok' hoặc 'taken' (điều kiện không đạt / luật chặn). */
async function fsPut(code, data, at, pre){

async function getUser(h, hops = 3){   // tên đã đổi thì hồ sơ cũ trỏ sang tên mới (movedTo)

async function newUser(bk){   // người mới: newuser + số ngẫu nhiên, thử lại nếu trùng

    try { const u = await getUser(SLUG); if (u) { HDOC = u.data; book = u.data.book; if (!store.get(BOOK)) store.set(BOOK, book); if (u.data.handle !== SLUG) history.replaceState(null, '', '/' + u.data.handle); } } catch(_) {}

async function ensureAcct(){

    if (!root.acct?.uid && !SLUG) { const o = await newUser(book); if (o) { root.acct = pickAcct(o); save(); } }
    if (!root.acct?.uid && SLUG && !HDOC && okHandle(SLUG) && toHandle(SLUG) === SLUG) {   // tự gõ link /abc123 chưa ai dùng → thành người dùng @abc123 luôn, sổ là sổ của link đó
      const o = { uid: newCode(), name: SLUG, avatar: '', book, groups: [] };
      if (await claimHandle(SLUG, o) === 'ok') { HDOC = prof(o, SLUG); root.acct = pickAcct(HDOC); if (!store.get(BOOK)) store.set(BOOK, book); save(); }
    }

/* nhóm chung */
const dirtyG = new Set();

   - mỗi khoản chi / lần góp thêm có uat riêng; khoản của người khác luôn lấy bản trên máy chủ (mình không được sửa)

const ej = x => JSON.stringify({ ...x, uat: 0 });

async function saveAcct(btn){
  const n = $('#aName').value.trim().replace(/\s+/g, ' '), h = toHandle(n), me = root.acct || {};
  if (!n) { $('#aName').focus(); toast('Nhập tên của bạn'); return; }
  if (!okHandle(h)) { $('#aName').focus(); toast('Tên cần ít nhất 2 chữ hoặc số, và có chữ cái'); return; }
  const done = o => { root.acct = pickAcct(o); save(); if (onWeb && location.pathname !== '/' + o.handle) history.replaceState(null, '', '/' + o.handle); toast('Đã lưu tài khoản'); go(adraft.from || 'home'); };
  if (!onWeb) { done({ ...me, uid: me.uid || newCode(), handle: h, name: n, avatar: adraft.avatar }); return; }
  btn.disabled = true; let saved = null;
  try {
    const old = me.handle ? await fsGet(usrCode(me.handle)) : null, groups = old?.data && me.uid && old.data.uid === me.uid ? old.data.groups || [] : [];   // sổ chưa có tài khoản (link quỹ ngắn cũ): không có hồ sơ cũ
    const o = { uid: me.uid || newCode(), name: n, avatar: adraft.avatar || '', book, groups };
    const res = h === me.handle && old ? await fsPut(usrCode(h), prof(o, h), Date.now(), old.ut) : await claimHandle(h, o);
    if (res !== 'ok') { toast(res === 'bad' ? 'Tên này không dùng được' : `@${h} đã có người dùng, chọn tên khác`); $('#aName').focus(); return; }
    if (me.handle && me.handle !== h && me.uid && old?.data?.uid === me.uid) await fsPut(usrCode(me.handle), { uid: me.uid, handle: me.handle, released: true, movedTo: h }, Date.now(), old.ut).catch(() => {});
    saved = { ...o, handle: h };
  } catch(e) { console.error('saveAcct', e); toast(navigator.onLine === false ? 'Chưa lưu được: máy đang mất mạng' : `Chưa lưu được (lỗi ${String(e?.message || e).slice(0, 40)}), thử lại nhé`); }
  finally { btn.disabled = false; }
  if (saved) done(saved);   // vẽ lại trang nằm ngoài try: lỗi vẽ không bị báo nhầm thành lỗi mạng
}

/* Góp thêm vào quỹ chung về sau: mỗi lần góp là một card ngay dưới card Quỹ (ngày nào, những ai góp, mỗi người bao nhiêu).
   a.ps = [{ id, amt }]; bản cũ lưu một người a.who / a.amt nên đọc qua tps() để tương thích. */
function tps(a){ return a.ps || (a.who ? [{ id: a.who, amt: Number(a.amt) || 0 }] : []); }
function setTps(a, ps){ a.ps = ps; delete a.who; delete a.amt; }
function topCard(a){
  const ps = tps(a), sel = G.members.filter(m => ps.some(p => p.id === m.id)), allIn = G.members.length && sel.length === G.members.length;
  const cal = `<label class="cal" aria-label="Ngày góp">${a.at ? `<b>${new Date(a.at).getDate()}</b><span>TH${new Date(a.at).getMonth() + 1}</span>` : `<b>–</b><span>NGÀY</span>`}<input type="date" data-tdate="${a.id}" value="${a.at ? isoDay(a.at) : ''}"></label>`;

    <div class="eh">${cal}<b class="ename">Góp thêm quỹ</b><button class="fold" data-deltop="${a.id}" aria-label="Xóa khoản góp">${svg('i-x')}</button></div>
    <div class="scroll"><button class="chip ${allIn ? 'sel' : 'dark'}" data-tall="${a.id}">Tất cả${sel.length ? `<span class="cnt">${sel.length}</span>` : ''}</button>${G.members.map(m => `<button class="chip ${sel.includes(m) ? 'sel' : 'dark'}" data-tpw="${a.id}:${m.id}">${esc(m.name)}</button>`).join('')}</div>
    ${sel.map(m => { const p = ps.find(x => x.id === m.id); return `<div class="flow topf"><span class="who"><b>${esc(m.name)} góp thêm</b></span><input inputmode="numeric" id="tamt-${a.id}-${m.id}" data-tamt="${a.id}:${m.id}" value="${p.amt ? fmt(p.amt) : ''}" placeholder="0" ${COARSE ? 'readonly' : ''} aria-label="Số tiền ${esc(m.name)} góp thêm"></div>`; }).join('')}
  </article>`;
}
function fundRow(e){
  let f = e.flows.find(x => x.id === FUND); if (!f) { f = { id: FUND, role: 'pay', amt: 0 }; e.flows.push(f); }
  return `<div class="flow fundw ${e.parts.length ? '' : 'idle'}"><span class="who"><b>Rút quỹ</b></span><input inputmode="numeric" id="amt-${e.id}-${FUND}" data-amt="${e.id}:${FUND}" value="${f.amt ? fmt(f.amt) : ''}" placeholder="0" ${COARSE || !canExp(e) ? 'readonly' : ''} ${canExp(e) ? '' : 'data-ro'} aria-label="Số tiền rút quỹ"></div>`;
}
function calcRows(e, d){
  if (!e.parts.length) return `<p class="warn">Chọn người tham gia</p>`;
  const payRows = d.pays.filter(f => f.id !== FUND && f.amt);
  const rows = G.fund?.on || payRows.length ? [] : [`<div class="r"><span>Tổng chi</span><b>${fmt(d.total)}</b></div>`];
  if (d.per > 0 && d.sharers.length) rows.push(`<p class="share">${G.members.filter(m => d.sharers.includes(m.id)).map(m => esc(m.name)).join(', ')}. Mỗi người ${fmt(d.per)}</p>`);   // ai phải chịu phần chia đều, mỗi người bao nhiêu
  if (d.warn) rows.push(`<p class="warn">${esc(d.warn)}</p>`);
  return rows.join('');
}

      d.querySelectorAll('[data-shotroot] svg use').forEach(u => { const sym = d.querySelector((u.getAttribute('href') || '').trim()); const sv = u.parentNode; if (!sym || !sv) return;
        const cs = d.defaultView.getComputedStyle(sv), vb = sym.getAttribute('viewBox') || '0 0 24 24', [, , vw, vh] = vb.split(/\s+/).map(Number), flip = /^matrix\(-1, 0, 0, -1/.test(cs.transform);
        sv.setAttribute('viewBox', vb); sv.innerHTML = (flip ? `<g transform="rotate(180 ${vw / 2} ${vh / 2})">` : '') + sym.innerHTML.replace(/currentColor/g, cs.color) + (flip ? '</g>' : ''); sv.querySelectorAll('[style]').forEach(x => x.removeAttribute('style')); if (flip) sv.style.transform = 'none'; });

/* --- Tổng kết --- */
function sumView(){
  const head = `<header class="ghead">${BILL ? '<span class="hsp"></span>' : `<button class="circ back" id="sBack" aria-label="Quay lại nhập">${svg('i-back')}</button>`}<div class="ttl2"><h1>Tổng kết</h1><span class="sub">${esc(G.name)}</span></div><span class="hsp"></span></header>`;
  if (!R.grand) return `<section class="view">${head}<p class="note">${BILL ? 'Bill này chưa có khoản chi nào.' : 'Chưa có khoản chi nào. Quay lại, thêm khoản chi và chọn người chi tiền.'}</p></section>`;
  const F = R.fund, fundBox = F.on && (F.put || F.spent) ? fundCard(R) : '';
  const warns = R.warns.map(w => `<p class="note" style="color:var(--yellow);padding:14px 18px;text-align:left">${esc(w)}</p>`).join('');
  /* Bảng sao kê: cột đầu = khoản mục (dính trái), mỗi cột sau = một thành viên (vuốt ngang). Số rút gọn dạng K. */
  const K = n => { const a = Math.round(Math.abs(n) / 100) / 10; if (!a) return '-'; const [i, f] = String(a).split('.'); return (n < 0 ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (f ? ',' + f : ''); };   // nghìn đồng, không chữ K: 1234000 → 1.234
  const mem = G.members, netOf = id => (R.nets.find(x => x.id === id) || { net: 0 }).net;
  const dd = t => { if (!t) return ''; const x = new Date(t); return `${x.getDate()}/${x.getMonth() + 1}`; };
  const cell = (n, cls) => `<td class="${n ? cls : 'c-m'}">${K(n)}</td>`;
  const row = (label, sub, vals, cls, tr = '') => `<tr class="${tr}"><td><span class="rl">${label}</span>${sub ? `<small>${sub}</small>` : ''}</td>${vals.map(v => cell(v, cls)).join('')}</tr>`;
  const rows = [];
  const stList = byDate(G.exps).filter(e => R.detail[e.id].total > 0);
  const bear = stList.map(e => { const d = R.detail[e.id]; return { e, v: mem.map(m => { const f = d.fixed.find(x => x.id === m.id); return { n: (f ? Number(f.amt) : 0) + (d.sharers.includes(m.id) ? Math.round(d.per) : 0), pink: !!f && f.role === 'fixed' }; }) }; });
  if (R.fund.on) rows.push(row('Góp quỹ', '', mem.map(m => R.fund.contribs?.[m.id] || 0), 'c-w'));
  if (R.fund.on && R.fund.addTot) rows.push(row('Góp thêm', '', mem.map(m => R.fund.adds[m.id] || 0), 'c-w'));
  const adv = mem.map(m => stList.reduce((t, e) => t + R.detail[e.id].pays.filter(f => f.id === m.id).reduce((u, f) => u + Number(f.amt), 0), 0));
  if (adv.some(Boolean)) rows.push(row('Đã ứng', '', adv, 'c-g'));
  if (R.fund.on && mem.length) R.fund.sponsors.forEach(x => rows.push(row(esc(x.name || 'Góp ngoài quỹ'), '', mem.map(() => Math.round(x.amt / mem.length / 1000) * 1000), 'c-g')));   // mỗi khoản góp ngoài quỹ một dòng, tên do người dùng đặt
  bear.forEach(({ e, v }) => rows.push(`<tr><td><span class="rl">${esc(e.name || 'Khoản chi')}</span><small class="ta">${K(R.detail[e.id].total)}</small></td>${v.map(c => cell(c.n, c.pink ? 'c-pk' : 'c-y')).join('')}</tr>`));
  rows.push(row('Tổng', '', mem.map((m, i) => bear.reduce((t, b) => t + b.v[i].n, 0)), 'c-y', 'sum'));
  rows.push(`<tr class="fin"><td><span class="rl">${R.fund.on ? 'Quỹ còn' : 'Còn lại'}</span></td>${mem.map(m => { const n = netOf(m.id); return `<td class="${n > 0 ? 'c-g' : n < 0 ? 'c-r' : 'c-m'}">${n > 0 ? '+' : ''}${K(n)}</td>`; }).join('')}</tr>`);
  const people = `<div class="tblw"><table class="tbl"><thead><tr><th></th>${mem.map(m => `<th><span>${esc(m.name)}</span></th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const stmts = '';
  return `<section class="view sumv">${head}<div class="stack">${fundBox}${warns}${people}${stmts}</div>
  </section>`;
}
function zaloText(){
  let t = `📣 ${G.name.toUpperCase()}\n━━━━━━━━━━━━━━\n💰 Tổng: ${fmt(R.grand)}\n\n`;
  byDate(G.exps).forEach((e, k) => { const d = R.detail[e.id]; if (!d.total) return;
    t += `${k+1}. ${e.name || 'Khoản chi'}: ${fmt(d.total)} (${d.pays.map(f => nm(f.id)).join(' + ')} trả)${d.sharers.length ? ` · ${fmt(d.per)}/người` : ''}\n`;
    d.fixed.forEach(f => t += `   ${f.role === 'donate' ? '🎁' : '🎓'} ${nm(f.id)} ${f.role === 'donate' ? 'tài trợ' : 'đóng cố định'} ${fmt(f.amt)}\n`); });
  if (R.fund.on && (R.fund.put || R.fund.spent)) t += `\n🏦 Quỹ chung: góp ${fmt(R.fund.put)} · tiêu ${fmt(R.fund.spent)} · ${R.fund.left < 0 ? 'vượt' : 'dư'} ${fmt(Math.abs(R.fund.left))}\n`;
  t += `\n💸 CHUYỂN KHOẢN:\n` + (R.txs.length ? R.txs.map((x, i) => `${i+1}. ${nm(x.from)} ➜ ${nm(x.to)}: ${fmt(x.amount)}${G.done[txKey(x)] ? ' ✅' : ''}`).join('\n') : 'Hòa cả làng, không ai nợ ai!');
  return t + `\n\nAnh em ting ting sớm cho các chủ xị nhé! ❤️`;
}

  document.querySelectorAll('.cmp:not([hidden])').forEach(c => c.style.setProperty('--kb', (kb / Z) + 'px'));
}
window.visualViewport?.addEventListener('resize', cmpPlace); window.visualViewport?.addEventListener('scroll', cmpPlace);
function openComposer(){
  const c = $('#cmp'), d = new Date(), i = $('#cmpName');
  c.querySelector('.cal').innerHTML = `<b>${d.getDate()}</b><span>TH${d.getMonth() + 1}</span>`;
  i.value = ''; cmpY = scrollY; c.style.setProperty('--kb', '0px'); c.hidden = false; cmpPlace();
  i.focus();   // phải focus ngay trong lúc bấm thì iPhone mới bật bàn phím
}
/* Ô nhập số tiền (ứng tiền, đóng cố định, tài trợ, rút quỹ): trên điện thoại bấm vào ô số thì một thanh nhập nổi ngay trên bàn phím,
   số liệu phía sau vẫn cập nhật trực tiếp khi gõ. Máy tính (chuột) vẫn gõ thẳng vào ô. */
let ampY = 0;
function openAmt(inp){
  if (inp.dataset.ro !== undefined) { toast('Chỉ người tạo khoản chi mới sửa được'); return; }
  const row = inp.closest('.flow'), c = $('#amp'), f = $('#ampFlow'), i = $('#ampInput'); if (!row) return;
  ampY = scrollY; f.className = row.className.replace(/\bidle\b/, '').trim();
  const w = row.querySelector('.who').cloneNode(true);
  w.querySelectorAll('button').forEach(b => { const s = document.createElement('span'); s.className = b.className; s.innerHTML = b.innerHTML; b.replaceWith(s); });
  f.querySelector('.who').replaceWith(w);
  delete i.dataset.amt; delete i.dataset.tamt; if (inp.dataset.tamt) i.dataset.tamt = inp.dataset.tamt; else i.dataset.amt = inp.dataset.amt; i.value = inp.value; i.setAttribute('aria-label', inp.getAttribute('aria-label') || 'Số tiền');
  c.style.setProperty('--kb', '0px'); c.hidden = false; cmpPlace();
  i.focus();   // phải focus ngay trong lúc bấm thì iPhone mới bật bàn phím
}
function closeAmt(){
  const c = $('#amp'); if (!c || c.hidden) return;
  $('#ampInput').blur(); c.hidden = true; render(); window.scrollTo({ top: ampY });
}
document.addEventListener('click', e => { if (!COARSE) return; const i = e.target.closest?.('input[data-amt][readonly], input[data-tamt][readonly]'); if (i) { e.preventDefault(); openAmt(i); } });
function closeComposer(keep){
  const c = $('#cmp'); if (!c || c.hidden) return;
  const name = $('#cmpName').value.trim(); $('#cmpName').blur(); c.hidden = true;
  if (Math.abs(scrollY - cmpY) > 2) window.scrollTo(0, cmpY);
  if (!keep) return;
  const ex = { id: newId(), at: Date.now(), name, parts: [], flows: [], by: myUid() };
  G.exps.push(ex); editing = null; save(); rerenderGroup();
  setTimeout(() => document.querySelector(`[data-exp="${ex.id}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 150);
}
document.addEventListener('focusin', e => { if (e.target.matches?.('input:not([type=checkbox]):not([type=file]):not([type=date]),textarea') && !e.target.closest('.sheet')) document.body.classList.add('kb');});
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a?.matches?.('input,textarea')) document.body.classList.remove('kb'); }, 60));
['gesturestart','gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
/* vuốt: ở trang nhóm vuốt trái → phải để mở menu trái (menu chạy theo ngón tay), menu đang mở thì vuốt phải → trái để đóng;
   các trang khác vuốt sang phải để quay lại */
(() => {
  let sx = 0, sy = 0, on = false, dx = 0, lock = null, mode = null, started = false;
  const W = 300, backBtn = () => $('#formBack') || $('#sBack') || $('#acBack');
  const app = () => $('#app'), bar = () => $('.bar'), drw = () => $('#drw'), dp = () => $('#drw .dp'), db = () => $('#drwBg');
  const setX = (x, anim) => {   // x: menu mở bao nhiêu px (0..300)
    const tr = anim ? 'transform .25s var(--ease)' : 'none';
    [app(), bar()].forEach(el => { el.style.transition = tr; el.style.transform = `translateX(${x}px)`; el.style.clipPath = 'none'; });   // đang kéo: bỏ phần cắt 66px (chỉ đúng khi menu mở hẳn), không thì trang bị cắt nửa
    dp().style.transition = tr; dp().style.transform = `translateX(${x - W}px)`;
    db().style.transition = anim ? 'opacity .25s var(--ease)' : 'none'; db().style.opacity = String(x / W);
  };
  const clearX = () => [app(), bar(), dp(), db()].forEach(el => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; el.style.clipPath = ''; });
  document.addEventListener('touchstart', e => {
    on = false; lock = null; dx = 0; mode = null; started = false;
    if (e.touches.length !== 1 || document.querySelector('#sheet:not([hidden]), .cmp:not([hidden]), .lacts, .dlg')) return;
    if (document.body.classList.contains('drwon')) mode = 'close';
    else if (e.target.closest('.scroll, .tblw, input, textarea, .sheet')) return;
    else if (view === 'group' && $('#gMenu')) mode = 'open';
    else if (backBtn()) mode = 'back';
    else return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!on) return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (lock === null && (Math.abs(x) > 10 || Math.abs(y) > 10)) lock = Math.abs(x) > Math.abs(y) * 1.5 && (mode === 'close' ? x < 0 : x > 0) ? 'x' : 'y';
    if (lock !== 'x') return;
    if (mode === 'back') { dx = Math.max(0, x); const a = app(); a.style.transition = 'none'; a.style.transform = `translateX(${dx * .6}px)`; a.style.opacity = String(1 - Math.min(dx / 600, .4)); return; }
    if (mode === 'open') { if (!started) { started = true; fillDrawer(); drw().hidden = false; document.activeElement?.blur?.(); } dx = Math.max(0, Math.min(W, x)); setX(dx); return; }
    dx = Math.max(-W, Math.min(0, x)); setX(W + dx);
  }, { passive: true });
  const end = () => {
    if (!on) return; on = false;
    if (mode === 'back') {
      const a = app(); a.style.transition = 'transform .2s var(--ease), opacity .2s'; a.style.transform = ''; a.style.opacity = '';
      if (lock === 'x' && dx > 80) { const b = backBtn(); setTimeout(() => { a.style.transition = ''; }, 220); b && b.click(); }
      return;
    }
    if (mode === 'open' && started) {
      const go = dx > 80; setX(go ? W : 0, true);
      setTimeout(() => { if (go) { document.body.classList.add('drwon'); clearX(); } else { clearX(); drw().hidden = true; dp().innerHTML = ''; } }, 260);
      return;
    }
    if (mode === 'close' && lock === 'x') {
      const go = dx < -60; setX(go ? 0 : W, true);
      setTimeout(() => { if (go) { document.body.classList.remove('drwon'); clearX(); drw().hidden = true; dp().innerHTML = ''; } else clearX(); }, 260);
    }
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });   // iPhone huỷ chạm giữa chừng: vẫn đưa menu về đúng chỗ
})();

document.addEventListener('focusout', e => { const id = e.target.dataset?.ename; if (id && !e.relatedTarget?.matches?.('[data-edate]')) setTimeout(() => endEdit(+id), 0); });
document.addEventListener('click', e => { const i = e.target.closest('.cal')?.querySelector('input'); if (!i) return; try { i.showPicker(); e.preventDefault(); } catch(_) {} });
document.addEventListener('focusin', e => { const t = e.target; if (t.matches('[data-amt],[data-samt],[data-tamt]') && !t.readOnly) setTimeout(() => { if (document.activeElement === t) t.select?.(); }, 0); });   // chỉ chọn hết số khi ô còn đang được focus (select() trên Chrome tự cướp focus)
window.addEventListener('resize', () => { if (view === 'group') fitMembers(); if (view === 'home') fitWelcome(); });
document.fonts?.ready.then(() => { if (view === 'home') fitWelcome(); }); addEventListener('load', () => { if (view === 'home') fitWelcome(); });

/* long-press an expense card → sheet */
let pressT = null, pressEl = null, startXY = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.exp:not(.tcard), .sumv .stack > :is(.fund,.ledger,.txcard)'); if (!card || e.target.closest('input') || (e.target.closest('button') && !e.target.closest('.tx,.sumv .fund .top'))) return;
  const sc = !card.classList.contains('exp'); if (sc) card.classList.add('scard');
  pressEl = card; startXY = [e.clientX, e.clientY]; card.classList.add('press');
  pressT = setTimeout(() => { card.classList.remove('press'); suppressClick = true; setTimeout(() => suppressClick = false, 600); sc ? pressSheet(0, card) : pressSheet(+card.dataset.exp); pressT = null; }, 500);
});
const cancelPress = () => { clearTimeout(pressT); pressT = null; pressEl?.classList.remove('press'); pressEl = null; };
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
document.addEventListener('pointermove', e => { if (pressT && startXY && Math.hypot(e.clientX - startXY[0], e.clientY - startXY[1]) > 10) cancelPress(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.exp:not(.tcard), .sumv .stack > *')) e.preventDefault(); });

render();
if (BILL) loadBill(); else boot();
})();
</script>
