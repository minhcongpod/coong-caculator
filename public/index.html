<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Coong Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coong">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: one phone column (max 440px). Three screens only: Home (list + my balance) → Nhập (who went, what was spent) → Kết quả (who pays whom). Coong look: black ground, translucent white pills, yellow money, white primary button pinned to the bottom. */
:root{
  color-scheme:dark;
  --ink:#000; --paper:#fff; --fill:rgba(255,255,255,.1); --fill2:rgba(255,255,255,.2); --deep:rgba(0,0,0,.35);
  --mute:rgba(255,255,255,.55); --line:rgba(255,255,255,.12); --sheet:#1a1a1a;
  --yellow:#fc0; --ok:#34c759; --err:#ff453a; --info:#40c8e0;
  --ok-bg:rgba(52,199,89,.15); --err-bg:rgba(255,69,58,.15); --y-bg:rgba(255,204,0,.12);
  --font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
input{font:inherit;color:inherit}
p,h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
.app{max-width:440px;margin:0 auto;padding-top:16px;padding-bottom:calc(116px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.app>*{min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.circ{display:flex;align-items:center;justify-content:center;border-radius:100px;flex:none}
svg{display:block}
.pos{color:var(--ok)}.neg{color:var(--err)}.zero{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.logo{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.logo b{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.logo span{font-size:16px;font-weight:500;color:var(--yellow)}
.ibtn{width:44px;height:44px;background:var(--fill);color:var(--paper);transition:transform .25s var(--ease)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:22px;height:22px}
.evh{flex:1;min-width:0;display:flex;flex-direction:column}
.evname{width:100%;background:none;border:0;outline:0;font-size:22px;line-height:28px;font-weight:700;padding:0;text-overflow:ellipsis;caret-color:var(--yellow)}
.evname::placeholder{color:var(--mute)}
.evdate{position:relative;align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--yellow)}
.evdate svg{width:14px;height:14px}
.evdate input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;color-scheme:dark}

/* segmented control */
.seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;display:flex;height:44px;box-sizing:border-box;border-radius:100px;background:#1c1c1c;padding:3px}
.seg::before{content:"";position:absolute;inset:-8px -2px;z-index:-1;background:linear-gradient(var(--ink) 60%,transparent)}
.seg button{position:relative;z-index:1;flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--mute);transition:color .25s;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{color:var(--ink)}
.seg .n{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:20px;background:var(--fill2);font-size:12px;line-height:20px;color:var(--paper)}
.seg button.on .n{background:var(--ink);color:var(--yellow)}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:calc((100% - 6px)/2);border-radius:100px;background:var(--paper);transition:transform .35s var(--ease)}

/* section heads */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 4px 0}
.sh b{font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.sh small{text-align:right}
.sh small{font-size:13px;font-weight:500;color:var(--mute)}
.sh .step{display:inline-flex;width:24px;height:24px;margin-right:8px;border-radius:24px;background:var(--yellow);color:var(--ink);font-size:13px;align-items:center;justify-content:center;vertical-align:2px}
.card{background:var(--fill);border-radius:28px;padding:16px 18px;box-sizing:border-box}

/* chips + avatars */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;border-radius:100px;background:var(--fill);font-size:15px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--paper);color:var(--ink)}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fill2);color:var(--mute)}
.chip.ghost .av{opacity:.75}
.chip .tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--fill);color:var(--mute)}
.chip.on .tag{background:rgba(0,0,0,.1);color:rgba(0,0,0,.6)}
.chip .tag.don{background:var(--ok);color:var(--ink)}
.chip .tag.fix{background:var(--info);color:var(--ink)}
.chip .tag.me{background:var(--yellow);color:var(--ink)}
.chip .plus{color:var(--yellow);font-size:18px;line-height:1;margin-left:-2px}
.chip.grp{padding:0 16px;background:var(--y-bg);color:var(--yellow)}
.chip.dchip{padding:0 16px;flex:none}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.av{width:30px;height:30px;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--c)}
.av.lg{width:44px;height:44px;font-size:18px}
.chip.on .av{background:var(--c);color:var(--ink)}

/* add name */
.addrow{display:flex;gap:8px}
.field{flex:1;min-width:0;height:48px;box-sizing:border-box;border-radius:100px;background:var(--fill);border:0;padding:0 20px;font-size:16px;font-weight:500;outline:0;caret-color:var(--yellow)}
.field::placeholder{color:var(--mute)}
.field:focus{box-shadow:inset 0 0 0 2px var(--yellow)}
.addbtn{width:48px;height:48px;background:var(--paper);color:var(--ink)}
.addbtn svg{width:24px;height:24px}
.hint{font-size:13px;font-weight:500;color:var(--mute);padding:0 4px}

/* stage card */
.stg{display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:center;gap:10px}
.sname{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;font-weight:700;padding:4px 0;border-bottom:1px solid transparent;caret-color:var(--yellow)}
.sname:focus{border-bottom-color:var(--yellow)}
.xbtn{width:34px;height:34px;background:var(--fill);color:var(--mute)}
.xbtn svg{width:16px;height:16px}
.samt{display:flex;align-items:baseline;gap:6px;background:var(--deep);border-radius:22px;padding:8px 18px}
.samt:focus-within{box-shadow:inset 0 0 0 2px var(--yellow)}
.samt input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:34px;line-height:44px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:-.02em;caret-color:var(--yellow);padding:0}
.samt input::placeholder{color:rgba(255,204,0,.35)}
.samt span{font-size:20px;font-weight:700;color:var(--yellow)}
.q{display:flex;flex-direction:column;gap:8px}
.ql{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;font-weight:700}
.ql small{font-size:12px;font-weight:500;color:var(--mute);text-align:right}
.ql button{font-size:13px;font-weight:700;color:var(--yellow);white-space:nowrap}
.money{display:flex;align-items:center;gap:8px;height:46px;border-radius:100px;background:var(--deep);padding:0 18px}
.money label{font-size:14px;font-weight:500;color:var(--mute);white-space:nowrap}
.money input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-size:18px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;caret-color:var(--yellow)}
.money:focus-within{box-shadow:inset 0 0 0 2px var(--yellow)}
.money .u{font-weight:700;color:var(--yellow)}
.allrow{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border-radius:100px;background:var(--deep);padding:4px 16px 4px 6px;box-sizing:border-box}
.allrow .avs{display:flex}.allrow .avs .av{width:28px;height:28px;font-size:12px;box-shadow:0 0 0 2px #1a1a1a;margin-right:-6px;background:color-mix(in srgb,var(--c) 40%,#1a1a1a)}
.allrow span{flex:1;min-width:0;font-size:14px;font-weight:700;margin-left:8px}
.allrow em{font-style:normal;font-size:13px;font-weight:700;color:var(--yellow)}
.split{display:flex;flex-direction:column;gap:4px;font-size:14px;padding:2px 4px 0}
.split .row{display:flex;justify-content:space-between;gap:12px}
.split .row span{color:var(--mute);font-weight:500}
.split .row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.split .row.main span{color:var(--paper);font-weight:700}
.split .row.main b{color:var(--yellow);font-size:17px}
.addstage{height:56px;border-radius:28px;box-shadow:inset 0 0 0 2px var(--fill2);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.addstage svg{width:22px;height:22px}

/* home */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum .box{border-radius:26px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum .box small{font-size:13px;font-weight:500;color:var(--mute)}
.sum .box b{font-size:24px;line-height:30px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.sum .get{background:var(--ok-bg)}.sum .get b{color:var(--ok)}
.sum .ow{background:var(--err-bg)}.sum .ow b{color:var(--err)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--mute);padding:0 4px}
.who b{color:var(--paper)}
.who button{margin-left:auto;font-weight:700;color:var(--yellow)}
.ev{display:flex;align-items:center;gap:14px;width:100%;background:var(--fill);border-radius:28px;padding:14px 18px;box-sizing:border-box;transition:transform .25s var(--ease)}
.ev:active{transform:scale(.97)}
.ev .dt{flex:none;width:50px;height:50px;border-radius:18px;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ev .dt b{font-size:20px}.ev .dt small{font-size:11px;font-weight:700;color:var(--yellow);text-transform:uppercase}
.ev .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev .info b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .info small{font-size:13px;font-weight:500;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .st{font-size:13px;font-weight:700}
.ev .tot{font-size:16px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.sync{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:100px;background:var(--fill);font-size:13px;font-weight:700;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:8px;background:var(--mute)}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--err)}.sync.saving i{background:var(--yellow)}
.linkbox{width:100%;box-sizing:border-box;height:48px;border-radius:100px;border:0;background:rgba(0,0,0,.4);color:var(--yellow);font:700 14px var(--font);padding:0 18px;outline:0}
.gcount{font-size:18px;font-weight:700;margin-top:6px}
.gcard{display:flex;align-items:center;gap:12px;background:#1c1c1c;border-radius:40px;padding:16px 16px 16px 12px;transition:transform .25s var(--ease)}
.gcard:active{transform:scale(.98)}
.gcard .open{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.gico{width:50px;height:50px;background:#141414;color:#3a3a3a}
.gico svg{width:26px;height:26px}
.gcard .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.gcard .t b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .t small{font-size:13px;color:var(--mute);font-weight:500}
.pen{width:44px;height:44px;color:var(--paper)}
.pen svg{width:22px;height:22px}
.gempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:62vh;text-align:center}
.gempty .gico{width:80px;height:80px;background:#1c1c1c;color:#8e8e8e}
.gempty .gico svg{width:38px;height:38px}
.gempty b{font-size:24px}
.bback{width:52px;height:52px;background:#1c1c1c;color:var(--paper)}
.bback svg{width:20px;height:20px}
.ftitle{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.uline{width:100%;box-sizing:border-box;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;font-size:24px;font-weight:500;padding:12px 0 16px;caret-color:var(--yellow)}
.uline::placeholder{color:rgba(255,255,255,.3)}
.uline:focus{border-bottom-color:var(--yellow)}
.flbl{font-size:14px;font-weight:700;color:var(--mute);margin-top:8px}
.chip.xchip{padding:0 12px 0 16px;background:#1c1c1c}
.chip.xchip svg{width:18px;height:18px;color:var(--mute)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--fill2);color:var(--mute);vertical-align:2px;margin-left:6px}

/* results */
.hero{position:relative;overflow:hidden;background:var(--fill);border-radius:28px;padding:18px 22px;display:flex;flex-direction:column;gap:2px}
.hero small{font-size:14px;font-weight:500;color:var(--mute)}
.hero .big{font-size:40px;line-height:48px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .big i{font-style:normal;font-size:24px;margin-left:4px}
.hero .meta{font-size:14px;font-weight:700;color:var(--mute)}
.hero .meta b{color:var(--paper)}
.glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07) 50%,transparent);transform:translateX(-100%) skewX(-30deg);animation:glint 4.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes glint{0%{transform:translateX(-100%) skewX(-30deg)}55%,100%{transform:translateX(210%) skewX(-30deg)}}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--y-bg);color:var(--yellow);border-radius:22px;padding:12px 16px;font-size:14px;font-weight:500}
.warn svg{width:18px;height:18px;flex:none;margin-top:1px}
.tx{display:flex;align-items:center;gap:12px;width:100%;background:var(--fill);border-radius:28px;padding:14px 16px;box-sizing:border-box;transition:transform .25s var(--ease),opacity .25s}
.tx:active{transform:scale(.97)}
.tx.mine{box-shadow:inset 0 0 0 2px var(--yellow)}
.tx .w{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tx .pair{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;min-width:0}
.tx .pair span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .pair svg{width:16px;height:16px;flex:none;color:var(--mute)}
.tx .pair .av{width:26px;height:26px;font-size:12px}
.tx small{font-size:13px;color:var(--mute);font-weight:500}
.tx .amt{font-size:18px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .chk{width:28px;height:28px;box-shadow:inset 0 0 0 2px var(--fill2);color:transparent}
.tx .chk svg{width:16px;height:16px}
.tx.done{opacity:.5}
.tx.done .amt{color:var(--ok);text-decoration:line-through}
.tx.done .chk{background:var(--ok);box-shadow:none;color:var(--ink)}
.ledger{display:flex;flex-direction:column;padding:6px 18px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lrow .nm b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{font-size:12px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.lrow .net{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:17px}
.lrow .net small{font-size:12px;font-weight:700}
.stmt{display:flex;flex-direction:column;gap:8px}
.stmt h4{font-size:16px;display:flex;justify-content:space-between;gap:12px}
.stmt h4 span{color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}
.sline{display:flex;gap:10px;font-size:14px;line-height:1.4;color:var(--mute);font-weight:500}
.sline b{color:var(--paper)}
.sline i{flex:none;width:6px;height:6px;border-radius:6px;background:var(--yellow);margin-top:7px}
.sline.g i{background:var(--ok)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px}
.empty .eico{width:64px;height:64px;background:var(--fill);color:var(--ok)}
.empty .eico svg{width:30px;height:30px}
.empty b{font-size:18px}.empty p{font-size:14px;color:var(--mute);font-weight:500;max-width:280px}
.empty .chip{margin-top:6px}
.tgrow{display:flex;align-items:center;gap:12px;width:100%;font-size:15px;font-weight:700}
.tgrow span{flex:1}.tgrow small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.tgl{flex:none;position:relative;width:48px;height:28px;border-radius:28px;background:var(--fill2);transition:background .25s}
.tgl b{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:22px;background:var(--paper);transition:transform .3s var(--ease)}
.tgl.on{background:var(--ok)}.tgl.on b{transform:translateX(20px)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--ink) 40%)}
.bar .in{max-width:440px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:30px;background:var(--paper);color:var(--ink);font-size:17px;font-weight:700;text-align:center;transition:transform .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
.btn b{color:var(--ink);background:var(--yellow);border-radius:100px;padding:2px 10px;font-size:15px;font-variant-numeric:tabular-nums}
.btn.gh{background:var(--fill);color:var(--paper)}
.btn.danger{background:var(--err-bg);color:var(--err)}

/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .sb{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s}
.sheet .sp{position:relative;width:100%;max-width:472px;max-height:88vh;overflow:auto;background:var(--sheet);border-radius:32px 32px 0 0;padding:30px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px;animation:up .35s var(--ease)}

<script>
(() => {
/* ================= storage & model ================= */
const KEY = 'coong_calc_v3', OLD = 'coong_calc_v2', HIST = 'coong_member_history';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const dayOffset = n => { const dt = new Date(); dt.setDate(dt.getDate() + n); return iso(dt); };
let uid = 1;
const mk = (name, role='normal', amount=0, donate=0) => ({ id: uid++, name, role, amount, donate });
const newStage = (k, payerId) => ({ id: uid++, name: `Tăng ${k}`, total: 0, payers: payerId ? [{ id: payerId, amt: null }] : [], parts: [] });
const blankEvent = () => ({ id: uid++, name: '', date: dayOffset(0), members: [], stages: [newStage(1)], round: true, done: {} });
const sampleEvent = () => {
  const members = [mk('An'), mk('Bình'), mk('Chi'), mk('Dũng','donate',0,500000), mk('Linh','custom',150000)];
  const ids = n => members.filter(x => n.includes(x.name)).map(x => x.id);
  return { id: uid++, name: 'Ví dụ: Nhậu thứ Sáu', sample: true, date: dayOffset(0), members, round: true, done: {}, stages: [
    { id: uid++, name: 'Tăng 1 · Lẩu nướng', total: 2400000, payers: [{ id: members[0].id, amt: null }], parts: ids(['An','Bình','Chi','Dũng','Linh']) },
    { id: uid++, name: 'Tăng 2 · Karaoke', total: 900000, manual: true, payers: [{ id: members[1].id, amt: 500000 }, { id: members[0].id, amt: 400000 }], parts: ids(['An','Bình','Chi','Dũng']) },
    { id: uid++, name: 'Tăng 3 · Ăn đêm', total: 360000, payers: [{ id: members[2].id, amt: null }], parts: ids(['An','Bình','Chi']) } ] };
};
function migrate(ev){
  ev.members = Array.isArray(ev.members) ? ev.members : [];
  ev.stages = Array.isArray(ev.stages) ? ev.stages : [];
  ev.members.forEach(m => {
    if (m.role === 'donate' && !m.donate) { m.donate = Number(m.amount) || 0; m.amount = 0; }
    m.donate = Number(m.donate) || 0; m.amount = Number(m.amount) || 0; m.role = m.role || 'normal';
  });
  ev.stages.forEach(st => {
    if (!Array.isArray(st.payers)) st.payers = st.payer ? [{ id: st.payer, amt: null }] : [];
    delete st.payer; st.parts = Array.isArray(st.parts) ? st.parts : [];
  });
  ev.name = ev.name || ''; ev.date = ev.date || dayOffset(0); ev.done = ev.done || {}; ev.round = ev.round !== false;
  return ev;
}
const hadLocal = !!store.get(KEY);
let root = store.get(KEY);
if (!root || !Array.isArray(root.events)) {
  const old = store.get(OLD);
  root = old && Array.isArray(old.members) ? { events: [{ id: 1, ...old }] } : { events: [sampleEvent()] };
}
root.events.forEach(migrate);
uid = Math.max(uid, ...root.events.flatMap(e => [e.id, ...e.members.map(m => m.id), ...e.stages.map(s => s.id)])) + 1;
root.me = root.me || '';
let history = store.get(HIST); if (!Array.isArray(history)) history = [];
root.updatedAt = root.updatedAt || (hadLocal ? 1 : 0);   // 0 = only the built-in example, cloud data always wins over it

/* ================= cloud sync =================
   iPhone keeps a home-screen app's storage separate from Safari's, so localStorage alone looks like a "reset".
   Each person gets a private sổ (book) code in the URL (/s/CODE). The data is kept in Firestore under that code
   (plain REST, no SDK) and in localStorage as an offline copy. Same link → same data in Safari, on the home screen,
   or on another phone. Newest change wins (updatedAt). */
const FS_URL = 'https://firestore.googleapis.com/v1/projects/quanlyquy-f5fce/databases/(default)/documents/books/';
const FS_KEY = 'AIzaSyCyQv6aBKLrzUyzBw5hc36fe9kbifKiPrI';
const BOOK = 'coong_book';
const CODE_RE = /[A-Za-z0-9]{20,40}/;
const onWeb = /^https?:$/.test(location.protocol) && !/claude|anthropic|usercontent/.test(location.hostname);
const newCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; return [...crypto.getRandomValues(new Uint8Array(22))].map(x => a[x % a.length]).join(''); };
const urlCode = (location.pathname.match(/^\/s\/([A-Za-z0-9]{20,40})\/?$/) || [])[1];
let book = urlCode || store.get(BOOK) || newCode();
let syncState = onWeb ? 'saving' : 'off', pushT = null;
function setBook(code){
  book = code; store.set(BOOK, code);
  if (onWeb && location.pathname !== '/s/' + code) window.history.replaceState(null, '', '/s/' + code);
}
setBook(book);
const bookLink = () => `${location.origin}/s/${book}`;
function setSync(st){
  syncState = st;
  const b = document.getElementById('syncBtn'); if (!b) return;
  b.hidden = !onWeb; b.className = 'sync ' + st;
  b.innerHTML = `<i></i>${{ ok: 'Đã lưu online', saving: 'Đang lưu…', err: 'Chưa lưu online', off: '' }[st] || ''}`;
}
const save = () => { root.updatedAt = Date.now(); store.set(KEY, root); schedulePush(); };
function schedulePush(){ if (!onWeb) return; clearTimeout(pushT); setSync('saving'); pushT = setTimeout(push, 700); }
async function push(){
  if (!onWeb) return;
  try {
    if (!root.updatedAt) root.updatedAt = 1;
    const body = { fields: { data: { stringValue: JSON.stringify({ root, history }) }, updatedAt: { integerValue: String(root.updatedAt) } } };
    const r = await fetch(`${FS_URL}${book}?key=${FS_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true });
    if (!r.ok) throw new Error(r.status);
    store.set(KEY, root); setSync('ok');
  } catch(e) { setSync('err'); }
}
async function pull(){
  try {
    const r = await fetch(`${FS_URL}${book}?key=${FS_KEY}`, { cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    return { at: Number(j.fields?.updatedAt?.integerValue || 0), data: JSON.parse(j.fields?.data?.stringValue || 'null') };
  } catch(e) { setSync('err'); return undefined; }
}
function applyRemote(remote){
  const d = remote.data; if (!d || !d.root || !Array.isArray(d.root.events)) return false;
  if (hadLocal) store.set(KEY + '_backup', root);           // keep the previous local copy, just in case
  root = d.root; root.events.forEach(migrate); root.me = root.me || ''; root.updatedAt = remote.at;
  if (Array.isArray(d.history)) { history = d.history; store.set(HIST, history); }
  uid = Math.max(uid, ...root.events.flatMap(e => [e.id, ...e.members.map(m => m.id), ...e.stages.map(s => s.id)])) + 1;
  store.set(KEY, root);
  return true;
}
async function syncNow(){
  if (!onWeb) return;
  setSync('saving');
  const remote = await pull();
  if (remote === undefined) return;
  if (remote && remote.at >= root.updatedAt && remote.at !== root.updatedAt) {
    if (applyRemote(remote)) {
      const keep = view === 'event' && S && root.events.find(e => e.id === S.id);
      $('#sheet').hidden = true;
      if (keep) { S = keep; show('event'); } else { S = null; show('home'); }
    }
    setSync('ok');
  } else if (!remote || remote.at < root.updatedAt) push();
  else setSync('ok');
}
function syncSheet(){
  openSheet(`<h3>Lưu dữ liệu online</h3>
    <p>Dữ liệu của bạn được lưu theo đường link riêng bên dưới. Mở link này ở Safari, ở biểu tượng ngoài màn hình chính hay ở máy khác đều thấy cùng dữ liệu. Ai có link đều xem và sửa được, nên chỉ gửi cho người trong nhóm.</p>
    <input class="linkbox" id="bookLink" readonly value="${esc(bookLink())}" aria-label="Link dữ liệu của bạn">
    <div class="acts"><button class="btn" id="copyLink">${svg('i-copy')}Chép link</button></div>
    <p><b style="color:var(--paper)">Đưa ra màn hình iPhone:</b> mở link này trong Safari, bấm nút Chia sẻ rồi chọn “Thêm vào MH chính”. Nếu đã có biểu tượng cũ, xoá nó rồi thêm lại từ link này.</p>
    <p style="margin-top:6px">Có link từ máy khác? Dán vào đây để mở đúng dữ liệu đó:</p>
    <div class="addrow"><input class="field" id="otherLink" placeholder="Dán link hoặc mã" autocomplete="off" aria-label="Link từ máy khác"><button class="circ addbtn" id="openBook" aria-label="Mở">${svg('i-arrow')}</button></div>
    ${syncState === 'err' ? `<div class="warn">${svg('i-warn')}<span>Chưa kết nối được máy chủ. Dữ liệu vẫn lưu trên máy này và sẽ tự lưu online khi có mạng.</span></div>` : ''}`);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'syncBtn') { syncSheet(); return; }
  if (t.id === 'copyLink') { const l = bookLink(); const sel = () => { const i = $('#bookLink'); i.focus(); i.select(); };
    try { navigator.clipboard.writeText(l).then(() => toast('Đã chép link'), sel); } catch(_) { sel(); } return; }
  if (t.id === 'openBook') { const m = ($('#otherLink').value.match(CODE_RE) || [])[0];
    if (!m) { toast('Link không đúng'); return; }
    if (m === book) { $('#sheet').hidden = true; return; }
    store.set(KEY + '_backup', root); setBook(m); root.updatedAt = 0; $('#sheet').hidden = true; syncNow(); toast('Đang mở dữ liệu…'); return; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); else if (pushT) { clearTimeout(pushT); push(); } });
try { navigator.storage?.persist?.(); } catch(_) {}

/* ui state */
let S = null, view = 'home', mode = 'edit', dateFilter = 'all';
const openParts = new Set();   // stages whose "ai tham gia" list is expanded

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n || 0).toLocaleString('vi-VN');
const short = n => n >= 1e6 ? (Math.round(n / 1e5) / 10).toLocaleString('vi-VN') + 'tr' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n);
const parseMoney = v => Number(String(v).replace(/\D/g,'')) || 0;
const PAL = ['#ffcc00','#34c759','#40c8e0','#ff9f0a','#ff375f','#bf5af2','#64d2ff','#30d158'];
const color = name => { let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0; return PAL[h % PAL.length]; };
const av = (name, cls='') => `<span class="av ${cls}" style="--c:${color(name)}">${esc([...String(name).trim()][0] || '?').toUpperCase()}</span>`;
const svg = id => `<svg><use href="#${id}"/></svg>`;
const byId = id => S.members.find(m => m.id === id);
const low = s => String(s).trim().toLowerCase();
const isMe = name => root.me && low(name) === low(root.me);
const dmy = d => d.split('-').reverse().join('/');
const dayLabel = d => d === dayOffset(0) ? 'Hôm nay' : d === dayOffset(-1) ? 'Hôm qua' : dmy(d);
const evName = e => (e.name || '').trim() || `Cuộc vui ${dmy(e.date).slice(0,5)}`;
const txKey = t => `${t.from}>${t.to}:${t.amount}`;

/* ================= settlement engine =================
   - "Đóng cố định" (TTS / đến muộn / về sớm): pays a fixed amount for the whole outing.
   - "Donate": pays only the donation, which comes off the bill; exempt from the equal split.
   - Fixed amounts and donations are paid ONCE, spread over the stages that person joined in proportion to each bill.
   - Everyone else splits what is left of each stage equally.
   - Over-large fixed amounts are scaled down to the bill; a stage with nobody to split the rest falls back to everyone in it.
   - Net = paid − cost; transfers: largest debtor pays largest creditor until everyone is at 0. */
function settle(state){
  const members = state.members, warns = [];
  const find = id => members.find(m => m.id === id);
  const cost = {}, paid = {};
  members.forEach(m => { cost[m.id] = 0; paid[m.id] = 0; });
  const valid = state.stages.map(s => ({ ...s, parts: s.parts.filter(find), total: Number(s.total) || 0 }))
                            .filter(s => s.total > 0 && s.parts.length);
  const billOf = {};
  members.forEach(m => billOf[m.id] = valid.filter(s => s.parts.includes(m.id)).reduce((a,s) => a + s.total, 0));
  members.forEach(m => {
    const extra = m.role === 'custom' ? m.amount : m.role === 'donate' ? m.donate : 0;
    if (extra > 0 && !billOf[m.id]) warns.push(`${m.name} đóng ${fmt(extra)}đ nhưng chưa tham gia khoản chi nào, nên chưa được tính.`);
  });
  const detail = {};
  let grand = 0;
  valid.forEach(s => {
    grand += s.total;
    const label = s.name || 'Khoản chi';
    const pays = (s.payers || []).filter(x => find(x.id)).map(x => ({ id: x.id, amt: Number(x.amt) || 0 }));
    if (!pays.length) warns.push(`"${label}" chưa chọn ai trả tiền.`);
    else if (pays.length === 1) pays[0].amt = s.total;
    else {
      const sum = pays.reduce((a, x) => a + x.amt, 0);
      if (Math.abs(sum - s.total) > 0.5) {
        warns.push(`"${label}": tiền góp ${fmt(sum)}đ chưa khớp hóa đơn ${fmt(s.total)}đ, đã tính theo tỷ lệ.`);
        pays.forEach(x => x.amt = sum > 0 ? x.amt * s.total / sum : s.total / pays.length);
      }
    }
    pays.forEach(x => paid[x.id] += x.amt);
    const fixed = [], officials = [];
    s.parts.forEach(id => {
      const m = find(id), k = s.total / billOf[id];
      if (m.role === 'custom') fixed.push({ id, kind: 'custom', amt: (m.amount || 0) * k });
      else if (m.role === 'donate') fixed.push({ id, kind: 'donate', amt: (m.donate || 0) * k });
      else officials.push(id);
    });
    let F = fixed.reduce((a,f) => a + f.amt, 0);
    if (F > s.total) {
      const k = s.total / F; fixed.forEach(f => f.amt *= k); F = s.total;
      warns.push(`"${label}": tiền donate/cố định vượt hóa đơn, đã giảm xuống bằng hóa đơn.`);
    }
    fixed.forEach(f => cost[f.id] += f.amt);
    const rest = s.total - F;
    let per = 0, sharers = officials;
    if (officials.length) per = rest / officials.length;
    else if (rest > 0.5) {
      sharers = s.parts; per = rest / s.parts.length;
      warns.push(`"${label}": không còn ai chia đều, phần còn lại ${fmt(rest)}đ chia cho cả ${s.parts.length} người.`);
    }
    sharers.forEach(id => cost[id] += per);
    detail[s.id] = { per, sharerIds: [...sharers], fixed, rest, pays };
  });
  const unit = state.round ? 1000 : 1;
  const nets = members.map(m => ({ id: m.id, name: m.name, paid: paid[m.id], cost: cost[m.id], net: Math.round((paid[m.id] - cost[m.id]) / unit) * unit }));
  const resid = nets.reduce((a,n) => a + n.net, 0);
  if (resid && nets.length) { const big = nets.reduce((a,b) => Math.abs(b.net) > Math.abs(a.net) ? b : a); big.net -= resid; }
  const debt = nets.filter(n => n.net < 0).map(n => ({ id: n.id, a: -n.net })).sort((a,b) => b.a - a.a);
  const cred = nets.filter(n => n.net > 0).map(n => ({ id: n.id, a: n.net })).sort((a,b) => b.a - a.a);
  const txs = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const p = Math.min(debt[i].a, cred[j].a);
    if (p > 0) txs.push({ from: debt[i].id, to: cred[j].id, amount: p });
    debt[i].a -= p; cred[j].a -= p;
    if (debt[i].a === 0) i++;
    if (cred[j].a === 0) j++;
  }
  return { grand, nets, txs, warns, detail };
}
window.coongSettle = settle;

/* my position in one event (unpaid transfers only) */
function mineFor(ev, r = settle(ev)){
  if (!root.me) return null;
  const m = ev.members.find(x => isMe(x.name)); if (!m) return null;
  const nm = id => ev.members.find(x => x.id === id)?.name || '?';
  const o = { recv: 0, owe: 0, from: [], to: [], any: 0 };
  r.txs.forEach(t => {
    const done = !!ev.done[txKey(t)];
    if (t.to === m.id) { o.any++; if (!done) { o.recv += t.amount; o.from.push(nm(t.from)); } }
    if (t.from === m.id) { o.any++; if (!done) { o.owe += t.amount; o.to.push(nm(t.to)); } }
  });
  return o;
}

function saveForm(){
  draft.name = $('#gName').value.trim();

  if (!draft.name) { $('#gName').focus(); toast('Đặt tên nhóm trước nhé'); return; }
  const remember = n => { if (!history.some(h => low(h) === low(n))) { history.push(n); store.set(HIST, history); } };
  if (!draft.id) {
    const ev = blankEvent(); ev.name = draft.name;
    ev.members = draft.members.map(m => mk(m.name));
    ev.members.forEach(m => remember(m.name));
    const st = ev.stages[0]; st.parts = ev.members.map(m => m.id); if (ev.members[0]) st.payers = [{ id: ev.members[0].id, amt: null }];
    root.events.push(ev); save();

  }
  const ev = root.events.find(e => e.id === draft.id); if (!ev) return show('home');
  const keep = new Set(draft.members.filter(m => m.id).map(m => m.id));
  ev.name = draft.name;
  ev.members = ev.members.filter(m => keep.has(m.id));
  const added = draft.members.filter(m => !m.id).map(m => { remember(m.name); return mk(m.name); });
  ev.members.push(...added);
  ev.stages.forEach(s => {
    s.parts = s.parts.filter(id => keep.has(id)).concat(added.map(m => m.id));
    s.payers = s.payers.filter(x => keep.has(x.id) || added.some(m => m.id === x.id));
    if (!s.payers.length && ev.members[0]) s.payers = [{ id: ev.members[0].id, amt: null }];
    if (s.payers.length > 1 && !s.manual) { const n = s.payers.length, total = Number(s.total) || 0, base = Math.floor(total / n / 1000) * 1000 || Math.floor(total / n); s.payers.forEach((x, i) => x.amt = base + (i === 0 ? total - base * n : 0)); }

}

      <span class="amt">${fmt(t.amount)}đ</span></button>`;
  }).join('') : `<div class="card empty"><span class="circ eico">${svg('i-check')}</span><b>Hòa cả làng</b><p>Không ai nợ ai.</p></div>`;
  const people = `<div class="card ledger">${R.nets.map(n => {
    const m = byId(n.id);
    const role = m.role === 'donate' ? ` · donate` : m.role === 'custom' ? ` · cố định` : '';
    const net = n.net > 0 ? `<span class="net pos">+${fmt(n.net)}<small>được nhận</small></span>` : n.net < 0 ? `<span class="net neg">−${fmt(-n.net)}<small>cần chuyển</small></span>` : `<span class="net zero">0<small>hòa</small></span>`;
    return `<div class="lrow">${av(n.name)}<span class="nm"><b>${esc(n.name)}${isMe(n.name) ? '<span class="badge">Tôi</span>' : ''}</b><small>Đã trả ${fmt(n.paid)} · Phần mình ${fmt(n.cost)}${role}</small></span>${net}</div>`;
  }).join('')}</div>`;
  const stages = S.stages.filter(s => R.detail[s.id]).map(s => {
    const d = R.detail[s.id];
    return `<div class="card stmt"><h4><b>${esc(s.name || 'Khoản chi')}</b><span>${fmt(s.total)}đ</span></h4>
      <div class="sline"><i></i><span>${d.pays.length === 1 ? `<b>${esc(nm(d.pays[0].id))}</b> trả cả hóa đơn` : `Góp chung: ${d.pays.map(x => `<b>${esc(nm(x.id))}</b> ${fmt(x.amt)}đ`).join(', ')}`}</span></div>
      ${d.fixed.map(f => `<div class="sline g"><i></i><span><b>${esc(nm(f.id))}</b> ${f.kind === 'donate' ? 'donate' : 'đóng cố định'} <b>${fmt(f.amt)}đ</b>${f.kind === 'donate' ? ', không chia đều' : ''}</span></div>`).join('')}
      ${d.sharerIds.length ? `<div class="sline"><i></i><span>Còn ${fmt(d.rest)}đ chia đều cho ${esc(d.sharerIds.map(nm).join(', '))}: mỗi người <b>${fmt(d.per)}đ</b></span></div>` : ''}</div>`;
  }).join('');
  $('#pRes').innerHTML = hero + warns +
    `<div class="sh"><b>Ai chuyển cho ai</b><small>Làm đúng các lượt này là xong</small></div>` + txs +
    `<div class="sh" style="margin-top:6px"><b>Mỗi người</b><small>Đã trả trừ phần mình</small></div>` + people +
    `<div class="sh" style="margin-top:6px"><b>Từng khoản</b></div>` + stages +
    `<div class="card"><button class="tgrow" id="roundBtn" aria-pressed="${!!S.round}"><span>Làm tròn đến 1.000đ<small>Cho dễ chuyển khoản, phần lẻ dồn vào một người</small></span><i class="tgl ${S.round ? 'on' : ''}"><b></b></i></button></div>`;
}

/* ================= bottom bar ================= */
function renderBar(){
  const b = $('#barIn');
  if (view === 'home') { b.innerHTML = `<button class="btn" id="newEv">${svg('i-plus')}Tạo nhóm mới</button>`; return; }
  if (view === 'form') { b.innerHTML = `<button class="btn danger" id="delGroup">Xóa nhóm</button><button class="btn" id="saveGroup">${draft.id ? 'Lưu' : 'Tạo nhóm'}</button>`; return; }
  if (mode === 'edit') { b.innerHTML = `<button class="btn" id="toRes">Xem ai chuyển cho ai${R.txs.length ? ` <b>${R.txs.length}</b>` : ''}</button>`; return; }
  b.innerHTML = R.grand ? `<button class="btn" id="copyBtn">${svg('i-copy')}Gửi tin nhắn vào nhóm Zalo</button>` : `<button class="btn" id="toEdit">Nhập khoản chi</button>`;
}

/* ================= navigation ================= */
function show(v){
  view = v;
  $('#vHome').hidden = v !== 'home'; $('#vEvent').hidden = v !== 'event'; $('#vForm').hidden = v !== 'form';
  if (v === 'home') { renderHome(); renderBar(); }
  else if (v === 'form') { renderBar(); }
  else { R = settle(S); $('#nTx').textContent = R.txs.length; renderHead(); renderMode(); }
  window.scrollTo({ top: 0 });
}
function openEvent(id){
  S = root.events.find(e => e.id === id); if (!S) return;
  openParts.clear();
  mode = settle(S).grand > 0 ? 'res' : 'edit';
  show('event');
}
function goHome(){
  if (S && !S.members.length && !settle(S).grand && !S.name.trim()) root.events = root.events.filter(e => e.id !== S.id);
  save(); S = null; show('home');
}
function newEvent(){ return openForm(null); }
function newEventDirect(){
  const ev = blankEvent();
  root.events.push(ev); save();
  S = ev; mode = 'edit'; openParts.clear(); show('event');
  setTimeout(() => $('#newName').focus(), 50);
}

/* ================= sheet / toast / zalo ================= */
function openSheet(html){ $('#sheetBody').innerHTML = html; $('#sheet').hidden = false; }
function closeSheet(){ $('#sheet').hidden = true; if (view === 'event' && mode === 'edit') { renderMembers(); renderStages(); } }
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); };
function zaloText(){
  const nm = id => byId(id)?.name || '?';
  let t = `📣 ${evName(S).toUpperCase()} · ${dmy(S.date)}\n━━━━━━━━━━━━━━\n💰 Tổng: ${fmt(R.grand)}đ\n\n`;
  S.stages.forEach((s, k) => { const d = R.detail[s.id]; if (!d) return;
    t += `${k+1}. ${s.name || 'Khoản chi'}: ${fmt(s.total)}đ (${d.pays.map(x => nm(x.id)).join(' + ') || '?'} trả)${d.sharerIds.length ? ` · ${fmt(d.per)}đ/người` : ''}\n`; });
  const extra = [];
  S.members.forEach(m => { if (m.role === 'donate' && m.donate > 0) extra.push(`🎁 ${m.name} donate ${fmt(m.donate)}đ`); if (m.role === 'custom' && m.amount > 0) extra.push(`🎓 ${m.name} đóng cố định ${fmt(m.amount)}đ`); });
  if (extra.length) t += '\n' + extra.join('\n') + '\n';
  t += `\n💸 CHUYỂN KHOẢN:\n`;
  t += R.txs.length ? R.txs.map((x, i) => `${i+1}. ${nm(x.from)} ➜ ${nm(x.to)}: ${fmt(x.amount)}đ${S.done[txKey(x)] ? ' ✅' : ''}`).join('\n') : 'Hòa cả làng, không ai nợ ai!';
  return t + `\n\nAnh em ting ting sớm cho các chủ xị nhé! ❤️`;
}
function copyZalo(){
  const text = zaloText();
  const fallback = () => {
    openSheet(`<h3>Tin nhắn chốt sổ</h3><p>Giữ vào ô bên dưới, chọn tất cả rồi chép.</p><textarea id="zaloTa" readonly>${esc(text)}</textarea><div class="acts"><button class="btn" data-close>Xong</button></div>`);
    const ta = $('#zaloTa'); ta.focus(); ta.select();
  };
  try { navigator.clipboard.writeText(text).then(() => toast('Đã chép, dán vào nhóm Zalo nhé'), fallback); } catch(e) { fallback(); }
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) { if (e.target.closest('.sb')) closeSheet(); return; }
  const d = t.dataset;
  // home
  if (t.id === 'newEv') return newEvent();
  if (d.open) return openEvent(+d.open);
  if (d.df) { dateFilter = d.df; renderHome(); return; }
  if (d.me) { root.me = d.me; save(); renderHome(); toast(`Chào ${d.me}!`); return; }
  if (d.changeme !== undefined) { root.me = ''; save(); renderHome(); return; }
  // event header
  if (t.id === 'backBtn') return goHome();
  if (d.mode) { mode = d.mode; renderMode(); return; }
  if (t.id === 'toRes') { mode = 'res'; renderMode(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (R.txs.length && !R.txs.some(x => S.done[txKey(x)])) fireworks(); return; }
  if (t.id === 'toEdit') { mode = 'edit'; renderMode(); return; }
  if (t.id === 'menuBtn') { openSheet(`<h3>${esc(evName(S))}</h3><p>Xoá cuộc vui này khỏi máy. Không hoàn tác được.</p><div class="acts"><button class="btn gh" data-close>Huỷ</button><button class="btn danger" id="doDel">Xoá cuộc vui</button></div>`); return; }
  if (t.id === 'doDel') { root.events = root.events.filter(x => x.id !== S.id); $('#sheet').hidden = true; S = null; save(); show('home'); toast('Đã xoá cuộc vui'); return; }
  // members
  if (t.id === 'addMember') { const inp = $('#newName'); if (addMember(inp.value)) { inp.value = ''; inp.focus(); } else { $('.addrow').classList.add('shake'); setTimeout(() => $('.addrow').classList.remove('shake'), 400); } return; }
  if (d.add) { addMember(d.add); return; }
  if (d.group) { const ev = root.events.find(x => x.id === +d.group); let n = 0;
    ev.members.forEach(m => { if (addMember(m.name, false)) { const nm = S.members[S.members.length - 1]; nm.role = m.role; nm.amount = m.amount; nm.donate = m.donate; n++; } });
    renderMembers(); renderStages(); recompute(); toast(`Đã thêm ${n} người`); return; }
  if (d.mem) { memberSheet(+d.mem); return; }
  if (d.role) { const m = byId(+d.id); m.role = d.role; recompute(); memberSheet(m.id); return; }
  if (d.isme) { const m = byId(+d.isme); root.me = isMe(m.name) ? '' : m.name; save(); memberSheet(m.id); return; }
  if (d.delm) { $('#sheet').hidden = true; removeMember(+d.delm); return; }
  // stages
  if (t.id === 'addStage') return addStage();
  if (d.dels) { S.stages = S.stages.filter(s => s.id !== +d.dels); recompute(); renderStages(); return; }
  if (d.payer) { const st = S.stages.find(s => s.id === +d.s), id = +d.payer, i = st.payers.findIndex(x => x.id === id);
    if (i >= 0) { if (st.payers.length > 1) st.payers.splice(i, 1); } else st.payers.push({ id, amt: null });
    if (st.payers.length > 1) equalize(st); else if (st.payers[0]) st.payers[0].amt = null;
    recompute(); renderStages(); return; }
  if (d.peq) { equalize(S.stages.find(s => s.id === +d.peq)); recompute(); renderStages(); return; }
  if (d.openparts) { openParts.add(+d.openparts); renderStages(); return; }
  if (d.part) { const s = S.stages.find(s => s.id === +d.s), id = +d.part; openParts.add(s.id);
    s.parts = s.parts.includes(id) ? s.parts.filter(p => p !== id) : [...s.parts, id]; recompute(); renderStages(); return; }
  if (d.all) { const s = S.stages.find(s => s.id === +d.all), all = S.members.every(m => s.parts.includes(m.id)); openParts.add(s.id);
    s.parts = all ? [] : S.members.map(m => m.id); recompute(); renderStages(); return; }
  // results
  if (t.id === 'copyBtn') return copyZalo();
  if (d.tx) { if (S.done[d.tx]) delete S.done[d.tx]; else S.done[d.tx] = true; save(); renderResults();
    if (R.txs.length && R.txs.every(x => S.done[txKey(x)])) { toast('Xong hết rồi, hết nợ!'); fireworks(); } return; }
  if (t.id === 'roundBtn') { S.round = !S.round; recompute(); renderResults(); return; }
  if (d.close !== undefined) { closeSheet(); return; }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'evName') { S.name = el.value; save(); return; }
  if (el.id === 'evDate') { if (el.value) { S.date = el.value; save(); renderHead(); } return; }
  if (d.sname) { S.stages.find(s => s.id === +d.sname).name = el.value; save(); return; }
  if (d.mamt || d.stotal || d.pamt) {
    const v = parseMoney(el.value); el.value = v ? fmt(v) : '';
    if (d.mamt) { const m = byId(+d.mamt); if (m.role === 'donate') m.donate = v; else m.amount = v; }
    else if (d.pamt) { const [sid, pid] = d.pamt.split(':').map(Number), st = S.stages.find(x => x.id === sid); st.payers.find(x => x.id === pid).amt = v; st.manual = true; }
    else { const st = S.stages.find(s => s.id === +d.stotal); st.total = v;
      if (st.payers.length > 1 && !st.manual) { equalize(st); st.payers.forEach(x => { const i = document.getElementById(`pa-${st.id}-${x.id}`); if (i) i.value = x.amt ? fmt(x.amt) : ''; }); } }
    recompute();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); if (addMember(e.target.value)) e.target.value = ''; }
  if (e.key === 'Enter' && (e.target.id === 'evName' || e.target.dataset.sname)) e.target.blur();
  if (e.key === 'Enter' && e.target.id === 'mAmt') closeSheet();
});
document.addEventListener('focusin', e => { if (e.target.matches('[data-stotal],[data-pamt],[data-mamt]')) setTimeout(() => e.target.select?.(), 0); });

/* fireworks: same burst as the Coong app's order-done screen */
function fireworks(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const w = innerWidth, h = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  const cv = document.createElement('canvas'); cv.className = 'fx'; cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+'px'; cv.style.height = h+'px';
  document.body.appendChild(cv); const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const C = ['#ffcc00','#ffffff','#ff9f0a','#34c759','#ff375f','#64d2ff'], rnd = (a,b) => a + Math.random()*(b-a);
  let ps = [], shots = [], last = performance.now(); const end = last + 3000;
  const launch = side => { const x0 = side<0 ? -4 : w+4, y0 = rnd(h*.6,h*.8); shots.push({ x0, y0, tx: w/2 + rnd(-w*.25,w*.25), ty: rnd(h*.15,h*.4), t: 0, dur: rnd(520,760) }); };
  [0,380,760].forEach(d => setTimeout(() => { launch(-1); launch(1); }, d));
  const frame = now => {
    const dt = Math.min(40, now - last); last = now; g.clearRect(0,0,w,h);
    for (let i = shots.length-1; i >= 0; i--) { const s = shots[i]; s.t += dt; const k = Math.min(1, s.t/s.dur), q = 1-(1-k)**2;
      const x = s.x0+(s.tx-s.x0)*q, y = s.y0+(s.ty-s.y0)*q; g.globalAlpha = 1; g.fillStyle = '#ffe58a'; g.beginPath(); g.arc(x,y,2.2,0,7); g.fill();
      if (k >= 1) { const col = [C[Math.random()*6|0], C[Math.random()*6|0]]; for (let n = 0; n < 46; n++) { const a = Math.random()*7, v = rnd(1.2,4.6); ps.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 0, max: rnd(900,1500), c: col[n%2], r: rnd(1.4,2.8) }); } shots.splice(i,1); } }
    for (let i = ps.length-1; i >= 0; i--) { const p = ps[i]; p.life += dt; if (p.life > p.max) { ps.splice(i,1); continue; }
      p.vx *= .985; p.vy = p.vy*.985 + .045*(dt/16); p.x += p.vx*(dt/16); p.y += p.vy*(dt/16);
      g.globalAlpha = Math.max(0, 1-p.life/p.max); g.fillStyle = p.c; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); }
    if (now < end || shots.length || ps.length) requestAnimationFrame(frame); else cv.remove();
  };
  requestAnimationFrame(frame);
}

store.set(KEY, root);
show('home');
setSync(syncState);
syncNow();
})();
</script>
