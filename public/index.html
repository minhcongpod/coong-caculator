<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coong Nợ</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coong Nợ">
<meta property="og:type" content="website">
<meta property="og:title" content="Coong Nợ">
<meta property="og:description" content="Chia tiền nhóm: ai chuyển cho ai">
<meta property="og:image" content="https://coongno.web.app/og-image.png?v=7">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=7">
<link rel="icon" href="/favicon.ico?v=7" sizes="any">
<link rel="icon" href="/icon.svg?v=7" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>   <!-- chỉ dùng khi xuất ảnh: không chặn trang hiện lên -->
<style>
/* Khung điện thoại 390 (fitZoom), theo Figma. Màn hình: Xin chào → Tạo/Chỉnh sửa nhóm → Nhóm (khoản chi, quỹ) → Tổng kết; menu trái, Tài khoản, sheet vai trò / ảnh, giữ lâu card. */
:root{
  color-scheme:dark;
  --ink:#000; --paper:#fff; --card:#1c1c1c; --chip:#2c2c2c; --deep:#141414; --sheet:#1c1c1c;
  --mute:rgba(255,255,255,.55); --faint:rgba(255,255,255,.3); --line:rgba(255,255,255,.1);
  --yellow:#fc0; --cyan:#00c0e8; --pink:#cb30e0; --red:#ff383c; --green:#34c759;
  --red-bg:rgba(255,56,60,.18);
  --font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{background:var(--ink);color:var(--paper)}
body{margin:0;font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0}
/* (đã bỏ tấm che cố định body::before: iOS 26 thấy phần tử cố định sát mép trên thì tự thêm lớp mờ lên đầu trang; Coong cafe không có nên sạch) */
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}input{outline:0;font:inherit;color:inherit}
p,h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
svg{display:block;flex:none}
.app{max-width:342px;margin:0 auto;padding-top:calc(32px + calc(env(safe-area-inset-top,0px) / var(--z,1)));   /* app ghim ra màn hình chính: nội dung vẽ dưới thanh trạng thái, iOS làm mờ/tối phần nằm trong vùng đó → chừa đúng chiều cao vùng an toàn (chia cho zoom của html vì env() không bị zoom) */
  
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.circ{display:flex;align-items:center;justify-content:center;border-radius:100px;flex:none}

/* header */
.logo{display:flex;justify-content:center;align-items:center;min-height:32px;padding-bottom:8px;margin-top:8px}
.logo .wm{width:152px;height:30.4px}
.back{width:52px;height:52px;background:var(--card);color:var(--paper)}
.back svg{width:20px;height:20px}
.ghead{display:flex;align-items:center;gap:12px;margin:-8px 0 4px}
.ghead h1{font-size:24px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ghead .hsp{width:52px;height:52px;flex:none}

/* home group list */
.home0{min-height:calc(var(--vh,100dvh) - 32px - calc(env(safe-area-inset-top,0px) / var(--z,1)) - 122px - env(safe-area-inset-bottom,0px));gap:24px}
html:has(.home0),html:has(.home0) body{overflow:hidden}
html:has(.home0) .bar{background:none}   /* trang xin chào không cuộn: bỏ lớp đen mờ sau nút để không che chữ */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:32px}   /* khoảng trống chia đều: logo – minh hoạ – lời chào – nút */
.ill{display:flex;flex-direction:column;align-items:center;padding-top:12px;line-height:1.25;pointer-events:none;user-select:none}
.ill > div{width:100%;box-sizing:border-box;flex:none;background:var(--card);border-radius:30px;padding:15px;box-shadow:0 0 38px rgba(0,0,0,.55)}
.ill .c1{margin-top:8px}.ill .c2{margin-top:7px}.ill .c3{margin-top:4px;margin-bottom:6px}
.ill .c1{rotate:3deg;border-radius:27px;padding:15px 19px;display:flex;flex-direction:column;gap:11px;box-shadow:none}
.ill .c2{rotate:-3deg}.ill .c3{rotate:2deg;display:flex;flex-direction:column;gap:11px}
.ill .r{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.ill .c1 > .r:first-child{font-size:14px}.ill .c1 > .r:first-child em{font-size:21px;font-style:normal;color:var(--green)}
.ill .fb{height:6px;border-radius:6px;background:var(--line)}.ill .fb i{display:block;height:100%;width:62%;border-radius:6px;background:var(--green)}
.ill .ls{display:flex;flex-direction:column;gap:8px}
.ill .ls .r{font-size:13px;font-weight:400}.ill .ls .r small{font-size:13px;color:var(--mute)}.ill .ls .r em{font-style:normal;font-size:15px;font-weight:700;color:var(--green)}.ill .ls .r em.n{color:var(--red)}
.ill .h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}.ill .h > span:not(.cal){flex:1}.ill .h em,.ill .c3 em{font-style:normal;color:var(--yellow)}
.ill .cal{flex:none;width:34px;height:34px;border-radius:9.5px;background:rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:15px;font-weight:700}
.ill .cal small{font-size:7.5px;line-height:9px;color:var(--yellow)}
.ill .inp{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.3);border-radius:23px;padding:9.5px 19px;font-weight:700}
.ill .inp b{display:flex;flex-direction:column;font-size:13px;line-height:17px}.ill .inp small{font-size:11px;line-height:15px;color:var(--yellow)}
.ill .inp em{font-size:17px}.ill .c3 > .r{padding:0 7.5px;font-size:13px}.ill .c3 > .r em{font-size:15px}
.hello{display:flex;flex-direction:column;gap:24px;text-align:center}
.hello h1{font-size:min(22px,5.7vw);line-height:28px;white-space:nowrap;font-weight:700;color:var(--yellow)}
.hello h2{font-size:min(18px,4.5vw);line-height:24px;white-space:nowrap;font-weight:600;margin-top:-20px}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.steps span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:min(13px,3.4vw);line-height:16px;font-weight:700;color:rgba(255,255,255,.5);white-space:nowrap}
.steps span b{font-size:18px;line-height:22px;color:var(--yellow)}
.steps svg{width:5px;height:38px;color:rgba(255,255,255,.2)}
@media (max-height:760px){.home0{gap:12px}.welcome{gap:16px}.ill{padding-top:0}.hello{gap:16px}.hello h2{margin-top:-14px}.steps svg{height:32px}}

/* form */
.uline{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;font-size:24px;font-weight:500;padding:12px 0 16px;caret-color:var(--yellow)}
.uline::placeholder{color:var(--faint)}
.uline:focus{border-bottom-color:var(--paper)}
.lbl{font-size:14px;font-weight:700;color:var(--mute)}
.mcard .lbl:last-child{margin-bottom:4px}
.av{flex:none;width:50px;height:50px;border-radius:50%;background:var(--deep);color:#3a3a3a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av svg{width:26px;height:26px}
.av.emo{background:var(--paper);font-size:28px;line-height:1}
.av.big{width:80px;height:80px;background:var(--card);color:#8e8e8e}
.av.big svg{width:38px;height:38px}
.av.big.emo{background:var(--paper);font-size:44px}
.avpick{position:relative;align-self:center;margin-top:-4px}
.avpen{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.avpen svg{width:18px;height:18px}
.uline.gname{text-align:center;font-size:24px;line-height:31px;font-weight:700;height:31px;padding:0;box-sizing:border-box;border-bottom:0}
.uline.gname::placeholder{color:#3e3e3e}
.uline.gname:focus{border-bottom-color:transparent}
.mcard{background:var(--card);border-radius:32px;padding:12px;display:flex;flex-direction:column;gap:12px}
.mcard > .lbl,.mcard > .chips{margin:0 4px}
.mcard > .lbl{color:rgba(255,255,255,.5)}
.mcard .lbl,.fcard .lbl{font-size:14px;line-height:18px;font-weight:500}
.mrow{display:flex;align-items:flex-start;gap:8px;height:52px}
.mline{flex:1;min-width:0;height:50px;box-sizing:border-box;background:rgba(0,0,0,.3);border:0;border-radius:24px;outline:0;font-size:16px;line-height:20px;font-weight:700;padding:0 10px 0 16px;caret-color:var(--yellow)}
.mline::placeholder{color:#484848;font-weight:500}
.yadd{width:50px;height:50px;background:var(--paper);color:var(--ink)}
.yadd svg{width:28px;height:28px}
.mcard .chip{background:var(--chip);height:40px;font-size:16px;gap:8px;padding:0 12px 0 16px}
.mcard .chip .x{width:20px;height:20px;color:#484848;margin:0}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.emogrid .ico{aspect-ratio:1;border-radius:50%;background:var(--chip);color:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .2s}
.emogrid .ico svg{width:55%;height:55%}
.emogrid .ico.on{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.emogrid.v2 .ico.on{background:#3a3a3c;color:#fff;box-shadow:inset 0 0 0 3px #fff}
.sw.def.on{box-shadow:inset 0 0 0 3px var(--paper)}
.sheet .sp.av2{padding-top:33px;gap:16px}.sp.av2::before{top:12px}.sp.av2 h3{margin:0;line-height:26px}.sp.av2 .emogrid{grid-template-columns:repeat(6,48px);justify-content:space-between}.sp.av2 .swrow{padding:0}.sp.av2 .sw.on{box-shadow:inset 0 0 0 3px #fff}.sp.av2 .acts{margin-top:0}
.swrow{display:flex;justify-content:space-between;padding:8px 4px 4px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--sheet),0 0 0 0 var(--paper);transition:box-shadow .2s}
.sw.on{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--paper)}
.av.ic{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c)}
.av.big.ic svg{width:44px;height:44px}
/* menu trái */
.drw{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - 195px));width:min(390px,100%);z-index:30;overflow:hidden}   /* mọi thứ nằm trong khung 390 */
.drw .db{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s var(--ease)}
.drw .dp{position:absolute;top:0;bottom:0;left:0;width:300px;background:var(--ink);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px) / var(--z,1)) 24px 0;box-sizing:border-box;transform:translateX(-100%);transition:transform .25s var(--ease)}
body.drwon .drw .db{opacity:1}body.drwon .drw .dp{transform:none}
#app,.bar{transition:transform .25s var(--ease)}
body.drwon #app,body.drwon .bar{transform:translateX(300px)}
/* phần trang bị đẩy sang chỉ lộ trong khung 390, không tràn ra ngoài */
body.drwon #app{clip-path:inset(-60px calc(100% - 66px) -4000px -30px)}
body.drwon .bar{clip-path:inset(0 calc(50% + 105px) 0 max(0px,calc(50% - 495px)))}
body.drwon{user-select:none;-webkit-user-select:none}
html:has(body.drwon),body.drwon{overflow:hidden}
.dlogo{height:45px;display:flex;align-items:center}.dlogo .wm{width:152px;height:30.4px}
.dlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;margin-top:24px;padding-bottom:16px}
.ditem{display:flex;align-items:center;gap:12px;min-height:32px;font-size:16px;line-height:23px;font-weight:600;color:var(--paper)}
.ditem span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.av.sm{width:32px;height:32px}.av.sm svg{width:16px;height:16px}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.dme{width:50px;height:50px}.av.me{width:50px;height:50px}.av.me:not(.ic){background:var(--card);color:var(--paper)}.av.me svg{width:24px;height:24px}
.btn.dnew{flex:none;width:162px}
.flow .fln{flex-basis:100%;font-size:13px;line-height:18px;color:var(--mute);font-weight:500;white-space:normal;overflow-wrap:anywhere}   /* ghi chú: dòng riêng, không cắt chữ sớm */
.exp .flow + .calc{margin-top:-10px}   /* dòng dưới ô nhập tiền cách 6px */
.btn.lockby{background:#3a3a3a;color:#8a8a8a;gap:8px;cursor:default}.btn.lockby svg{width:18px;height:18px}
.ghead.gh h1{font-size:20px;line-height:26px;text-align:left}
.pill2{display:flex;flex:none;height:52px;border-radius:100px;background:var(--card)}   /* Lịch sử hoạt động + Chỉnh sửa: chung một khung */
.pill2 button{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:100px;color:var(--paper)}
.pill2 button:active{opacity:.6}.pill2 svg,.ghead.gh #gMenu svg{width:24px;height:24px}   /* 3 icon ở đầu trang nhóm: menu, lịch sử, chỉnh sửa */   /* tên nhóm cùng cỡ chữ "Tổng kết" */
.fcard.ro .flist{pointer-events:none}   /* quỹ chỉ người tạo nhóm sửa; người khác vẫn mở ra xem được */
.uline.gname[readonly]{caret-color:transparent}
.fv .avpick{margin:0 auto}.fv .av.big:not(.ic){background:#3e3e3e}   /* trang tạo nhóm (Figma 421:1130): avatar #3e3e3e, tên nhóm 24px, nút ✓ vàng ở thanh trên */
.gbyf{text-align:center;font-size:14px;line-height:18px;font-weight:500;color:var(--mute);margin-top:-14px}   /* "Tạo bởi …" dưới tên nhóm ở trang chỉnh sửa */
/* Tiêu đề Tổng kết luôn dính ngay dưới thanh trạng thái (POD 18/11: iPhone mở Tổng kết bị mất tiêu đề): dù trang bị cuộn lệch bao nhiêu tiêu đề vẫn thấy */
.sumv .shead{position:sticky;top:calc(env(safe-area-inset-top,0px) / var(--z,1));z-index:11;background:var(--ink);box-shadow:0 8px 0 var(--ink)}
[data-shotroot] .shead{position:static;box-shadow:none}
.shead .ttl3{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}   /* Tổng kết ↔ tên nhóm 4px */
.shead .ttl3 .r1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shead .ttl3 h1{text-align:left;font-size:20px;line-height:26px;flex:none}.shead .ttl3 .sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* tên nhóm một dòng, dài thì … */
.shead .wm{width:115px;height:23px;flex:none;position:relative;top:3px}   /* chân chữ logo ngang chân chữ "Tổng kết" (đo: logo cao hơn khoảng 3px) */
#acAvBtn .av:not(.ic){color:var(--paper)}
.aname{display:flex;flex-direction:column;align-items:center;gap:0}
/* trang đặt tên lần đầu (Figma 331-619): đầu trang chừa 52px như header, avatar cách 45px, nút nổi sát trên bàn phím */
.onrow{display:flex;align-items:center;justify-content:center;gap:6px;height:50px}.onrow .at{font:700 24px/31px var(--font);color:var(--paper)}
.oname{width:200px;max-width:100%;height:50px;box-sizing:border-box;background:none;border:0;outline:0;padding:9.5px 0;text-align:left;font:700 24px/31px var(--font);color:var(--paper);caret-color:var(--yellow)}   /* cao 50px như ô tên nhóm: chữ nằm đúng chỗ */
.oname::placeholder{color:rgba(255,255,255,.3)}
.aname2{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:66px}.ohandle:empty{visibility:hidden}.onb .ohandle{height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;word-break:normal}.onb .onrow{margin-top:12px;height:31px}.onb .oname{height:31px;padding:0}.onb .avpick{margin:0 auto}.onb .lhead{margin-bottom:8px;justify-content:center;height:44px}
.btn.onbbtn{flex:none;width:100%;height:50px;margin-top:8px;font-size:18px}
.ohandle{margin-top:0;min-height:20px;text-align:center;font-size:14px;line-height:20px;font-weight:500;color:rgba(255,255,255,.3);word-break:break-all}.ohandle.taken{color:var(--red)}
#onbGo{font-size:18px}#onbGo.off{opacity:.2}
html:has(.onb),html:has(.onb) body{overflow:hidden}
/* trang đặt tên + tài khoản (body.kbbar): thanh nút luôn hiện, trên điện thoại nổi sát trên bàn phím (--kb), máy tính thì nằm đáy.
   trang tạo/sửa nhóm (body.barshow): thanh nút luôn hiện nhưng cố định ở cuối trang, không nổi theo bàn phím */
body.kbbar .bar{transform:translateY(calc(-1 * var(--kb,0px)))}
@media (pointer:coarse){body.kbbar.kb .bar{padding-bottom:12px}body.kbbar.kb .app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px) + var(--kbpad,0px))}}
.ahd{display:flex;align-items:center;gap:8px;height:44px;margin:-8px 0 0}.ahd h1{flex:1;min-width:0;font-size:20px;line-height:26px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ahd .c44{flex:none}.ahd .okb{background:var(--yellow);color:#000}.ahd .okb svg{width:24px;height:24px}.acv .ohandle{font-size:16px;color:#484848}.onb.acv .oname{height:31px;padding:0}
.ahandle{font-size:16px;line-height:22px;font-weight:600;color:#4a4a4a;margin-top:-6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#atHint:empty{display:none}
/* gợi ý @ và chip thành viên có tài khoản: avatar tròn 28 + tên (+ vàng / ×) */
.athint{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 6px;border-radius:100px;background:rgba(255,255,255,.1);font-size:16px;font-weight:700;color:var(--paper);max-width:100%}
.athint span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.athint > svg{width:22px;height:22px;color:var(--yellow)}
.av.cav{width:28px;height:28px;flex:none}.av.cav svg{width:14px;height:14px}.av.cav:not(.ic){background:#3e3e3e;color:var(--paper)}
.mcard .chip.lk{padding-left:6px}
.chip.fixm{padding-right:16px}   /* thành viên không bỏ ra được (người tạo nhóm, người đã có trong nhóm): không có nút ✕ nên chừa lề phải đều như lề trái */
.athint.none{display:block;height:auto;padding:0;border-radius:0;background:none;font-size:15px;line-height:20px;font-weight:500;color:var(--mute)}   /* không tìm thấy: chữ xám, không có nền chip */

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:100px;background:var(--card);font-size:15px;font-weight:700;white-space:nowrap;flex:none;transition:background .15s,color .15s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.exp .chip{height:28px}
.chip.sel{background:var(--paper);color:var(--ink)}
.chip.dark{background:var(--chip)}
.fstack{display:flex;flex-direction:column;gap:12px}
.fcard{background:var(--card);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fhead{display:flex;align-items:center;gap:12px;width:100%;font-size:18px;line-height:23px;font-weight:700;text-align:left}
.fhead span{flex:1}
.fhead .fcar{width:20px;height:20px;flex:none;color:rgba(255,255,255,.5);transform:rotate(180deg);transition:transform .2s}.fcard.open .fhead .fcar{transform:none}
/* card Tạo quỹ chung (Figma 262-1921): từng người góp → khoản góp ngoài quỹ → Tổng quỹ ở cuối */
.flist{display:flex;flex-direction:column}
.frow{display:flex;align-items:center;gap:8px;height:52px;box-sizing:border-box;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.flist > .frow:first-child{border-top:0}
.ftot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:2px solid rgba(255,255,255,.1);font-weight:700}
.ftot span{font-size:16px;line-height:20px;color:var(--paper)}   /* "Tổng quỹ" cùng cỡ 16px với "Khoản góp ngoài quỹ", vẫn trắng */
.ftot b{font-size:24px;line-height:31px;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.frow .sbtn{width:28px;height:28px;margin-right:0}.frow .sbtn svg{width:20px;height:20px}
.frow .sbtn.add{background:#3e3e3e;color:var(--paper)}.frow .sbtn.del{background:rgba(255,56,60,.16);color:var(--red)}
.frow .bname{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;font-size:16px;line-height:20px;font-weight:700;color:#edecea;caret-color:var(--yellow);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.frow .bname::placeholder{color:#484848;text-overflow:ellipsis}#sNewName::placeholder{color:rgba(255,255,255,.5)}   /* dòng thêm mới: chữ xám; khoản đã thêm chưa đặt tên: chữ tối hơn */
.frow .bname + input{margin-left:0}
.frow .gq{font-weight:400;color:rgba(255,255,255,.5)}
.frow input:not(.bname){width:7.5em;min-width:0;flex:0 0 auto;max-width:60%}
.frow b{flex:1;min-width:0;font-size:16px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow input{width:50%;background:none;border:0;outline:0;padding:0;text-align:right;font:inherit;font-size:18px;line-height:20px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;caret-color:var(--paper)}
/* Design chốt 18/11 (Figma 351:757): dòng góp = avatar 28 + tên + số tiền; chưa nhập hiện "Nhập số tiền" xám, có số thì xanh lá 18px đậm; tổng quỹ xanh lá 24px */
.rav{flex:none;width:28px;height:28px;border-radius:50%;background:#3e3e3e;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5)}.rav svg{width:16px;height:16px}
.frow input:not(.bname),.flow.topf input{color:var(--green);cursor:text}
.frow input:not(.bname)::placeholder,.flow.topf input::placeholder{color:rgba(255,255,255,.3);font-weight:500;font-size:16px;opacity:1}
.tcard .scroll .chip{height:28px;padding:0 16px}
.fund{background:var(--card);border-radius:32px;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.fund .top{display:flex;align-items:center;gap:0;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.fund .top small{flex:1;min-width:0;font-size:18px;line-height:23px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* theo Figma 348:1793: tiêu đề 18px, số tiền 24px */
.fund .top b{font-size:24px;line-height:31px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.fund .fcar{width:20px;height:20px;flex:none;margin-left:4px;color:var(--green);transform:rotate(180deg)}
.fund.open .fcar{transform:none}
.fund .fls{display:flex;flex-direction:column;gap:6px;margin-top:-6px}   /* tiêu đề ↔ các dòng 6px */
.fund .fl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:18px;font-weight:500;color:rgba(255,255,255,.5)}
.fund .fl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fund .fl span b{font-weight:500;color:inherit}.fund .fl span em{font-style:normal;font-weight:400}   /* Góp quỹ / Góp thêm / Đã chi: cả dòng chữ xám như Figma */
.fund .fl > b{font-size:14px;line-height:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fund .fks{display:flex;flex-direction:column;gap:6px}
.fund .fk{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:18px;font-weight:500;color:#fff}.fund .fk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fund .fk b{font-weight:700;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}.fund .fk b.neg{color:var(--red)}   /* món trong kho (Figma 348:1793): tên 14px medium trắng, còn/tổng 14px đậm trắng (Figma 331:892); dùng quá thì số đỏ */
.fund .fl > b.pos{color:var(--green)}.fund .fl > b.neg{color:var(--red)}
.fund .top b.neg,.fund.neg .fcar{color:var(--red)}
.fbar{height:6px;border-radius:6px;background:var(--card);overflow:hidden}.fund .fbar{background:rgba(255,255,255,.1)}
.fbar i{display:block;height:100%;border-radius:6px;background:var(--yellow)}
.ghead .sub{display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--paper)}
.chip .x{width:18px;height:18px;color:var(--mute);margin-right:-4px}
.scroll{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:-3px -16px;padding:3px 16px}
.scroll::-webkit-scrollbar{display:none}
/* Máy tính dùng chuột (hover + pointer fine): danh sách chip thu về một dòng, có nút mũi tên xem tất cả / thu gọn (Figma 338:1461). Điện thoại / máy tính bảng giữ vuốt ngang. */
.rtg{display:none!important}
.desk .rowf{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.desk .rowf [hidden]{display:none!important}
.desk .rowf .rtg:not([hidden]){display:inline-flex!important;width:40px;padding:0;justify-content:center;background:rgba(255,255,255,.1);color:#fff}
.rtg svg{width:20px;height:20px;transform:rotate(180deg)}.rtg.open svg{transform:none}
html,body{scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x pan-y}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
*{scrollbar-width:none}

/* expense card */
.exp{background:var(--card);border-radius:32px;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease)}
.exp.press,.scard.press{transform:scale(.98)}
.sumv .stack > :is(.fund,.txcard){transition:transform .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.exp .eh{display:flex;align-items:center;gap:10px;height:36px}
.cal{position:relative;flex:none;width:36px;height:36px;border-radius:10px;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.cal b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cal span{font-size:10px;font-weight:700;color:var(--yellow);margin-top:3px;letter-spacing:.02em}
.cal,.cal input,.cal input::-webkit-calendar-picker-indicator{cursor:pointer}
.cal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none}
.exp .eh .ename{flex:1;min-width:0;height:36px;display:block;line-height:36px;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:0}
.exp .eh .ename.ph{color:var(--faint)}
.exp .fold{flex:none;width:36px;height:36px;margin-right:-8px;display:flex;align-items:center;justify-content:center;background:none;color:var(--paper)}
.exp .fold svg{width:18px;height:18px;transition:transform .2s}
.exp .fold[aria-expanded="false"] svg{transform:rotate(180deg)}
.exp .ftot2{flex:none;font-size:19px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}   /* tổng khoản chi khi thu gọn: tiền chi ra → đỏ */
.exp .eh input.nm{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;height:36px;box-sizing:border-box;font-size:19px;font-weight:700;padding:0;caret-color:var(--yellow);user-select:text;-webkit-user-select:text}
.exp .eh input::placeholder{color:var(--faint);font-weight:700}   /* placeholder "Nhập tên khoản chi": đậm 700 cả lúc chưa bấm (.ename.ph) lẫn lúc đang nhập */
.exp hr{border:0;border-top:1px solid var(--line);margin:0 0}
.exp .sub{font-size:14px;line-height:18px;font-weight:500;color:var(--mute);margin:0 0 -8px}
.exp .sub+.scroll+.flow{margin-top:-4px}
.flow.topf .role,.flow.topf .fnote2{color:var(--green)}
/* card Góp thêm quỹ (.tcard): danh sách phẳng như mục Góp quỹ chung: dòng cao 52px, vạch mảnh; dòng đầu liền sát chips nên chữ cách chips đúng 16px */
.tcard .tfl{display:flex;flex-direction:column;margin-top:-6px}.tcard .tfl:empty{display:none}.tcard .tfl > .flow.topf:last-child{padding-bottom:0;height:40px}   /* chưa chọn ai thì ẩn hẳn khối dòng (khỏi thừa khoảng trống ở đáy card); dòng cuối không đệm dưới (Figma 351:757) */
.tcard .flow.topf{flex-wrap:nowrap;gap:8px;background:none;border-radius:0;min-height:0;height:52px;padding:12px 0;margin:0;border-top:1px solid rgba(255,255,255,.06)}
.tcard .tfl > .flow.topf:first-child{border-top:0}
.tcard .flow.topf .who{flex:1;max-width:none}
.tcard .flow.topf .who b{font-size:16px;line-height:20px;font-weight:700;color:var(--paper)}
.tcard .flow.topf input{flex:0 0 auto;width:7.5em;max-width:60%;font-size:18px;line-height:20px}
.tcard .ftot2{color:var(--green)}   /* tổng khi thu gọn: cùng cỡ 19px với tổng card khoản chi (POD chốt 18/11) */
.flow+.flow{margin-top:-8px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;background:var(--deep);border-radius:24px;padding:10px 16px;min-height:56px;box-sizing:border-box}
.flow .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:none;max-width:45%}
.flow .who b{font-size:15px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .role{display:inline-flex;align-items:center;gap:0;font-size:14px;line-height:18px;height:18px;font-weight:400;color:var(--green);user-select:none}   /* ứng tiền: được cộng → xanh */
.flow .role svg{width:12px;height:12px;flex:none;margin-left:2px}
.flow.donate .role{color:var(--cyan)}.flow.fixed .role{color:var(--pink)}
.flow input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-size:22px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;padding:0;caret-color:var(--paper);user-select:text;-webkit-user-select:text}
.flow input::placeholder{color:var(--green)}
.flow.donate input{color:var(--cyan)}.flow.donate input::placeholder{color:var(--cyan)}
.flow.fixed input{color:var(--pink)}.flow.fixed input::placeholder{color:var(--pink)}   /* đóng cố định → hồng (POD chốt 18/11); rút quỹ vẫn đỏ */
.calc{display:flex;flex-direction:column;gap:8px;padding:0 16px;font-size:14px;line-height:18px}
.calc:empty{display:none}
.calc .r{display:flex;justify-content:space-between;gap:12px}
.calc .r span{color:var(--mute);font-weight:500}
.calc .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.calc .warn{color:var(--yellow);font-size:13px;font-weight:500}
.calc .share{margin:0;color:var(--mute);font-size:14px;line-height:20px;font-weight:400}
.flow.usew{flex-wrap:nowrap;justify-content:space-between;min-height:56px;padding:10px 10px 10px 16px}
.flow.usew .who b{font-size:14px}.flow.usew .who .fnote2{font-size:12px;color:var(--red);font-weight:700}   /* tiền dùng dưới tên đồ: đỏ 12px đậm (Figma 338:1565) */
.flow.usew .step{gap:20px}.flow.usew .step b{min-width:1.2em}
.chip.off,.chip.off.dark{background:#232323;color:#5c5c5c;cursor:not-allowed}.chip.off .cnt{color:#4a4a4a}   /* khoá: người ứng tiền ↔ kho đồ */
.exp.kcard{gap:8px}
.flow.krow{flex-wrap:nowrap;justify-content:space-between;min-height:48px;border-radius:24px}
.flow.krow .who b,.flow.krow .who b .gq{font-size:14px;color:var(--mute);font-weight:700}   /* "coong ứng tiền" / "Rút quỹ": cả dòng chữ xám */.flow.krow .amt{font-size:18px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.krows{display:flex;flex-direction:column;gap:6px}
.krow{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;box-sizing:border-box;padding:0 16px;border-radius:24px;background:var(--deep)}
.krow:has(.step){padding-right:10px}
.krow > span:first-child{flex:none;font-size:14px;font-weight:500;color:var(--mute)}
.krow input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;text-align:right;font:inherit;font-size:18px;line-height:23px;font-weight:700;color:var(--paper);font-variant-numeric:tabular-nums;caret-color:var(--paper)}
.krow input::placeholder{color:var(--paper);opacity:1}
.krow input#itCost{color:var(--red)}.krow input#itCost::placeholder{color:var(--red)}   /* giá tiền: tiền chi ra → đỏ */
.krow input.knm{color:#fff;font-size:18px}.krow input.knm::placeholder{color:rgba(255,255,255,.3)}
.krow .step{gap:20px}.krow .step input{flex:none;width:2.4em;text-align:center}
.sheet .klab{font-size:14px;line-height:18px;margin-bottom:-4px}   /* nhãn → chips: 12px */
.kpay .chip{height:32px;padding:0 16px;font-size:16px}
.step{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.step b{min-width:2.6em;text-align:center;font-size:18px;line-height:22px;font-weight:700;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.stb{flex:none;width:32px;height:32px;border-radius:32px;background:rgba(255,255,255,.1);color:var(--paper);display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s}.stb svg{width:20px;height:20px}.stb:active{transform:scale(.9)}.stb:disabled{opacity:.4;pointer-events:none}


/* summary */
.stack{display:flex;flex-direction:column;gap:12px}
.tblw{background:var(--card);border-radius:32px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.tblw::-webkit-scrollbar{display:none}
.tbl{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{box-sizing:border-box;width:72px;min-width:72px;max-width:72px;padding:12px 4px;text-align:center;white-space:nowrap;font-size:14px;line-height:20px;font-weight:700;border-bottom:1px solid var(--line)}
.tbl th{font-size:14px;color:rgba(255,255,255,.5);padding-top:16px}.tbl th span{display:block;overflow:hidden;text-overflow:ellipsis}
.tbl tr > :first-child{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;width:108px;min-width:108px;max-width:108px;padding-left:20px;box-shadow:1px 0 0 rgba(255,255,255,.08)}
.tbl td:first-child{font-size:15px;white-space:normal;vertical-align:middle}.tbl .rl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:60px;word-break:break-word;line-height:20px}
.tbl small.ta{font-size:14px;line-height:18px;font-weight:700;color:var(--yellow)}.tbl small.ta .td{display:inline-block;margin-left:4px;font-size:10px;line-height:14px;font-weight:500;color:rgba(255,255,255,.5);white-space:nowrap}   /* ngày xám nhỏ hơn 2 cỡ (12px); không vừa dòng thì cả cụm ' • 18/11' xuống dòng dưới */
.tbl small{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--mute)}.tbl .c-g{color:var(--green)}.tbl .c-r{color:var(--red)}.tbl .c-p{color:var(--pink)}.tbl .c-m{color:rgba(255,255,255,.25)}
.tbl thead tr > :first-child{border-top-left-radius:32px}.tbl tr.fin > :first-child{border-bottom-left-radius:32px;background:#2e2e2e}
.tbl tr.sum td{border-top:1px solid rgba(255,255,255,.25)}
.tbl tr.fin td{border-bottom:0;padding-top:14px;padding-bottom:16px;background:#2e2e2e}.tbl tr.fin > :last-child{border-bottom-right-radius:32px}
.flow.fundw .who b{color:var(--mute)}   /* nhãn Rút quỹ / A góp thêm: chữ xám */
.flow.fundw input{color:var(--red)}.flow.idle input{color:rgba(255,56,60,.35)}
.flow.fundw input::placeholder{color:var(--red)}
.cmp{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center}
.cmp .cb{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.cmp .cmpc{position:relative;box-sizing:border-box;width:calc(100% - 32px);max-width:342px;margin-bottom:12px;box-shadow:0 -8px 40px rgba(0,0,0,.6);transform:translateY(calc(-1 * var(--kb,0px)));transition:transform .28s cubic-bezier(.22,1,.36,1);animation:cmpin .32s cubic-bezier(.22,1,.36,1)}
@keyframes cmpin{from{opacity:0;translate:0 24px}}
.cmp .ampc{flex-direction:row;align-items:center;gap:12px;padding:12px}
.cmp .ampc .flow{flex:1;min-width:0;margin:0}
@media (prefers-reduced-motion:reduce){.cmp .cmpc{transition:none;animation:none}}
.bar:has(#bar:empty){display:none}
@media (pointer:coarse){body.kb:not(.kbbar):not(.barshow) .bar{display:none}}   /* các trang còn lại (nhóm, tổng kết…): bàn phím mở thì ẩn thanh nút cho đỡ che */
.pos{color:var(--green)}.neg{color:var(--red)}
.linkbox{width:100%;box-sizing:border-box;height:48px;border-radius:100px;border:0;background:#000;color:var(--yellow);font:700 14px var(--font);padding:0 18px;outline:0}
.note{background:var(--card);border-radius:28px;padding:28px 20px;text-align:center;color:var(--mute);font-weight:500;font-size:15px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:40px max(24px,env(safe-area-inset-right,0px)) max(16px,calc(env(safe-area-inset-bottom,0px) / var(--z,1) - 10px)) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,0),var(--ink) 32px);pointer-events:none}
.bar .in{pointer-events:auto}
.bar .btn.danger{background:#3d0f10}
.bar .in{max-width:342px;margin:0 auto;display:flex;gap:16px;position:relative;align-items:center}
.fab{flex:none;width:52px;height:52px;border-radius:52px;background:var(--yellow);color:#1c1c1c;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease)}
.fab svg{width:32px;height:32px}.fab:active{transform:scale(.92)}
.fabmenu{position:absolute;left:-4.5px;bottom:calc(100% + 10px);background:#3e3e3e;border-radius:32px;padding:8px;gap:0;display:flex;flex-direction:column;transform-origin:left bottom;animation:fabIn .18s var(--ease)}
.fabmenu[hidden]{display:none}
.fabmenu button{display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border-radius:32px;font-size:16px;font-weight:700;color:#fff;text-align:left;white-space:nowrap}
.fabmenu button:active{background:rgba(255,255,255,.08)}
.fabmenu svg{width:24px;height:24px;flex:none}.fabmenu #addItem svg{width:28px;height:28px}   /* icon Kho đồ trong Figma to 28px */
@keyframes fabIn{from{opacity:0;transform:scale(.9) translateY(8px)}}

.asheet .rok{background:var(--yellow);color:#000}.asheet .rok[disabled]{opacity:1;background:rgba(255,204,0,.2);color:rgba(0,0,0,.55)}
.xcards{display:flex;flex-direction:column;gap:12px}
.xc{background:var(--deep);border-radius:27px;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.xt{display:flex;align-items:center;gap:12px}
.xbd{position:relative;flex:none;width:40px;height:40px;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.xbd b{font-size:16px;font-weight:700;color:#fff}.xbd span{font-size:9px;font-weight:700;color:var(--yellow);text-transform:uppercase}
.xbd input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.xnm{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;font:inherit;font-size:18px;font-weight:700;color:#fff;height:24px}.xnm::placeholder{color:rgba(255,255,255,.3)}
.xr{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.xr::-webkit-scrollbar{display:none}
.xc .chip{height:32px;padding:0 12px;font-size:15px}.xc .chip small{font-size:12.75px;font-weight:500;color:#8a8a8a;margin-left:2px}
.xc .chip.dark{background:var(--chip);color:#fff}
.xc2{gap:24px}.xs{display:flex;flex-direction:column;gap:8px}
.xl{font-size:14px;line-height:18px;font-weight:500;color:rgba(255,255,255,.5);margin:0}
.xrows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.xrow{display:flex;align-items:center;gap:8px;height:52px;box-sizing:border-box;padding:10px 20px;border-radius:19px;background:var(--card)}
.xrow.xuse{padding-right:10px}
.xtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.xrow > b,.xtx b{font-size:14px;line-height:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xrow.xfund > b{flex:1}
.xrl{display:flex;align-items:center;gap:0;font-size:12px;line-height:14px;font-weight:500;text-align:left}.xrl svg{width:10px;height:10px;margin-left:0}
.xtx small{font-size:12px;line-height:14px;font-weight:500;color:var(--red)}
.xamt{flex:none;width:44%;min-width:0;background:none;border:0;outline:0;padding:0;text-align:right;font:inherit;font-size:20px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums}
.xamt::placeholder{color:rgba(255,255,255,.3);font-weight:500}
.xamt.neg{color:var(--red)}.xamt.pos{color:var(--green)}.xamt.fix{color:#ff2d92}
.xstep{display:flex;align-items:center;gap:20px;height:32px}.xstep b{min-width:21.6px;text-align:center;font-size:20px;line-height:24px;font-weight:700;color:#fff}
.xstep .stb[disabled]{opacity:.3}
.xcalc{padding:0 16px}.xcalc p{font-size:14px;line-height:18px;font-weight:400;color:var(--mute);margin:0}.xcalc .warn{color:var(--red)}
.xc3{gap:4px}
.xfl{display:flex;flex-direction:column}
.xfr{display:flex;align-items:center;gap:8px;height:52px;box-sizing:border-box;padding:12px 0}.xfr.tp{border-top:1px solid rgba(255,255,255,.06)}
.xrav{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}.xrav svg{width:16px;height:16px}
.xrav.xplus,.xrav.xminus{border:0;color:#fff}.xrav.xplus svg,.xrav.xminus svg{width:20px;height:20px}.xrav.xminus{background:rgba(255,56,60,.16);color:var(--red)}
.xn{flex:1;min-width:0;font-size:16px;line-height:20px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xnin{background:none;border:0;outline:0;padding:0;font-family:inherit}.xnin::placeholder{color:rgba(255,255,255,.3)}
.xamt.t{width:40%;font-size:18px;line-height:22px}.xamt.t::placeholder{font-size:16px}
.xtot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-top:0}.xtot b{font-size:16px;color:#fff}.xtot b:last-child{font-size:20px;color:var(--green)}
.xdel{display:block;margin:20px auto 0;font-size:16px;font-weight:700;color:var(--red);padding:8px 16px}
</style>

<script>
(() => {
/* ================= storage & model =================
   group   = { id, name, avatar, by, at, members:[{ id, name, uid?, handle?, avatar? }], exps:[expense], fund?, sid?, bill? }
   expense = { id, at, name, by, parts:[memberId], flows:[{ id: memberId | FUND, role: 'pay'|'donate'|'fixed', amt, note? }] }
   - Ứng tiền (pay): trả trước số tiền đó và vẫn chia đều như mọi người.
   - Tài trợ (donate, chỉ còn ở dữ liệu cũ) / Đóng cố định (fixed): chỉ chịu đúng số đó, không chia đều.
   Tổng chi = tổng tiền ứng. Phần còn lại sau khi trừ tài trợ + cố định chia đều cho những người tham gia còn lại.
   Mỗi đường link ngắn (coongno.web.app/1, /abc…) là một quỹ độc lập, công khai: ai mở link cũng xem được. */
const PATH = (() => { try { return decodeURIComponent(location.pathname); } catch(e) { return ''; } })().normalize('NFC');
const SLUG = ((PATH.match(/^\/((?:new-user\/\d{1,12})|[\p{L}\p{N}_-]{1,40})\/?$/u) || [])[1] || '').toLowerCase().replace(/^s$/, '');
/* Link bill chỉ-xem: /<quỹ>/bill/<tên-nhóm>, /s/<mã>/bill/<tên-nhóm>, /new-user/<số>/bill/<tên-nhóm> — chỉ hiện trang Tổng kết, không ghi gì xuống máy hay lên máy chủ. */
const BILLM = PATH.match(/^\/(?:s\/([A-Za-z0-9]{20,40})|(new-user\/\d{1,12})|([\p{L}\p{N}_-]{1,40}))\/bill\/([a-z0-9-]{1,60})\/?$/u);
const BILLN = PATH.match(/^\/bills\/(\d{4,12})\/?$/);   // link bill mới: /bills/<số ngẫu nhiên>
const BILL = BILLN ? { bid: BILLN[1], st: 'load' } : BILLM ? { code: BILLM[1] || null, owner: (BILLM[2] || BILLM[3] || '').toLowerCase(), g: BILLM[4], st: 'load' } : null;
const KEY = BILL ? 'coong_bill_view' : SLUG ? 'coong_calc_v4_' + SLUG : 'coong_calc_v4';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
/* Mốc reset: đổi EPOCH (và xoá collection books trên Firestore) thì mọi máy mở bản mới sẽ xoá sạch dữ liệu của app trên máy đó đúng một lần.
   Không có bước này, máy cũ còn dữ liệu sẽ đẩy ngược dữ liệu cũ lên máy chủ vừa được xoá. */
const EPOCH = 'launch-2026-11';
try { if (localStorage.getItem('coong_epoch') !== EPOCH) { Object.keys(localStorage).filter(k => k.startsWith('coong_')).forEach(k => localStorage.removeItem(k)); localStorage.setItem('coong_epoch', EPOCH); } } catch(e) {}
let uid = 1;
const mem = n => ({ id: uid++, name: n });
/* bring over cuộc vui from the previous version once */
function fromV3(old = store.get('coong_calc_v3')){
  if (!old || !Array.isArray(old.events)) return null;
  return old.events.filter(e => !e.sample && e.members?.length).map(e => {
    const exps = (e.stages || []).filter(s => Number(s.total) > 0).map(s => {
      const pays = (s.payers || []).filter(x => e.members.some(m => m.id === x.id));
      return { id: s.id, name: s.name || '', parts: (s.parts || []).slice(),
        flows: pays.map(x => ({ id: x.id, role: 'pay', amt: pays.length === 1 ? Number(s.total) : Number(x.amt) || 0 })) };
    });
    e.members.forEach(m => {               // old per-outing donate / fixed → first expense they joined
      const amt = m.role === 'donate' ? m.donate : m.role === 'custom' ? m.amount : 0;
      const ex = amt && exps.find(x => x.parts.includes(m.id));
      if (ex && !ex.flows.some(f => f.id === m.id)) ex.flows.push({ id: m.id, role: m.role === 'donate' ? 'donate' : 'fixed', amt });
    });
    return { id: e.id, name: e.name || 'Cuộc vui', members: e.members.map(m => ({ id: m.id, name: m.name })), exps, round: e.round !== false, done: {} };
  });
}
/* ================= cloud sync =================
   iPhone keeps a home-screen app's storage separate from Safari's, so localStorage alone looks like a "reset".
   Each person gets a private sổ (book) code in the URL (/s/CODE); data lives in Firestore under that code

  const app = () => $('#app'), bar = () => $('.bar'), drw = () => $('#drw'), dp = () => $('#drw .dp'), db = () => $('#drwBg');
  const setX = (x, anim) => {   // x: menu mở bao nhiêu px (0..300)
    const tr = anim ? 'transform .25s var(--ease)' : 'none';
    [app(), bar()].forEach(el => { el.style.transition = tr; el.style.transform = `translateX(${x}px)`; el.style.clipPath = 'none'; });   // đang kéo: bỏ phần cắt 66px (chỉ đúng khi menu mở hẳn), không thì trang bị cắt nửa
    dp().style.transition = tr; dp().style.transform = `translateX(${x - W}px)`;
    db().style.transition = anim ? 'opacity .25s var(--ease)' : 'none'; db().style.opacity = String(x / W);
  };
  const clearX = () => [app(), bar(), dp(), db()].forEach(el => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; el.style.clipPath = ''; });
  document.addEventListener('touchstart', e => {
    on = false; lock = null; dx = 0; mode = null; started = false;
    if (e.touches.length !== 1 || document.querySelector('#sheet:not([hidden]), .cmp:not([hidden]), .lacts, .dlg')) return;
    if (document.body.classList.contains('drwon')) mode = 'close';
    else if (e.target.closest('.scroll, .tblw, input, textarea, .sheet, .cswipe')) return;
    else if (view === 'group' && $('#gMenu')) mode = 'open';
    else if (backBtn()) mode = 'back';
    else return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!on) return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (lock === null && (Math.abs(x) > 10 || Math.abs(y) > 10)) lock = Math.abs(x) > Math.abs(y) * 1.5 && (mode === 'close' ? x < 0 : x > 0) ? 'x' : 'y';
    if (lock !== 'x') return;
    if (mode === 'back') { dx = Math.max(0, x); const a = app(); a.style.transition = 'none'; a.style.transform = `translateX(${dx * .6}px)`; a.style.opacity = String(1 - Math.min(dx / 600, .4)); return; }
    if (mode === 'open') { if (!started) { started = true; fillDrawer(); drw().hidden = false; document.activeElement?.blur?.(); } dx = Math.max(0, Math.min(W, x)); setX(dx); return; }
    dx = Math.max(-W, Math.min(0, x)); setX(W + dx);
  }, { passive: true });
  const end = () => {
    if (!on) return; on = false;
    if (mode === 'back') {
      const a = app(); a.style.transition = 'transform .2s var(--ease), opacity .2s'; a.style.transform = ''; a.style.opacity = '';
      if (lock === 'x' && dx > 80) { const b = backBtn(); setTimeout(() => { a.style.transition = ''; }, 220); b && b.click(); }
      return;
    }
    if (mode === 'open' && started) {
      const go = dx > 80; setX(go ? W : 0, true);
      setTimeout(() => { if (go) { document.body.classList.add('drwon'); clearX(); } else { clearX(); drw().hidden = true; dp().innerHTML = ''; } }, 260);
      return;
    }
    if (mode === 'close' && lock === 'x') {
      const go = dx < -60; setX(go ? 0 : W, true);
      setTimeout(() => { if (go) { document.body.classList.remove('drwon'); clearX(); drw().hidden = true; dp().innerHTML = ''; } else clearX(); }, 260);
    }
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });   // iPhone huỷ chạm giữa chừng: vẫn đưa menu về đúng chỗ
})();

document.addEventListener('focusout', e => { const id = e.target.dataset?.ename; if (id && !e.relatedTarget?.matches?.('[data-edate]')) setTimeout(() => endEdit(+id), 0); });
document.addEventListener('click', e => { const i = e.target.closest('.cal')?.querySelector('input'); if (!i) return; try { i.showPicker(); e.preventDefault(); } catch(_) {} });
document.addEventListener('focusin', e => { const t = e.target; if (t.matches('[data-amt],[data-tamt]') && !t.readOnly) setTimeout(() => { if (document.activeElement === t) t.select?.(); }, 0); });   // chỉ chọn hết số khi ô còn đang được focus (select() trên Chrome tự cướp focus)
window.addEventListener('resize', () => { if (view === 'home') fitWelcome(); });
document.fonts?.ready.then(() => { if (view === 'home') fitWelcome(); }); addEventListener('load', () => { if (view === 'home') fitWelcome(); });

/* long-press an expense card → sheet */
let pressT = null, pressEl = null, startXY = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.exp, .sumv .stack > :is(.fund,.txcard)'); if (!card || e.target.closest('input') || (e.target.closest('button') && !e.target.closest('.tx'))) return;
  const sc = !card.classList.contains('exp'); if (sc) card.classList.add('scard');
  pressEl = card; startXY = [e.clientX, e.clientY]; card.classList.add('press');
  pressT = setTimeout(() => { card.classList.remove('press'); suppressClick = true; setTimeout(() => suppressClick = false, 600); sc ? pressSheet(0, card) : card.dataset.top ? pressTop(+card.dataset.top) : card.dataset.kho ? pressTop(+card.dataset.kho, 'kho') : pressSheet(+card.dataset.exp); pressT = null; }, 500);
});
const cancelPress = () => { clearTimeout(pressT); pressT = null; pressEl?.classList.remove('press'); pressEl = null; };
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
document.addEventListener('pointermove', e => { if (pressT && startXY && Math.hypot(e.clientX - startXY[0], e.clientY - startXY[1]) > 10) cancelPress(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.exp, .sumv .stack > *')) e.preventDefault(); });

render();
if (BILL) loadBill(); else boot();
})();
</script>

</body></html>
