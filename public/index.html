<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coong Nợ</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coong Nợ">
<meta property="og:type" content="website">
<meta property="og:title" content="Coong Nợ">
<meta property="og:description" content="Chia tiền nhóm: ai chuyển cho ai">
<meta property="og:image" content="https://coongno.web.app/og-image.png?v=7">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=8">
<link rel="icon" href="/favicon.ico?v=8" sizes="any">
<link rel="icon" href="/icon.svg?v=8" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>   <!-- chỉ dùng khi xuất ảnh: không chặn trang hiện lên -->
<style>
/* Khung điện thoại 390 (fitZoom), theo Figma. Màn hình: Xin chào → Tạo/Chỉnh sửa nhóm → Nhóm (khoản chi, quỹ) → Tổng kết; menu trái, Tài khoản, sheet vai trò / ảnh, giữ lâu card. */
:root{
  color-scheme:dark;
  /* ===== Coongno v2 design tokens (chuẩn hóa 20/11) ===== */
  /* Màu: nền → bề mặt 1..4, chữ 1..3, viền, nhấn, trạng thái */
  --bg:#000; --surface-1:#141414; --surface-2:#1c1c1c; --surface-3:#2c2c2c; --surface-4:#3e3e3e;
  --text:#fff; --text-2:rgba(255,255,255,.55); --text-3:rgba(255,255,255,.3);
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.06); --scrim:rgba(0,0,0,.6);
  --yellow:#fc0; --yellow-bg:rgba(255,204,0,.16);
  --green:#34c759; --red:#ff383c; --red-bg:rgba(255,56,60,.16); --pink:#ff2d92; --purple:#cb30e0; --cyan:#00c0e8;
  /* tên cũ giữ làm bí danh */
  --ink:var(--bg); --paper:var(--text); --deep:var(--surface-1); --card:var(--surface-2); --sheet:var(--surface-2); --chip:var(--surface-3);
  --mute:var(--text-2); --faint:var(--text-3);
  /* Chữ: một họ Space Grotesk, 3 độ đậm 400/500/700; cỡ/dòng: 10/12 · 12/16 · 14/18 · 16/20 · 18/24 · 20/26 · 24/30 */
  --font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  /* Khoảng cách: 2 · 4 · 8 · 12 · 16 · 20 · 24 · 32; bo góc: 12 · 16 · 20 · 24 · 32 · tròn (100px); viền 1px */
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{background:var(--ink);color:var(--paper)}
body{min-height:calc(var(--sh,100vh) + 1px)}   /* trang nào cũng cuộn được 1px: iPhone (app ghim ra màn hình) mới vẽ kín tới đáy, thanh nút cách đáy đúng 24px như trang Tổng kết */
body{margin:0;font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0}
/* (đã bỏ tấm che cố định body::before: iOS 26 thấy phần tử cố định sát mép trên thì tự thêm lớp mờ lên đầu trang; Coong cafe không có nên sạch) */
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}input{outline:0;font:inherit;color:inherit}
p,h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
svg{display:block;flex:none}
.app{max-width:342px;margin:0 auto;padding-top:calc(32px + calc(env(safe-area-inset-top,0px) / var(--z,1)));   /* app ghim ra màn hình chính: nội dung vẽ dưới thanh trạng thái, iOS làm mờ/tối phần nằm trong vùng đó → chừa đúng chiều cao vùng an toàn (chia cho zoom của html vì env() không bị zoom) */
  
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.circ{display:flex;align-items:center;justify-content:center;border-radius:100px;flex:none}

/* header */
.logo{display:flex;justify-content:center;align-items:center;min-height:32px;padding-bottom:8px;margin-top:8px}
.logo .wm{width:152px;height:30.4px}
.back{width:52px;height:52px;background:var(--card);color:var(--paper)}
.back svg{width:20px;height:20px}
.ghead{display:flex;align-items:center;gap:12px;margin:0}   /* mọi trang: đầu trang cách mép trên 32px (= padding .app), cách khối dưới 16px */
.ghead h1{font-size:24px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ghead .hsp{width:52px;height:52px;flex:none}

/* home group list */
.home0{min-height:calc(var(--vh,100dvh) - 32px - calc(env(safe-area-inset-top,0px) / var(--z,1)) - 122px - env(safe-area-inset-bottom,0px));gap:24px}
html:has(.home0),html:has(.home0) body{overflow:hidden}
html:has(.home0) .bar{background:none}   /* trang xin chào không cuộn: bỏ lớp đen mờ sau nút để không che chữ */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:32px}   /* khoảng trống chia đều: logo – minh hoạ – lời chào – nút */
.ill{display:flex;flex-direction:column;align-items:center;padding-top:12px;line-height:1.25;pointer-events:none;user-select:none}
.ill > div{width:100%;box-sizing:border-box;flex:none;background:var(--card);border-radius:30px;padding:15px;box-shadow:0 0 38px rgba(0,0,0,.55)}
.ill .c1{margin-top:8px}.ill .c2{margin-top:7px}.ill .c3{margin-top:4px;margin-bottom:6px}
.ill .c1{rotate:3deg;border-radius:27px;padding:15px 19px;display:flex;flex-direction:column;gap:11px;box-shadow:none}
.ill .c2{rotate:-3deg}.ill .c3{rotate:2deg;display:flex;flex-direction:column;gap:11px}
.ill .r{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.ill .c1 > .r:first-child{font-size:14px}.ill .c1 > .r:first-child em{font-size:21px;font-style:normal;color:var(--green)}
.ill .fb{height:6px;border-radius:6px;background:var(--line)}.ill .fb i{display:block;height:100%;width:62%;border-radius:6px;background:var(--green)}
.ill .ls{display:flex;flex-direction:column;gap:8px}
.ill .ls .r{font-size:13px;font-weight:400}.ill .ls .r small{font-size:13px;color:var(--mute)}.ill .ls .r em{font-style:normal;font-size:15px;font-weight:700;color:var(--green)}.ill .ls .r em.n{color:var(--red)}
.ill .h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}.ill .h > span:not(.cal){flex:1}.ill .h em,.ill .c3 em{font-style:normal;color:var(--yellow)}
.ill .cal{flex:none;width:34px;height:34px;border-radius:9.5px;background:rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:15px;font-weight:700}
.ill .cal small{font-size:7.5px;line-height:9px;color:var(--yellow)}
.ill .inp{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.3);border-radius:23px;padding:9.5px 19px;font-weight:700}
.ill .inp b{display:flex;flex-direction:column;font-size:13px;line-height:17px}.ill .inp small{font-size:11px;line-height:15px;color:var(--yellow)}
.ill .inp em{font-size:17px}.ill .c3 > .r{padding:0 7.5px;font-size:13px}.ill .c3 > .r em{font-size:15px}
.hello{display:flex;flex-direction:column;gap:24px;text-align:center}
.hello h1{font-size:min(22px,5.7vw);line-height:30px;white-space:nowrap;font-weight:700;color:var(--yellow)}
.hello h2{font-size:min(18px,4.5vw);line-height:24px;white-space:nowrap;font-weight:700;margin-top:-20px}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.steps span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:min(13px,3.4vw);line-height:16px;font-weight:700;color:var(--text-2);white-space:nowrap}
.steps span b{font-size:18px;line-height:24px;color:var(--yellow)}
.steps svg{width:5px;height:38px;color:var(--text-3)}
@media (max-height:760px){.home0{gap:12px}.welcome{gap:16px}.ill{padding-top:0}.hello{gap:16px}.hello h2{margin-top:-16px}.steps svg{height:32px}}

/* form */
.uline{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;font-size:24px;font-weight:500;padding:12px 0 16px;caret-color:var(--yellow)}
.uline::placeholder{color:var(--faint)}
.uline:focus{border-bottom-color:var(--paper)}
.lbl{font-size:14px;font-weight:700;color:var(--mute)}
.mcard .lbl:last-child{margin-bottom:4px}
.av{flex:none;width:50px;height:50px;border-radius:50%;background:var(--deep);color:var(--surface-4);display:flex;align-items:center;justify-content:center;overflow:hidden}
.av svg{width:26px;height:26px}
.av.emo{background:var(--paper);font-size:28px;line-height:1}
.av.big{width:80px;height:80px;background:var(--card);color:var(--text-2)}
.av.big svg{width:38px;height:38px}
.av.big.emo{background:var(--paper);font-size:44px}
.avpick{position:relative;align-self:center;margin-top:-4px}
.avpen{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.avpen svg{width:18px;height:18px}
html:has(#sheet:not([hidden]) .emogrid) .avpen,html:has(#avPick) .avpen{display:none}.avpk{width:100%;box-sizing:border-box;background:var(--sheet);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:16px}.avpk .acts{display:flex;margin:0}.avpk .swrow{display:grid;grid-template-columns:repeat(6,47px);justify-content:space-between;gap:0;justify-items:center;padding:0}   /* bảng chọn ảnh: mỗi màu nằm giữa cột icon phía trên (POD 22/11) */.avpk .acts .btn{flex:1}   /* đang chọn ảnh: ẩn nút bút, bấm Lưu lại (đóng bảng) thì hiện lại */
.uline.gname{text-align:center;font-size:24px;line-height:30px;font-weight:700;height:31px;padding:0;box-sizing:border-box;border-bottom:0}
.uline.gname::placeholder{color:var(--surface-4)}
.uline.gname:focus{border-bottom-color:transparent}
.mcard{background:var(--card);border-radius:32px;padding:12px;display:flex;flex-direction:column;gap:12px}
.mcard > .lbl,.mcard > .chips{margin:0 4px}
.mcard > .lbl{color:var(--text-2)}
.mcard .lbl,.fcard .lbl{font-size:14px;line-height:18px;font-weight:500}
.mrow{display:flex;align-items:flex-start;gap:8px;height:52px}
.mline{flex:1;min-width:0;height:50px;box-sizing:border-box;background:rgba(0,0,0,.3);border:0;border-radius:24px;outline:0;font-size:16px;line-height:20px;font-weight:700;padding:0 12px 0 16px;caret-color:var(--yellow)}
.mline::placeholder{color:var(--text-3);font-weight:500}
.yadd{width:50px;height:50px;background:var(--paper);color:var(--ink)}
.yadd svg{width:28px;height:28px}
.mcard .chip{background:var(--chip);height:40px;font-size:16px;gap:8px;padding:0 12px 0 16px}
.mcard .chip .x{width:20px;height:20px;color:var(--text-3);margin:0}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.emogrid .ico{aspect-ratio:1;border-radius:50%;background:var(--chip);color:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .2s}
.emogrid .ico svg{width:55%;height:55%}
.emogrid .ico.on{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.emogrid.v2 .ico.on{background:var(--surface-4);color:var(--text);box-shadow:inset 0 0 0 3px var(--text)}
.sw.def.on{box-shadow:inset 0 0 0 3px var(--paper)}
.sheet .sp.av2{padding:24px;gap:16px}.sp.av2::before{top:12px}.sp.av2 h3{margin:0;line-height:26px}.sp.av2 .emogrid{grid-template-columns:repeat(6,47px);justify-content:space-between;gap:12px 0}.sp.av2 .sw{width:34px;height:34px}.sp.av2 .btn{height:50px}.sp.av2 .swrow{padding:0}.sp.av2 .sw.on{box-shadow:inset 0 0 0 3px var(--text)}.sp.av2 .acts{margin-top:0}
.swrow{display:flex;justify-content:space-between;padding:8px 4px 4px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--sheet),0 0 0 0 var(--paper);transition:box-shadow .2s}
.sw.on{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--paper)}
.av.ic{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--c)}
.av.big.ic svg{width:44px;height:44px}
/* menu trái */
.drw{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - 195px));width:min(390px,100%);z-index:30;overflow:hidden}   /* mọi thứ nằm trong khung 390 */
.drw .db{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s var(--ease)}
.drw .dp{position:absolute;top:0;bottom:0;left:0;width:300px;background:var(--ink);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px) / var(--z,1)) 24px 0;box-sizing:border-box;transform:translateX(-100%);transition:transform .25s var(--ease)}
body.drwon .drw .db{opacity:1}body.drwon .drw .dp{transform:none}
#app,.bar{transition:transform .25s var(--ease)}
body.sheetdrag #app,body.sheetdrag .bar{visibility:hidden}   /* vuốt quay lại ở trang Thêm/Sửa: ẩn trang nằm sau, chỉ trang đang vuốt lùi + mờ trên nền đen (giống các trang khác) */
body.drwon #app,body.drwon .bar{transform:translateX(300px)}
/* phần trang bị đẩy sang chỉ lộ trong khung 390, không tràn ra ngoài */
body.drwon #app{clip-path:inset(-60px calc(100% - 66px) -4000px -30px)}
body.drwon .bar{clip-path:inset(0 calc(50% + 105px) 0 max(0px,calc(50% - 495px)))}
body.drwon{user-select:none;-webkit-user-select:none}
html:has(body.drwon),body.drwon{overflow:hidden}
.dlogo{height:45px;display:flex;align-items:center}.dlogo .wm{width:152px;height:30.4px}
.dlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;margin-top:24px;padding-bottom:16px}
.ditem{display:flex;align-items:center;gap:12px;min-height:32px;font-size:16px;line-height:24px;font-weight:700;color:var(--paper)}
.ditem span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.av.sm{width:32px;height:32px}.av.sm svg{width:16px;height:16px}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.dme{width:50px;height:50px}.av.me{width:50px;height:50px}.av.me:not(.ic){background:var(--card);color:var(--paper)}.av.me svg{width:24px;height:24px}
.btn.dnew{flex:none;width:162px}
.flow .fln{flex-basis:100%;font-size:14px;line-height:18px;color:var(--mute);font-weight:500;white-space:normal;overflow-wrap:anywhere}   /* ghi chú: dòng riêng, không cắt chữ sớm */
.exp .flow + .calc{margin-top:-12px}   /* dòng dưới ô nhập tiền cách 6px */
.btn.lockby{background:var(--surface-4);color:var(--text-2);gap:8px;cursor:default}.btn.lockby svg{width:18px;height:18px}
.ghead.gh h1{font-size:18px;line-height:24px;text-align:left}
.ghead.gh .circ.back,.lgh .circ.back{width:44px;height:44px;flex:none}   /* Figma 12–16: nút 44px, tiêu đề 18px */
.ghead.lgh .ttl3 h1{font-size:18px;line-height:24px}
.ghead.lgh .sub{color:var(--text-2)}
.pill2{display:flex;flex:none;height:44px;border-radius:100px;background:var(--card)}   /* Lịch sử hoạt động + Chỉnh sửa: chung một khung */
.pill2 button{display:flex;align-items:center;justify-content:center;width:50px;height:44px;border-radius:100px;color:var(--paper)}
.pill2 button:active{opacity:.6}.pill2 svg,.ghead.gh #gMenu svg{width:24px;height:24px}   /* 3 icon ở đầu trang nhóm: menu, lịch sử, chỉnh sửa */   /* tên nhóm cùng cỡ chữ "Tổng kết" */
.fcard.ro .flist{pointer-events:none}   /* quỹ chỉ người tạo nhóm sửa; người khác vẫn mở ra xem được */
.uline.gname[readonly]{caret-color:transparent}
.fv .avpick{margin:0 auto}.fv .av.big:not(.ic){background:var(--surface-4)}   /* trang tạo nhóm (Figma 421:1130): avatar #3e3e3e, tên nhóm 24px, nút ✓ vàng ở thanh trên */
.gbyf{text-align:center;font-size:14px;line-height:18px;font-weight:500;color:var(--mute);margin-top:-12px}   /* "Tạo bởi …" dưới tên nhóm ở trang chỉnh sửa */
/* Tiêu đề Tổng kết luôn dính ngay dưới thanh trạng thái (POD 18/11: iPhone mở Tổng kết bị mất tiêu đề): dù trang bị cuộn lệch bao nhiêu tiêu đề vẫn thấy */
#app > .view > header:first-child::before{content:'';position:absolute;left:calc(-24px - var(--fx,0px));right:calc(-24px - var(--fx,0px));bottom:100%;height:300px;background:var(--ink);pointer-events:none}   /* đầu trang dính: phủ đen lên trên tới mép màn hình, nội dung cuộn qua bị cắt, không lộ sau giờ / pin (không dùng lớp cố định vì iOS 26 tự thêm lớp mờ) */
#app > .view > header:first-child{position:sticky;top:0;z-index:11;background:var(--ink);margin-top:calc(-32px - env(safe-area-inset-top,0px) / var(--z,1));padding-top:calc(32px + env(safe-area-inset-top,0px) / var(--z,1))}   /* mọi trang: thanh trên đứng yên khi cuộn, nền đen phủ kín cả vùng tai thỏ nên card cuộn lên không lộ ra phía trên */
#app > .view > header:first-child::after{content:'';position:absolute;left:-24px;right:-24px;top:100%;height:16px;background:linear-gradient(var(--ink),rgba(0,0,0,0));pointer-events:none}
#app > .view.cview > header:first-child::after{display:none}
body:has(.cview) .app{padding-bottom:0}   /* trang lịch vừa khít màn hình: không cuộn cả trang */
[data-shotroot] .shead,[data-shotroot] header:first-child{position:static;box-shadow:none;margin-top:0;padding-top:0}[data-shotroot] header:first-child::after,[data-shotroot] header:first-child::before{display:none}
.shead .ttl3{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}   /* Tổng kết ↔ tên nhóm 4px */
.shead .ttl3 .r1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shead .ttl3 h1{text-align:left;font-size:20px;line-height:26px;flex:none}.shead .ttl3 .sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* tên nhóm một dòng, dài thì … */
.shead .wm{width:115px;height:23px;flex:none;position:relative;top:3px}   /* chân chữ logo ngang chân chữ "Tổng kết" (đo: logo cao hơn khoảng 3px) */
#acAvBtn .av:not(.ic){color:var(--paper)}
.aname{display:flex;flex-direction:column;align-items:center;gap:0}
/* trang đặt tên lần đầu (Figma 331-619): đầu trang chừa 52px như header, avatar cách 45px, nút nổi sát trên bàn phím */

/* Đăng nhập / Tạo tài khoản / Mã PIN (Figma 510:6797): logo → avatar 80 → ô tên (khối cao cố định 80, dòng thông báo luôn giữ chỗ) → nút 50 → link; cách nhau 24 */
.view.auth{gap:24px}.auth .lhead{margin:0;height:44px;justify-content:center}.auth .avpick{margin:0 auto}div.avpick{cursor:default}

.phd{display:flex;align-items:center;height:44px;margin-bottom:-24px}   /* Figma 510:7365: màn mã PIN có nút quay lại thay cho logo, tiêu đề ngay dưới */
.pinb{display:flex;flex-direction:column;align-items:center;gap:24px;padding-top:12px}.pinb h1{font-size:24px;line-height:30px;font-weight:700;text-align:center}

.perr{height:18px;margin-top:-8px;font-size:14px;line-height:18px;font-weight:500;color:var(--yellow);text-align:center}.perr.sub{color:var(--text-3)}   /* Figma: thông báo lỗi cách ô PIN 16, luôn giữ chỗ */
/* trang đặt tên + tài khoản (body.kbbar): thanh nút luôn hiện, trên điện thoại nổi sát trên bàn phím (--kb), máy tính thì nằm đáy.
   trang tạo/sửa nhóm (body.barshow): thanh nút luôn hiện nhưng cố định ở cuối trang, không nổi theo bàn phím */
body.kbbar .bar{transform:translateY(calc(-1 * var(--kb,0px)))}
@media (pointer:coarse){body.kbbar.kb .bar{padding-bottom:12px}body.kbbar.kb .app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px) + var(--kbpad,0px))}}
.ahd{display:flex;align-items:center;gap:8px;height:44px;margin:0}.ahd h1{flex:1;min-width:0;font-size:20px;line-height:26px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ahd .c44{flex:none}.ahd .okb{background:var(--yellow);color:var(--bg)}.ahd .okb svg{width:24px;height:24px}.acv .ohandle{font-size:14px;color:var(--yellow)}   /* lỗi tên (trùng, sai) màu vàng như trang tạo tài khoản */.onb.acv .oname{height:31px;padding:0}

#atHint:empty{display:none}
/* gợi ý @ và chip thành viên có tài khoản: avatar tròn 28 + tên (+ vàng / ×) */
.athint{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 8px;border-radius:100px;background:var(--line);font-size:16px;font-weight:700;color:var(--paper);max-width:100%}

.athint > svg{width:22px;height:22px;color:var(--yellow)}
.av.cav{width:28px;height:28px;flex:none}.av.cav svg{width:14px;height:14px}.av.cav:not(.ic){background:var(--surface-4);color:var(--paper)}
.mcard .chip.lk{padding-left:6px}
.chip.fixm{padding-right:16px}   /* thành viên không bỏ ra được (người tạo nhóm, người đã có trong nhóm): không có nút ✕ nên chừa lề phải đều như lề trái */
.athint.none{display:block;height:auto;padding:0;border-radius:0;background:none;font-size:16px;line-height:20px;font-weight:500;color:var(--mute)}   /* không tìm thấy: chữ xám, không có nền chip */

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:100px;background:var(--card);font-size:16px;font-weight:700;white-space:nowrap;flex:none;transition:background .15s,color .15s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.exp .chip{height:28px}
.chip.sel{background:var(--paper);color:var(--ink)}
.chip.dark{background:var(--chip)}
.fstack{display:flex;flex-direction:column;gap:12px}
.fcard{background:var(--card);border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fhead{display:flex;align-items:center;gap:8px;width:100%;font-size:18px;line-height:24px;font-weight:700;text-align:left}
.fhead span{flex:1}
.fhead .fcar{width:20px;height:20px;flex:none;color:var(--text-2);transform:rotate(180deg);transition:transform .2s}.fcard.open .fhead .fcar{transform:none}
/* card Tạo quỹ chung (Figma 262-1921): từng người góp → khoản góp ngoài quỹ → Tổng quỹ ở cuối */
.flist{display:flex;flex-direction:column}
.eqb{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer}.eqb i{width:20px;height:20px;box-sizing:border-box;border-radius:6px;border:2.2px solid var(--text-2);display:flex;align-items:center;justify-content:center;color:var(--bg)}.eqb svg{width:14px;height:14px;opacity:0}[data-eqfor]{cursor:pointer;-webkit-user-select:none;user-select:none}.eqb.on i{background:var(--yellow);border-color:var(--yellow)}.eqb.on svg{opacity:1}.feqr b,.xfr.xeq .xn{color:var(--paper)}   /* dòng "Góp đều nhau" (POD 22/11, ảnh mẫu): ô tích 28px như avatar, tích vào thì dòng này có ô số tiền và ẩn từng người */
.frow{display:flex;align-items:center;gap:8px;height:53px;box-sizing:border-box;padding:12px 0;border-bottom:1px solid var(--line-2)}   /* Figma 08/09: vạch kẻ dưới mỗi dòng */
.ftot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line-2);font-weight:700}
.ftot span{font-size:16px;line-height:20px;color:var(--paper)}   /* "Tổng quỹ" cùng cỡ 16px với "Khoản góp ngoài quỹ", vẫn trắng */
.ftot b{font-size:24px;line-height:30px;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.frow .sbtn{width:28px;height:28px;margin-right:0}.frow .sbtn svg{width:20px;height:20px}
.frow .sbtn.add{background:var(--surface-4);color:var(--paper)}.frow .sbtn.del{background:var(--red-bg);color:var(--red)}
.frow .bname{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;font-size:16px;line-height:20px;font-weight:700;color:var(--text);caret-color:var(--yellow);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.frow .bname::placeholder{color:var(--text-3);text-overflow:ellipsis}#sNewName::placeholder{color:var(--surface-4);opacity:1}   /* dòng thêm mới: chữ xám; khoản đã thêm chưa đặt tên: chữ tối hơn */
.frow .bname + input{margin-left:0}
.frow .gq{font-weight:400;color:var(--text-2)}
.frow input:not(.bname){width:7.5em;min-width:0;flex:0 0 auto;max-width:60%}
.frow b{flex:1;min-width:0;font-size:16px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow input{width:50%;background:none;border:0;outline:0;padding:0;text-align:right;font:inherit;font-size:18px;line-height:20px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;caret-color:var(--paper)}
/* Design chốt 18/11 (Figma 351:757): dòng góp = avatar 28 + tên + số tiền; chưa nhập hiện "Nhập số tiền" xám, có số thì xanh lá 18px đậm; tổng quỹ xanh lá 24px */
.rav{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-4);display:flex;align-items:center;justify-content:center;color:var(--text-2)}.rav svg{width:16px;height:16px}
.frow input:not(.bname),.flow.topf input{color:var(--green);cursor:text}
.frow input:not(.bname)::placeholder,.flow.topf input::placeholder{color:var(--text-3);font-weight:500;font-size:16px;opacity:1}.frow input:not(.bname)::placeholder{color:var(--surface-4)}   /* Figma 08: chữ gợi ý "Nhập" màu surface-4 */
.tcard .scroll .chip{height:28px;padding:0 16px}
.fund{background:var(--card);border-radius:32px;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.fund .top{display:flex;align-items:center;gap:0;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.fund .top small{flex:1;min-width:0;font-size:18px;line-height:24px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* theo Figma 348:1793: tiêu đề 18px, số tiền 24px */
.fund .top b{font-size:24px;line-height:30px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.fund .fcar{width:20px;height:20px;flex:none;margin-left:4px;color:var(--green);transform:rotate(180deg)}
.fund.open .fcar{transform:none}
.fund .fls{display:flex;flex-direction:column;gap:8px;margin-top:-8px}   /* tiêu đề ↔ các dòng 6px */
.fund .fl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:18px;font-weight:500;color:var(--text-2)}
.fund .fl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fund .fl span b{font-weight:500;color:inherit}.fund .fl span em{font-style:normal;font-weight:400}   /* Góp quỹ / Góp thêm / Đã chi: cả dòng chữ xám như Figma */
.fund .fl > b{font-size:14px;line-height:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fund .fks{display:flex;flex-direction:column;gap:8px}
.fund .fk{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:18px;font-weight:500;color:var(--text)}.fund .fk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fund .fk b{font-weight:700;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}.fund .fk b.neg{color:var(--red)}   /* món trong kho (Figma 348:1793): tên 14px medium trắng, còn/tổng 14px đậm trắng (Figma 331:892); dùng quá thì số đỏ */
.fund .fl > b.pos{color:var(--green)}.fund .fl > b.neg{color:var(--red)}
.fund .top b.neg,.fund.neg .fcar{color:var(--red)}
.fbar{height:6px;border-radius:100px;background:var(--card);overflow:hidden}.fund .fbar{background:var(--line)}
.fbar i{display:block;height:100%;border-radius:100px;background:var(--yellow)}
.ghead .sub{display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--paper)}
.chip .x{width:18px;height:18px;color:var(--mute);margin-right:-4px}
.scroll{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:-4px -16px;padding:4px 16px}
.scroll::-webkit-scrollbar{display:none}
/* Máy tính dùng chuột (hover + pointer fine): danh sách chip thu về một dòng, có nút mũi tên xem tất cả / thu gọn (Figma 338:1461). Điện thoại / máy tính bảng giữ vuốt ngang. */
.rtg{display:none!important}
.desk .rowf{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.desk .rowf [hidden]{display:none!important}
.desk .rowf .rtg:not([hidden]){display:inline-flex!important;width:40px;padding:0;justify-content:center;background:var(--line);color:var(--text)}
.rtg svg{width:20px;height:20px;transform:rotate(180deg)}.rtg.open svg{transform:none}
html,body{scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x pan-y;overscroll-behavior:none}   /* không kéo nảy: thanh trên / thanh nút dưới đứng yên */
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
*{scrollbar-width:none}

/* expense card */
.exp{background:var(--card);border-radius:32px;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease)}
.exp.press,.scard.press{transform:scale(.98)}
.sumv .stack > :is(.fund,.txcard,.tblw){transition:transform .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.exp .eh{display:flex;align-items:center;gap:12px;height:36px}
.cal{position:relative;flex:none;width:36px;height:36px;border-radius:12px;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.cal b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cal span{font-size:10px;font-weight:700;color:var(--yellow);margin-top:4px;letter-spacing:.02em}
.cal,.cal input,.cal input::-webkit-calendar-picker-indicator{cursor:pointer}
.cal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none}
.exp .eh .ename{flex:1;min-width:0;height:36px;display:block;line-height:36px;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:0}

.exp .fold[aria-expanded="false"] svg{transform:rotate(180deg)}
.exp .ftot2{flex:none;font-size:20px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}   /* tổng khoản chi khi thu gọn: tiền chi ra → đỏ */
.exp .eh input.nm{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;height:36px;box-sizing:border-box;font-size:20px;font-weight:700;padding:0;caret-color:var(--yellow);user-select:text;-webkit-user-select:text}
.exp .eh input::placeholder{color:var(--faint);font-weight:700}   /* placeholder "Nhập tên khoản chi": đậm 700 cả lúc chưa bấm (.ename.ph) lẫn lúc đang nhập */
.exp hr{border:0;border-top:1px solid var(--line);margin:0 0}
.exp .sub{font-size:14px;line-height:18px;font-weight:500;color:var(--mute);margin:0 0 -8px}
.exp .sub+.scroll+.flow{margin-top:-4px}
.flow.topf .role,.flow.topf .fnote2{color:var(--green)}
/* card Góp thêm quỹ (.tcard): danh sách phẳng như mục Góp quỹ chung: dòng cao 52px, vạch mảnh; dòng đầu liền sát chips nên chữ cách chips đúng 16px */
.tcard .tfl{display:flex;flex-direction:column;margin-top:-8px}.tcard .tfl:empty{display:none}.tcard .tfl > .flow.topf:last-child{padding-bottom:0;height:40px}   /* chưa chọn ai thì ẩn hẳn khối dòng (khỏi thừa khoảng trống ở đáy card); dòng cuối không đệm dưới (Figma 351:757) */
.tcard .flow.topf{flex-wrap:nowrap;gap:8px;background:none;border-radius:0;min-height:0;height:52px;padding:12px 0;margin:0;border-top:1px solid var(--line-2)}
.tcard .tfl > .flow.topf:first-child{border-top:0}
.tcard .flow.topf .who{flex:1;max-width:none}
.tcard .flow.topf .who b{font-size:16px;line-height:20px;font-weight:700;color:var(--paper)}
.tcard .flow.topf input{flex:0 0 auto;width:7.5em;max-width:60%;font-size:18px;line-height:20px}
.tcard .ftot2{color:var(--green)}   /* tổng khi thu gọn: cùng cỡ 19px với tổng card khoản chi (POD chốt 18/11) */
.flow+.flow{margin-top:-8px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;background:var(--deep);border-radius:24px;padding:12px 16px;min-height:56px;box-sizing:border-box}
.flow .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:none;max-width:45%}
.flow .who b{font-size:16px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .role{display:inline-flex;align-items:center;gap:0;font-size:14px;line-height:18px;height:18px;font-weight:400;color:var(--green);user-select:none}   /* ứng tiền: được cộng → xanh */
.flow .role svg{width:12px;height:12px;flex:none;margin-left:2px}
.flow.donate .role{color:var(--cyan)}.flow.fixed .role{color:var(--pink)}
.flow input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-size:24px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;padding:0;caret-color:var(--paper);user-select:text;-webkit-user-select:text}
.flow input::placeholder{color:var(--green)}
.flow.donate input{color:var(--cyan)}.flow.donate input::placeholder{color:var(--cyan)}
.flow.fixed input{color:var(--pink)}.flow.fixed input::placeholder{color:var(--pink)}   /* đóng cố định → hồng (POD chốt 18/11); rút quỹ vẫn đỏ */
.calc{display:flex;flex-direction:column;gap:8px;padding:0 16px;font-size:14px;line-height:18px}

<script>
(() => {
/* ================= storage & model =================
   group   = { id, name, avatar, by, at, members:[{ id, name, uid?, handle?, avatar? }], exps:[expense], fund?, sid?, bill? }
   expense = { id, at, name, by, parts:[memberId], flows:[{ id: memberId | FUND, role: 'pay'|'donate'|'fixed', amt, note? }] }
   - Ứng tiền (pay): trả trước số tiền đó và vẫn chia đều như mọi người.
   - Tài trợ (donate, chỉ còn ở dữ liệu cũ) / Đóng cố định (fixed): chỉ chịu đúng số đó, không chia đều.
   Tổng chi = tổng tiền ứng. Phần còn lại sau khi trừ tài trợ + cố định chia đều cho những người tham gia còn lại.
   Mỗi đường link ngắn (coongno.web.app/1, /abc…) là một quỹ độc lập, công khai: ai mở link cũng xem được. */
const PATH = (() => { try { return decodeURIComponent(location.pathname); } catch(e) { return ''; } })().normalize('NFC');
const SLUG = ((PATH.match(/^\/((?:new-user\/\d{1,12})|[\p{L}\p{N}_-]{1,40})\/?$/u) || [])[1] || '').toLowerCase().replace(/^s$/, '');
/* Link bill chỉ-xem: /<quỹ>/bill/<tên-nhóm>, /s/<mã>/bill/<tên-nhóm>, /new-user/<số>/bill/<tên-nhóm> — chỉ hiện trang Tổng kết, không ghi gì xuống máy hay lên máy chủ. */
const BILLM = PATH.match(/^\/(?:s\/([A-Za-z0-9]{20,40})|(new-user\/\d{1,12})|([\p{L}\p{N}_-]{1,40}))\/bill\/([a-z0-9-]{1,60})\/?$/u);
const BILLN = PATH.match(/^\/bills\/(\d{4,12})\/?$/);   // link bill mới: /bills/<số ngẫu nhiên>
const BILL = BILLN ? { bid: BILLN[1], st: 'load' } : BILLM ? { code: BILLM[1] || null, owner: (BILLM[2] || BILLM[3] || '').toLowerCase(), g: BILLM[4], st: 'load' } : null;
const KEY = BILL ? 'coong_bill_view' : SLUG ? 'coong_calc_v4_' + SLUG : 'coong_calc_v4';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
/* Mốc reset: đổi EPOCH (và xoá collection books trên Firestore) thì mọi máy mở bản mới sẽ xoá sạch dữ liệu của app trên máy đó đúng một lần.
   Không có bước này, máy cũ còn dữ liệu sẽ đẩy ngược dữ liệu cũ lên máy chủ vừa được xoá. */
const EPOCH = 'launch-2026-11';
try { if (localStorage.getItem('coong_epoch') !== EPOCH) { Object.keys(localStorage).filter(k => k.startsWith('coong_')).forEach(k => localStorage.removeItem(k)); localStorage.setItem('coong_epoch', EPOCH); } } catch(e) {}
let uid = 1;
const mem = n => ({ id: uid++, name: n });
/* bring over cuộc vui from the previous version once */
function fromV3(old = store.get('coong_calc_v3')){
  if (!old || !Array.isArray(old.events)) return null;
  return old.events.filter(e => !e.sample && e.members?.length).map(e => {
    const exps = (e.stages || []).filter(s => Number(s.total) > 0).map(s => {
      const pays = (s.payers || []).filter(x => e.members.some(m => m.id === x.id));
      return { id: s.id, name: s.name || '', parts: (s.parts || []).slice(),
        flows: pays.map(x => ({ id: x.id, role: 'pay', amt: pays.length === 1 ? Number(s.total) : Number(x.amt) || 0 })) };
    });
    e.members.forEach(m => {               // old per-outing donate / fixed → first expense they joined
      const amt = m.role === 'donate' ? m.donate : m.role === 'custom' ? m.amount : 0;
      const ex = amt && exps.find(x => x.parts.includes(m.id));
      if (ex && !ex.flows.some(f => f.id === m.id)) ex.flows.push({ id: m.id, role: m.role === 'donate' ? 'donate' : 'fixed', amt });
    });
    return { id: e.id, name: e.name || 'Cuộc vui', members: e.members.map(m => ({ id: m.id, name: m.name })), exps, round: e.round !== false, done: {} };
  });
}
/* ================= cloud sync =================
   iPhone keeps a home-screen app's storage separate from Safari's, so localStorage alone looks like a "reset".
   Each person gets a private sổ (book) code in the URL (/s/CODE); data lives in Firestore under that code
   (REST, no SDK) plus a local copy for offline use. Newest change (updatedAt) wins. */
const FS_URL = 'https://firestore.googleapis.com/v1/projects/quanlyquy-f5fce/databases/(default)/documents/books/';
const FS_KEY = 'AIzaSyCyQv6aBKLrzUyzBw5hc36fe9kbifKiPrI';
const BOOK = 'coong_book';
const onWeb = /^https?:$/.test(location.protocol) && !/claude|anthropic|usercontent/.test(location.hostname) && !BILL;   // trang bill không đồng bộ/ghi gì

const hadLocal = !!store.get(KEY) || (!SLUG && !!store.get('coong_calc_v3'));
/* nhóm mở gần nhất trên máy này */
const LAST = 'coong_last';
let adraft = null;
let root = store.get(KEY);
if ((SLUG || BILL) && (!root || !Array.isArray(root.groups))) root = { groups: [], me: '', updatedAt: 0 };
if (!root || !Array.isArray(root.groups)) {
  const prev = fromV3(), v3 = store.get('coong_calc_v3') || {};
  root = { groups: prev || [], me: v3.me || '', updatedAt: v3.updatedAt || 0 };   // người mới: bắt đầu từ trang Xin chào
}
root.updatedAt = root.updatedAt || (hadLocal ? 1 : 0);   // 0 = máy này chưa có gì; dữ liệu trên máy chủ luôn thắng
/* ảnh đại diện tải lên (bản cũ, dạng data:) không dùng nữa: xoá khỏi dữ liệu để sổ trên máy chủ nhẹ, không chạm giới hạn 1MB */
const dropUploads = r => { let n = 0; const z = o => { if (o && String(o.avatar || '').startsWith('data:')) { o.avatar = ''; n++; } };
  z(r.acct); (r.groups || []).forEach(g => { z(g); (g.members || []).forEach(z); }); return n; };
const hadUpload = String(root.acct?.avatar || '').startsWith('data:');
dropUploads(root);   // không đổi updatedAt: máy cũ không được vì thế mà ghi đè bản mới hơn trên máy chủ
const fixUid = () => { uid = Math.max(uid, ...root.groups.flatMap(g => [g.id, ...g.members.map(m => m.id), ...g.exps.map(e => e.id)])) + 1; };
fixUid();
if (!BILL) store.set(KEY, root);

const newCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; return [...crypto.getRandomValues(new Uint8Array(22))].map(x => a[x % a.length]).join(''); };
const urlCode = (location.pathname.match(/^\/s\/([A-Za-z0-9]{20,40})\/?$/) || [])[1];
const slugHash = sl => [1, 2, 3, 4].map(k => { let h = 0x811c9dc5 ^ k; for (const ch of sl) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8, '0'); }).join('');
const slugCode = sl => /^[a-z0-9]{1,20}$/.test(sl) ? ('quy' + String(sl.length).padStart(2, '0') + sl).padEnd(20, '0') : 'quh' + slugHash(sl);   // mã sổ cố định cho từng link ngắn
let book = BILL ? (BILL.bid ? '' : BILL.code || slugCode(BILL.owner)) : SLUG ? slugCode(SLUG) : urlCode || store.get(BOOK) || newCode();
let syncState = onWeb ? 'saving' : 'off', pushT = null;
function setBook(code){ book = code; store.set(BOOK, code); const pth = root.acct?.handle ? '/' + root.acct.handle : urlCode ? '/s/' + code : ''; if (onWeb && pth && location.pathname !== pth) window.history.replaceState(null, '', pth); }   // chưa có tài khoản thì giữ nguyên địa chỉ "/" cho tới khi người dùng đặt tên
/* máy chưa có tài khoản, chưa có nhóm, đang ở trang gốc "/": chưa có gì để lưu, không tạo bản ghi rỗng trên máy chủ cho người chỉ ghé qua */
const anon = () => !SLUG && !urlCode && !root.acct?.uid && !root.groups.length;
if (onWeb && !SLUG) setBook(book);
const bookLink = () => root.acct?.handle ? `${location.origin}/${root.acct.handle}` : SLUG ? `${location.origin}/${SLUG.split('/').map(encodeURIComponent).join('/')}` : `${location.origin}/s/${book}`;
/* tên nhóm → đuôi link bill: "Cầu Lông Tháng 9" → caulongthang9 (trùng tên thì thêm -2, -3…) */
const gSlugs = gs => { const seen = {}; return gs.map(g => { const s = String(g.name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 40) || 'nhom'; seen[s] = (seen[s] || 0) + 1; return seen[s] > 1 ? s + '-' + seen[s] : s; }); };
const billLink = g => g.bill ? `${location.origin}/bills/${g.bill}` : `${bookLink()}/bill/${gSlugs(root.groups)[root.groups.indexOf(g)]}`;
/* ================= tài khoản @tên, nhóm chung, link bill =================
   Vẫn chỉ dùng collection books/{mã}. Ngoài sổ của từng người còn 3 loại bản ghi:
   - usr<băm @tên>: hồ sơ { uid, handle, name, avatar, book, groups: [mã nhóm chung được mời vào] }. Link /<tên> mở sổ `book`.
   - grp…: nhóm chung { g }. Nhóm có thành viên @ (người dùng khác) nằm ở đây để cả hai app cùng xem/sửa; bản sửa sau cùng thắng (g.uat).
   - bil<số>: link bill /bills/<số> → { book, gid, sid }.
   Chặn trùng tên: tạo hồ sơ với điều kiện "chưa có" (currentDocument.exists=false); firestore.rules chặn ghi đè hồ sơ của uid khác. */
const usrCode = h => 'usr' + slugHash(h);
const bilCode = n => 'bil' + String(n).padStart(17, '0');
const NAME_MAX = 18;   // @tên tối đa 18 ký tự
const capName = v => { while (v && toHandle(v).length > NAME_MAX) v = v.slice(0, -1); return v; };
const toHandle = n => String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 30);
const HANDLE_BAD = new Set(['s', 'bill', 'bills', 'newuser', 'index']);
const okHandle = h => h.length >= 2 && /[a-z]/.test(h) && !HANDLE_BAD.has(h);
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const fsFetch = async (url, opt) => { try { return await fetch(url, opt); } catch(e) { await new Promise(r => setTimeout(r, 600)); return fetch(url, opt); } };   // mạng chập chờn: thử lại một lần
async function fsGet(code){
  const r = await fsFetch(`${FS_URL}${code}?key=${FS_KEY}`, { cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return { at: Number(j.fields?.updatedAt?.integerValue || 0), data: JSON.parse(j.fields?.data?.stringValue || 'null'), ut: j.updateTime };
}
const fsBody = (data, at) => JSON.stringify({ fields: { data: { stringValue: JSON.stringify(data) }, updatedAt: { integerValue: String(at || Date.now()) } } });
/* pre: 'new' = chỉ ghi khi chưa có; chuỗi thời gian = chỉ ghi khi bản trên máy chủ chưa đổi. Trả 'ok' hoặc 'taken' (điều kiện không đạt / luật chặn). */
async function fsPut(code, data, at, pre){
  const q = pre === 'new' ? '&currentDocument.exists=false' : pre ? '&currentDocument.updateTime=' + encodeURIComponent(pre) : '';
  const r = await fsFetch(`${FS_URL}${code}?key=${FS_KEY}${q}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: fsBody(data, at) });
  if (r.ok) return 'ok';
  if ([400, 403, 409, 412].includes(r.status)) return 'taken';
  throw new Error(r.status);
}
async function getUser(h, hops = 3){   // tên đã đổi thì hồ sơ cũ trỏ sang tên mới (movedTo)
  const u = h && await fsGet(usrCode(h)); if (!u?.data) return null;
  if (u.data.movedTo) return hops ? getUser(u.data.movedTo, hops - 1) : null;
  return u.data.released ? null : u;
}
const MSG_BADNAME = 'Tên cần ít nhất 2 chữ hoặc số, và có chữ cái';
async function handleFree(h){   // @tên còn trống? (cùng điều kiện với claimHandle)
  const cur = await fsGet(usrCode(h));
  if (cur?.data && !cur.data.released) return false;
  return !(!cur && await fsGet(slugCode(h)));   // trùng link quỹ ngắn của người khác (/abc) cũng là đã có người dùng
}
const prof = (o, h) => ({ uid: o.uid, handle: h, name: o.name, avatar: o.avatar || '', book: o.book, groups: o.groups || [], ...(o.pin ? { pin: o.pin } : {}) });   // pin: { s: muối, h: băm PBKDF2 } của mã PIN 4 số   // uid luôn đứng đầu (firestore.rules đọc nó)
async function claimHandle(h, o){
  if (!okHandle(h)) return 'bad';
  const cur = await fsGet(usrCode(h));
  if (cur?.data && cur.data.uid !== o.uid && !cur.data.released) return 'taken';
  if (!cur && slugCode(h) !== o.book && await fsGet(slugCode(h))) return 'taken';   // trùng link quỹ ngắn của người khác (/abc); quỹ ngắn của chính mình thì được lấy tên đó
  return fsPut(usrCode(h), prof(o, h), Date.now(), cur ? cur.ut : 'new');
}
/* quyền: chỉ người tạo nhóm mới xoá được nhóm; chỉ người tạo khoản chi mới sửa/xoá được khoản đó (dữ liệu cũ chưa ghi người tạo thì ai cũng sửa được) */
const myUid = () => root.acct?.uid || '';
/* Người tạo nhóm luôn là thành viên đầu tiên (gắn với tài khoản của họ), có sẵn khi tạo nhóm và không bỏ ra được */
const selfMember = () => ({ id: uid++, name: root.acct.name, uid: root.acct.uid, handle: root.acct.handle, avatar: root.acct.avatar || '' });
const newDraft = from => ({ id: null, from, name: '', members: root.acct?.uid ? [selfMember()] : [], fund: { sponsors: [], contrib: {} } });
const creatorOf = () => (draft?.id && root.groups.find(g => g.id === draft.id)?.by) || myUid();
const isCreatorM = m => !!m.uid && m.uid === creatorOf();
/* Lịch sử hoạt động của nhóm (g.log): chỉ thêm vào, không sửa, không xoá (không có nút nào để xoá; chỉ khi nhóm bị xoá thì mất theo). Mỗi dòng giữ sẵn tên người làm và câu mô tả lúc đó. */
const LOGMAX = 2000;   // giữ dưới giới hạn 1MB của một tài liệu Firestore
const unionLog = (a, b) => { const m = new Map(); [...(a || []), ...(b || [])].forEach(x => m.set(x.id, x)); const l = [...m.values()].sort((x, y) => x.at - y.at || x.id - y.id); return l.length > LOGMAX ? l.slice(-LOGMAX) : l; };
let lastLid = 0;   // id tăng dần trong một máy: hai dòng ghi cùng một mili-giây vẫn đúng thứ tự thao tác
const logAct = (g, k, msg, x) => { if (g && msg) g.log = unionLog(g.log, [{ id: lastLid = Math.max(newId(), lastLid + 1), at: Date.now(), by: myUid(), who: root.acct?.name || 'Ai đó', k, msg, ...(x || {}) }]); };   // x: dữ liệu cho trang Thông báo (n = loại, số tiền từng người…)   // k: loại việc (quyết định icon + màu ở trang lịch sử)
const canExp = e => !e?.by || !myUid() || e.by === myUid();
const canDelG = g => !g?.by || !myUid() || g.by === myUid();
const canItem = it => it?.by ? !myUid() || it.by === myUid() : canDelG(G);   // xóa đồ kho: ai tạo đồ thì người đó xóa (POD 20/11); đồ cũ chưa có người tạo thì người tạo nhóm. Thêm/sửa: ai trong nhóm cũng được
const newId = () => Date.now() * 1000 + rnd(1000);   // id khoản chi không trùng giữa các máy (nhóm chung)
const byName = (by, fb, g = G) => !by ? '' : by === myUid() ? 'tôi' :   // của chính mình: "Tạo bởi tôi"
  (g?.members.find(m => m.uid === by)?.name || fb || 'Người khác');
const formRO = () => { const g = draft?.id && root.groups.find(x => x.id === draft.id); return !!g && !canDelG(g); };   // thành viên không phải người tạo: chỉ được thêm thành viên
function lockedExp(id){ const e = G?.exps.find(x => x.id === +id); if (e && !canExp(e)) { toast('Chỉ người tạo khoản chi mới sửa được'); return true; } return false; }
const pickAcct = o => ({ uid: o.uid, handle: o.handle, name: o.name, avatar: o.avatar || '' });
let HDOC = null, ready = !SLUG;
async function boot(){
  if (!ready) {   // /<tên>: tìm hồ sơ để biết sổ của người đó. Link chưa ai dùng (không có hồ sơ, không có quỹ cũ, máy này cũng chưa có gì) thì về trang chào "/": không tự tạo tài khoản hay bản ghi nào cho link gõ tay
    let none = false;
    try {
      const u = /^[a-z0-9]{2,30}$/.test(SLUG) ? await getUser(SLUG) : null;
      if (u) { HDOC = u.data; book = u.data.book; if (!store.get(BOOK)) store.set(BOOK, book); if (u.data.handle !== SLUG) history.replaceState(null, '', '/' + u.data.handle); }
      else none = !root.acct?.uid && !root.groups.length && !await fsGet(book);   // book = mã quỹ ngắn kiểu cũ của link này
    } catch(_) {}   // lỗi mạng: không kết luận là "chưa ai dùng", để người đã có dữ liệu vẫn mở được
    if (none) { try { localStorage.removeItem(KEY); } catch(_) {} location.replace('/'); return; }
    if (HDOC?.pin && root.acct?.uid !== HDOC.uid && !authed(HDOC.uid)) { auth = { mode: 'login', step: 'login', u: { data: HDOC }, err: '' }; HDOC = null; go('pin'); return; }   // link /tên của tài khoản có PIN, máy này chưa đăng nhập: hỏi PIN trước, chưa tải dữ liệu
    ready = true;
  }
  await syncNow(); await ensureAcct(); await syncShared(); refreshLinked();
  rtStart();
}
async function ensureAcct(){
  if (!onWeb) return;
  try {
    if (HDOC && root.acct?.handle !== HDOC.handle) { root.acct = pickAcct(HDOC); save(); }
    if (hadUpload && root.acct?.handle) { const u = await getUser(root.acct.handle); if (u && u.data.uid === root.acct.uid && String(u.data.avatar || '').startsWith('data:')) await fsPut(usrCode(u.data.handle), { ...prof(u.data, u.data.handle), avatar: '' }, Date.now(), u.ut); }   // hồ sơ cũ còn ảnh tải lên
  } catch(_) {}
  if (root.acct?.handle && (!SLUG || HDOC) && location.pathname !== '/' + root.acct.handle) history.replaceState(null, '', '/' + root.acct.handle);
  try { const me = root.acct; if (me?.uid && me.handle && !auth) { const u = await getUser(me.handle); if (u?.data && u.data.uid === me.uid) { if (u.data.pin) authMark(me.uid); else if (!['form', 'pin'].includes(view) && $('#sheet').hidden) { auth = { mode: 'upgrade', step: 'set', err: '' }; go('pin'); return; } } } } catch(_) {}   // tài khoản tạo trước khi có PIN: đặt PIN một lần
  if (isAcct() || document.body.classList.contains('drwon')) return; renderBar();
}
/* nhóm chung */
const dirtyG = new Set();
function markShared(g){ if (g?.sid) { g.uat = Date.now(); dirtyG.add(g); } }
/* Gộp nhóm chung theo từng khoản thay vì ghi đè cả nhóm, để hai người sửa cùng lúc không mất của nhau:
   - mỗi khoản chi / lần góp thêm có uat riêng; khoản của người khác luôn lấy bản trên máy chủ (mình không được sửa)

   Bấm ra vùng tối bên ngoài vẫn là huỷ như cũ (bgDown), đổi cửa sổ khác không tính là xác nhận (hasFocus). */
let bgDown = false;
document.addEventListener('pointerdown', e => { bgDown = e.target.id === 'cmpBg' || e.target.id === 'ampBg'; }, true);
document.addEventListener('focusout', e => {
  if (bgDown || !document.hasFocus()) return;
  if (e.target.id === 'ampInput') closeAmt();
  else if (e.target.id === 'cmpName') closeComposer(!!e.target.value.trim());
});
/* Ô số tiền và tên khoản chi: nhớ giá trị lúc bắt đầu gõ, gõ xong (rời ô) mới ghi lịch sử một dòng nếu có đổi */
const gnm = x => x?.name ? `"${x.name}"` : 'khoản chi này';
function amtState(el){
  const d = el.dataset || {}; if (view !== 'group' || !G) return null;
  if (d.amt) { const [eid, mid] = d.amt.split(':').map(Number), e = G.exps.find(x => x.id === eid), f = e?.flows.find(x => x.id === mid); if (!f) return null;
    return { key: 'a' + d.amt, cur: Number(f.amt) || 0, say: v => !v ? ['rm', `Bỏ số tiền của ${mid === FUND ? 'Quỹ chung' : nm(mid)} ở ${gnm(e)}`] : mid === FUND ? ['out', `Rút quỹ ${fmt(v)} cho ${gnm(e)}`] : f.role === 'fixed' ? ['out', `${nm(mid)} đóng cố định ${fmt(v)} ở ${gnm(e)}`] : f.role === 'donate' ? ['pay', `${nm(mid)} tài trợ ${fmt(v)} ở ${gnm(e)}`] : ['pay', `${nm(mid)} ứng ${fmt(v)} cho ${gnm(e)}`] }; }
  if (d.tamt) { const [aid, mid] = d.tamt.split(':').map(Number), a = (G.fund?.adds || []).find(x => x.id === aid), p = a && tps(a).find(x => x.id === mid); if (!p) return null;
    return { key: 't' + d.tamt, cur: Number(p.amt) || 0, say: v => v ? ['pay', `${nm(mid)} góp thêm ${fmt(v)} vào quỹ`] : ['rm', `Bỏ khoản góp thêm của ${nm(mid)}`] }; }
  return null;
}
const logBase = new Map(); let nameBase = null;
document.addEventListener('focusin', e => { const st = amtState(e.target); if (st) logBase.set(st.key, st.cur); const id = e.target.dataset?.ename; if (id) nameBase = { id: +id, was: (G?.exps.find(x => x.id === +id)?.name || '').trim() }; });
document.addEventListener('focusout', e => {
  const st = amtState(e.target);
  if (st && logBase.has(st.key)) { const was = logBase.get(st.key); logBase.delete(st.key); if (st.cur !== was) { logAct(G, ...st.say(st.cur)); save(); } }
  const id = e.target.dataset?.ename;
  if (id && nameBase?.id === +id) { const x = G?.exps.find(y => y.id === +id), now = (x?.name || '').trim(), was = nameBase.was; nameBase = null;
    if (x && now !== was) { logAct(G, 'exp', !was ? `Thêm khoản chi "${now}"` : now ? `Đổi tên khoản chi từ "${was}" thành "${now}"` : `Xóa tên khoản chi "${was}"`); save(); } }
});
document.addEventListener('focusin', e => { if (e.target.matches?.('input:not([type=checkbox]):not([type=file]):not([type=date]),textarea') && !e.target.closest('.sheet')) { document.body.classList.add('kb'); if (document.body.classList.contains('kbbar')) { kbWatch(true); setTimeout(keepAboveBar, 350); } } });
/* iPhone: ô đang gõ bị xoá khỏi trang (chuyển trang) thì không có focusout → body.kb kẹt lại và thanh nút dưới bị ẩn mãi (lỗi mất nút khi lưu app ra màn hình). Kiểm tra lại mỗi lần vẽ trang / quay lại app. */
function kbSync(){ const a = document.activeElement, typing = a && a.isConnected && a.id !== 'kbHold' && a.matches?.('input:not([type=checkbox]):not([type=file]):not([type=date]),textarea') && !a.closest('.sheet'); if (!typing) { document.body.classList.remove('kb'); try { kbWatch(false); } catch(_) {} } if (view !== 'pin') $('#kbHold')?.remove(); }
function vpFix(){ const max = Math.max(0, document.documentElement.scrollHeight - innerHeight); if (scrollY > max) scrollTo(0, max); }   // bàn phím đóng mà trang còn bị đẩy lên: kéo về đúng chỗ
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { kbSync(); vpFix(); } });
window.visualViewport?.addEventListener('resize', () => { if (!document.activeElement?.matches?.('input,textarea')) { kbSync(); setTimeout(vpFix, 50); } });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a?.matches?.('input,textarea')) { document.body.classList.remove('kb'); kbWatch(false); cmpPlace(); setTimeout(vpFix, 250); [400, 900, 1600].forEach(t => setTimeout(refit, t)); } }, 60));   // bàn phím đóng xong mới đo lại đáy khung
['gesturestart','gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
/* vuốt: ở trang nhóm vuốt trái → phải để mở menu trái (menu chạy theo ngón tay), menu đang mở thì vuốt phải → trái để đóng;
   các trang khác vuốt sang phải để quay lại */
(() => {   // trang Khoản chi / Góp quỹ / Sửa: vuốt sang phải để quay lại, cùng kiểu với các trang khác (trang lùi theo tay 60%, mờ dần, quá 80px thì quay lại)
  let x0 = 0, y0 = 0, act = false, lk = null, dxx = 0;
  const sp = () => !$('#sheet').hidden && $('#sheetBody.asheet') ? $('#sheetBody') : null;
  document.addEventListener('touchstart', e => { act = false; lk = null; dxx = 0; if (!sp() || e.touches.length !== 1 || $('.dlg') || e.target.closest('input, textarea, .xswipe')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; act = true; }, { passive: true });
  document.addEventListener('touchcancel', () => { if (!act) return; act = false; document.body.classList.remove('sheetdrag'); const p = sp(); if (p) { p.style.transition = ''; p.style.transform = ''; p.style.opacity = ''; } }, { passive: true });   // cử chỉ hệ thống cướp mất lần chạm: đừng để trang sau / thanh nút bị ẩn mãi
  document.addEventListener('touchmove', e => { if (!act) return; const x = e.touches[0].clientX - x0, y = e.touches[0].clientY - y0;
    if (lk === null && (Math.abs(x) > 10 || Math.abs(y) > 10)) lk = Math.abs(x) > Math.abs(y) * 1.5 && x > 0 ? 'x' : 'y';
    if (lk !== 'x') return; dxx = Math.max(0, x); const p = sp(); if (p) { document.body.classList.add('sheetdrag'); p.style.transition = 'none'; p.style.transform = `translateX(${dxx * .6}px)`; p.style.opacity = String(1 - Math.min(dxx / 600, .4)); } }, { passive: true });
  document.addEventListener('touchend', () => { if (!act) return; act = false; const p = sp(); if (!p) return; p.style.transition = 'transform .2s var(--ease), opacity .2s'; p.style.transform = ''; p.style.opacity = '';
    const goBack = lk === 'x' && dxx > 80; setTimeout(() => { p.style.transition = ''; document.body.classList.remove('sheetdrag'); }, 220); if (goBack) { document.body.classList.remove('sheetdrag'); $('#sheet .rback')?.click(); } });
})();
(() => {
  let sx = 0, sy = 0, on = false, dx = 0, lock = null, mode = null, started = false;
  const W = 300, backBtn = () => $('#pinBack') || $('#notiBack') || $('#formBack') || $('#sBack') || $('#acBack') || $('#logBack') || $('#gBack') || $('#kBack');
  const app = () => $('#app'), bar = () => $('.bar'), drw = () => $('#drw'), dp = () => $('#drw .dp'), db = () => $('#drwBg');
  const setX = (x, anim) => {   // x: menu mở bao nhiêu px (0..300)
    const tr = anim ? 'transform .25s var(--ease)' : 'none';
    [app(), bar()].forEach(el => { el.style.transition = tr; el.style.transform = `translateX(${x}px)`; el.style.clipPath = 'none'; });   // đang kéo: bỏ phần cắt 66px (chỉ đúng khi menu mở hẳn), không thì trang bị cắt nửa
    dp().style.transition = tr; dp().style.transform = `translateX(${x - W}px)`;
    db().style.transition = anim ? 'opacity .25s var(--ease)' : 'none'; db().style.opacity = String(x / W);
  };
  const clearX = () => [app(), bar(), dp(), db()].forEach(el => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; el.style.clipPath = ''; });
  document.addEventListener('touchstart', e => {
    on = false; lock = null; dx = 0; mode = null; started = false;
    if (e.touches.length !== 1 || document.querySelector('#sheet:not([hidden]), .cmp:not([hidden]), .lacts, .dlg')) return;
    if (document.body.classList.contains('drwon')) mode = 'close';
    else if (e.target.closest('.scroll, .tblw, input, textarea, .sheet, .cswipe')) return;
    else if (view === 'group' && $('#gMenu')) mode = 'open';
    else if (backBtn()) mode = 'back';
    else return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!on) return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (lock === null && (Math.abs(x) > 10 || Math.abs(y) > 10)) lock = Math.abs(x) > Math.abs(y) * 1.5 && (mode === 'close' ? x < 0 : x > 0) ? 'x' : 'y';
    if (lock !== 'x') return;
    if (mode === 'back') { dx = Math.max(0, x); const a = app(); a.style.transition = 'none'; a.style.transform = `translateX(${dx * .6}px)`; a.style.opacity = String(1 - Math.min(dx / 600, .4)); return; }
    if (mode === 'open') { if (!started) { started = true; fillDrawer(); drw().hidden = false; document.activeElement?.blur?.(); } dx = Math.max(0, Math.min(W, x)); setX(dx); return; }
    dx = Math.max(-W, Math.min(0, x)); setX(W + dx);
  }, { passive: true });
  const end = () => {
    if (!on) return; on = false;
    if (mode === 'back') {
      const a = app(); a.style.transition = 'transform .2s var(--ease), opacity .2s'; a.style.transform = ''; a.style.opacity = '';
      if (lock === 'x' && dx > 80) { const b = backBtn(); setTimeout(() => { a.style.transition = ''; }, 220); b && b.click(); }
      return;
    }
    if (mode === 'open' && started) {
      const go = dx > 80; setX(go ? W : 0, true);
      setTimeout(() => { if (go) { document.body.classList.add('drwon'); clearX(); } else { clearX(); drw().hidden = true; dp().innerHTML = ''; } }, 260);
      return;
    }
    if (mode === 'close' && lock === 'x') {
      const go = dx < -60; setX(go ? 0 : W, true);
      setTimeout(() => { if (go) { document.body.classList.remove('drwon'); clearX(); drw().hidden = true; dp().innerHTML = ''; } else clearX(); }, 260);
    }
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });   // iPhone huỷ chạm giữa chừng: vẫn đưa menu về đúng chỗ
})();

document.addEventListener('focusout', e => { const id = e.target.dataset?.ename; if (id && !e.relatedTarget?.matches?.('[data-edate]')) setTimeout(() => endEdit(+id), 0); });
/* Kho đồ: nhấn giữ card đồ → hiện nút Xóa đồ ngay dưới card đó (chỉ người tạo đồ xóa được) */
let lpT = null, lpFired = false, lpX = 0, lpY = 0;
document.addEventListener('pointerdown', e => {
  $('.kdel') && !e.target.closest('.kdel') && ($('.kdel').remove());
  const row = e.target.closest?.('.krow2'); if (!row) return; const rid = row.dataset.kedit || row.dataset.item; lpX = e.clientX; lpY = e.clientY; clearTimeout(lpT);
  lpT = setTimeout(() => { const it = itemOf(G, +rid); if (!it) return; lpFired = true; setTimeout(() => { lpFired = false; }, 700); navigator.vibrate?.(10);
    kAdd = false; kEdit = it.id; itDraft = { ...it, payer: it.payer ?? FUND, atDay: isoDay(it.at || Date.now()) }; rerender(); }, 450);   // Figma 23: nhấn giữ = mở sửa tại chỗ kèm nút Xóa đồ
}, true);
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => clearTimeout(lpT), true));
document.addEventListener('pointermove', e => { if (lpT && Math.hypot(e.clientX - lpX, e.clientY - lpY) > 8) clearTimeout(lpT); }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest?.('.krow2')) e.preventDefault(); });
document.addEventListener('click', e => { if (lpFired && e.target.closest?.('.krow2')) { lpFired = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('click', e => { const i = e.target.closest('.cal, .xbd, .kdt')?.querySelector('input[type=date]'); if (!i) return; try { i.showPicker(); e.preventDefault(); } catch(_) {} });
document.addEventListener('focusin', e => { const t = e.target; if (t.matches('[data-amt],[data-tamt]') && !t.readOnly) setTimeout(() => { if (document.activeElement === t) t.select?.(); }, 0); });   // chỉ chọn hết số khi ô còn đang được focus (select() trên Chrome tự cướp focus)
window.addEventListener('resize', () => { if (view === 'home') fitWelcome(); });
document.fonts?.ready.then(() => { if (view === 'home') fitWelcome(); }); addEventListener('load', () => { if (view === 'home') fitWelcome(); });

/* long-press an expense card → sheet */
let pressT = null, pressEl = null, startXY = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.exp, .sumv .stack > :is(.fund,.txcard,.tblw)'); if (!card || e.target.closest('input') || (e.target.closest('button') && !e.target.closest('.tx'))) return;
  const sc = !card.classList.contains('exp'); if (sc) card.classList.add('scard');
  pressEl = card; startXY = [e.clientX, e.clientY]; card.classList.add('press');
  pressT = setTimeout(() => { card.classList.remove('press'); suppressClick = true; setTimeout(() => suppressClick = false, 600); sc ? pressSheet(0, card) : card.dataset.top ? pressTop(+card.dataset.top) : card.dataset.kho ? pressTop(+card.dataset.kho, 'kho') : pressSheet(+card.dataset.exp); pressT = null; }, 500);
});
const cancelPress = () => { clearTimeout(pressT); pressT = null; pressEl?.classList.remove('press'); pressEl = null; };
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
document.addEventListener('pointermove', e => { if (pressT && startXY && Math.hypot(e.clientX - startXY[0], e.clientY - startXY[1]) > 10) cancelPress(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.exp, .sumv .stack > *')) e.preventDefault(); });

render();
if (BILL) loadBill(); else boot();
})();
</script>
