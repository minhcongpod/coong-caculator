name: Link test v2 (nhánh Claude)

# Đẩy nhánh làm bản v2 lên một kênh preview riêng "v2" của Firebase,
# KHÔNG đụng bản chính coongno.web.app và cũng không đụng kênh "dev".
on:
  push:
    branches: [claude/project-thread-xroxrn]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: quanlyquy-f5fce
          channelId: v2
          expires: 30d
      - run: echo "Link test v2 - ${{ steps.deploy.outputs.details_url }}" >> $GITHUB_STEP_SUMMARY
