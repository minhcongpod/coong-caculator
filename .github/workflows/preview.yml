name: Link test (nhánh dev)

# Mỗi lần đẩy lên nhánh dev: đưa bản mới lên một link test riêng của Firebase
# (kênh preview "dev"), KHÔNG đụng bản chính quanlyquy.web.app.
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tạo site coongno.web.app nếu chưa có (chạy lại không sao)
      - name: Tạo Hosting site coongno
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 hosting:sites:create coongno --project quanlyquy-f5fce --non-interactive || echo "Site có thể đã tồn tại"
          npx -y firebase-tools@13 hosting:sites:list --project quanlyquy-f5fce --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: quanlyquy-f5fce
          channelId: dev
          expires: 30d
      - run: echo "Link test - ${{ steps.deploy.outputs.details_url }}" >> $GITHUB_STEP_SUMMARY
